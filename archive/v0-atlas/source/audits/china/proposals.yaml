periodization:
  current_verdict: >-
    Les cinq macro-ères sont lisibles mais historiquement anisotropes : l'ère 1
    est téléologique, l'ère 2 couvre 2 133 ans et masque les divisions, l'ère 3
    est vide dans les données, les ères 4 et 5 sont sous-périodisées. La
    périodisation politique actuelle doit être conservée pour la navigation,
    mais documentée par des sous-périodes et corrigée par des bornes alternatives.
  proposed_changes:
    - action: "keep"
      era_name: "Cinq ères Vectemporel"
      proposal: >-
        Conserver les cinq macro-ères comme cadre de navigation, en ajoutant des
        sous-périodes internes (non affichées comme des ères) pour les divisions
        impériales, la République, la Chine maoïste et la période post-1978.
      rationale: >-
        Le changement du nombre d'ères casserait la lisibilité et l'interface ;
        les sous-périodes permettent de corriger l'effet de continuité sans
        refonte complète.
      sources: ["SRC-001", "SRC-002", "SRC-008", "SRC-013"]
    - action: "rename"
      era_name: "Dynasties fondatrices"
      proposal: "Renommer « Shang, Zhou et Royaumes combattants »."
      rationale: >-
        « Fondatrices » projette une téléologie nationale et masque la diversité
        politique des cités-États, des Royaumes combattants et des peuples non-Han.
      sources: ["SRC-001"]
    - action: "rename"
      era_name: "Empire unifié"
      proposal: "Renommer « Empires et divisions » et documenter les sous-périodes Qin-Han, Division, Sui-Tang, Song-Yuan, Ming-Qing."
      rationale: >-
        L'empire n'est pas continuellement unifié : 220-589, 907-960 et 1127-1279
        sont des périodes de division ou de régimes concurrents.
      sources: ["SRC-001"]
    - action: "keep"
      era_name: "République et révolutions"
      proposal: >-
        Conserver l'ère 1912-1949 et la remplir avec les propositions PROP-001 à
        PROP-009, en distinguant 1912-1927, 1927-1937 et 1937-1949.
      rationale: >-
        L'ère est actuellement vide, alors qu'elle concentre la chute de l'empire,
        la construction du parti-État, la guerre sino-japonaise et la guerre civile.
      sources: ["SRC-002", "SRC-003", "SRC-004"]
    - action: "split"
      era_name: "Chine populaire (1949-1978)"
      proposal: >-
        Scinder en « Chine maoïste (1949-1976) » et « Transition (1976-1978) »,
        ou conserver l'ère avec des sous-périodes 1949-1957, 1958-1965, 1966-1976.
      rationale: >-
        La mort de Mao en 1976 et la transition vers Deng sont une rupture
        distincte du troisième plénum de 1978.
      sources: ["SRC-007", "SRC-008"]
    - action: "split"
      era_name: "Réforme et puissance (1978-2026)"
      proposal: >-
        Scinder en « Réformes (1978-2001) » et « Puissance et tensions
        (2001-2026) », ou conserver l'ère avec des sous-périodes 1978-1992,
        1992-2001, 2001-2012, 2012-2026.
      rationale: >-
        L'accession à l'OMC en 2001 et l'arrivée de Xi Jinping en 2012 sont des
        bifurcations majeures que l'ère unique efface.
      sources: ["SRC-013", "SRC-014"]

