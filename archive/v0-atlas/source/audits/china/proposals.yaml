    subtitle: "Nanjing, abdication, échec de 1913"
    tags: ["politique", "guerre"]
    importance: 3
    summary: >-
      Le 1er janvier 1912, Sun Yat-sen proclame la République à Nanjing ; Puyi
      abdique le 12 février. En juillet 1913, la Seconde Révolution contre Yuan
      Shikai échoue, ouvrant la fragmentation des seigneurs de la guerre.
    sources: ["SRC-002", "SRC-001"]
