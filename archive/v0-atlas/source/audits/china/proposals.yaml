      nationalisme et de la Nouvelle Culture.
    sources: ["SRC-003", "SRC-001"]
    confidence: "high"
    rationale: >-
      Événement charnière de l'ère 1912-1949, absent de la frise ; permet
      d'intégrer étudiants, ouvriers et femmes.
