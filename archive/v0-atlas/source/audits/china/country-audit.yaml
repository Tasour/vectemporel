actors:
  - id: "ACTOR-001"
    label: "Sun Yat-sen (1866-1925)"
    type: "individual"
    roles: ["révolutionnaire", "président provisoire de la République (1912)", "fondateur du Kuomintang"]
    period_ids: ["ERA-3"]
    places: ["PLACE-002", "PLACE-003", "PLACE-007"]
    resources:
      - "Réseaux de la Tongmenghui et du Kuomintang"
      - "Soutien des Chinois d'outre-mer et de militants japonais"
      - "Légitimité de père de la République"
    constraints:
      - "Absence d'armée propre face à Yuan Shikai et aux seigneurs de la guerre"
      - "Dépendance financière et diplomatique"
      - "Fragmentation du mouvement révolutionnaire"
    networks:
      - "Huang Xing, Song Jiaoren, Hu Hanmin"
      - "Communautés chinoises de Honolulu, Tokyo, Singapour"
      - "Cercles libéraux et chrétiens"
    counterpowers:
      - "Yuan Shikai et l'armée de Beiyang"
      - "Loyalistes Qing, puis gouvernements de Pékin"
      - "Puissances étrangères"
    assessment: >-
      Figure fondatrice du républicanisme chinois, mais son pouvoir fut fragile et
      dépendant de compromis. La République de 1912 est moins une œuvre achevée
      qu'un compromis entre révolutionnaires, élites provinciales et armée.
    memory: >-
      Commémoré à Taïwan comme père de la nation et en RPC comme révolutionnaire
      précurseur ; les usages politiques divergent.
    sources: ["SRC-001", "SRC-002"]
  - id: "ACTOR-002"
    label: "Soong Ching-ling / Song Qingling (1893-1981)"
    type: "individual"
    roles: ["épouse de Sun Yat-sen", "dirigeante de la gauche du Kuomintang", "haute responsable de la RPC"]
    period_ids: ["ERA-3", "ERA-4"]
    places: ["PLACE-003", "PLACE-001"]
    resources:
      - "Prestige lié à Sun Yat-sen"
      - "Réseaux familiaux Soong et internationaux"
      - "Engagement dans les organisations de femmes et d'enfance"
    constraints:
      - "Marginalisation par la droite du KMT"
      - "Discipline de parti et contrôle politique en RPC"
      - "Rôle largement symbolique"
    networks:
      - "Sun Yat-sen, KMT de gauche, PCC"
      - "Organisations de bienfaisance et de femmes"
      - "Milieux internationalistes"
    counterpowers:
      - "Chiang Kai-shek et la droite du KMT"
      - "Appareil du PCC"
    assessment: >-
      Passeuse entre le républicanisme et la RPC, elle est utilisée comme symbole
      d'unité. Son influence réelle fut limitée par les contraintes de parti et de genre.
    memory: >-
      Présidente honoraire de la RPC en 1981 ; commémorations officielles, usages
      dans les récits de front uni.
    sources: ["SRC-001", "SRC-008"]
  - id: "ACTOR-003"
    label: "Qiu Jin (1875-1907)"
    type: "individual"
    roles: ["révolutionnaire", "féministe", "écrivaine", "martyre républicaine"]
    period_ids: ["ERA-2", "ERA-3"]
    places: []
    resources:
      - "Réseaux d'étudiantes et d'exilés au Japon"
      - "Sociétés secrètes et groupes révolutionnaires"
      - "Production littéraire et journalisme"
    constraints:
      - "Normes de genre et contrôle familial"
      - "Police impériale Qing"
      - "Faible base militaire"
    networks:
      - "Xu Xilin, groupes révolutionnaires de Shaoxing"
      - "Étudiantes chinoises à Tokyo"
      - "Tongmenghui"
    counterpowers:
      - "État Qing"
      - "Patriarcat familial et élites lettrées"
    assessment: >-
      Figure de la révolution et du féminisme naissant, exécutée après une tentative
      d'insurrection. Son action précède 1911 et ne se réduit pas à une icône.
      Shaoxing et Tokyo, ses principaux lieux d'action, manquent dans la liste des
      douze lieux proposés : dette à corriger.
    memory: >-
      Martyre commémorée en RPC ; tombeau à Hangzhou, usages scolaires et féministes.
    sources: ["SRC-001", "SRC-002"]
  - id: "ACTOR-004"
    label: "Ding Ling (1904-1986)"
    type: "individual"
    roles: ["écrivaine", "militante communiste", "figure du féminisme littéraire"]
    period_ids: ["ERA-3", "ERA-4"]
    places: ["PLACE-003", "PLACE-001"]
    resources:
      - "Notoriété littéraire"
      - "Réseaux intellectuels et féminins"
      - "Adhésion au PCC"
    constraints:
      - "Discipline de parti et campagnes de rectification"
      - "Censure et purges"
      - "Exil intérieur et prison"
    networks:
      - "Hu Yepin, Lu Xun, cercles littéraires de Shanghai"
      - "Appareil culturel du PCC"
    counterpowers:
      - "KMT et censure nationaliste"
      - "Directions du PCC lors des campagnes"
    assessment: >-
      Autrice majeure des années 1920-1930, elle incarne les tensions entre
      émancipation féminine et discipline révolutionnaire. Purge en 1955, exil,
      prison pendant la Révolution culturelle, réhabilitée en 1979.
    memory: >-
      Réhabilitée et célébrée comme écrivaine progressiste ; son féminisme est
      souvent édulcoré dans les commémorations officielles.
    sources: ["SRC-001", "SRC-007"]
  - id: "ACTOR-005"
    label: "Mao Zedong (1893-1976)"
    type: "individual"
    roles: ["fondateur de la RPC", "président du PCC", "théoricien politique"]
    period_ids: ["ERA-3", "ERA-4"]
    places: ["PLACE-008", "PLACE-001", "PLACE-003"]
    resources:
      - "Parti, armée rouge, bases rurales"
      - "Légitimité révolutionnaire et propagande"
      - "Culte de la personnalité"
    constraints:
      - "Concurrence du KMT et du Japon"
      - "Factions du parti et contraintes soviétiques"
      - "Économie agraire et pénurie de cadres"
    networks:
      - "Zhou Enlai, Liu Shaoqi, Zhu De, Lin Biao"
      - "Jiang Qing et cercles radicaux"
      - "Réseaux paysans et militaires"
    counterpowers:
      - "KMT, États-Unis, URSS"
      - "Oppositions internes au parti"
      - "Résistances paysannes et ouvrières"
    assessment: >-
      Artisan de la révolution et de l'État-parti, il porte aussi la responsabilité
      du Grand Bond, de la famine et de la Révolution culturelle. Le bilan est
      indissociablement constitutif et destructeur.
    memory: >-
      Mausolée à Pékin, pensée Mao Zedong au centre du canon officiel ; mémoires
      critiques et commémorations contestées.
    sources: ["SRC-001", "SRC-008", "SRC-009"]
  - id: "ACTOR-006"
    label: "Chiang Kai-shek (1887-1975)"
    type: "individual"
    roles: ["chef du Kuomintang", "président de la République de Chine", "commandant militaire"]
    period_ids: ["ERA-3", "ERA-4"]
    places: ["PLACE-002", "PLACE-005", "PLACE-003"]
    resources:
      - "Académie militaire de Whampoa"
      - "Parti-État du KMT et armée"
      - "Aide américaine"
    constraints:
      - "Seigneurs de la guerre et fragmentation"
      - "PCC et opposition de gauche"
      - "Corruption, inflation et érosion du soutien populaire"
    networks:
      - "Famille Soong, frères Chen, généraux du KMT"
      - "États-Unis, diplomatie alliée"
      - "Élites provinciales"
    counterpowers:
      - "PCC et armées communistes"
      - "Wang Jingwei et la gauche du KMT"
      - "Étudiants, ouvriers, régions autonomes"
    assessment: >-
      Bâtisseur d'un parti-État autoritaire et modernisateur inégal, il perd la
      guerre civile et installe le régime du KMT à Taïwan. Son bilan inclut la
      répression politique et les compromis avec les élites locales.
    memory: >-
      Commémoré à Taïwan, contesté en RPC ; les récits divergent sur la guerre,
      la terreur blanche et la modernisation.
    sources: ["SRC-001", "SRC-002"]
  - id: "ACTOR-007"
    label: "Deng Xiaoping (1904-1997)"
    type: "individual"
    roles: ["dirigeant suprême", "architecte des réformes", "ancien secrétaire général du PCC"]
    period_ids: ["ERA-4", "ERA-5"]
    places: ["PLACE-001", "PLACE-003"]
    resources:
      - "Réseaux du parti et de l'armée"
      - "Légitimité de vétéran révolutionnaire"
      - "Coalition réformiste"
    constraints:
      - "Héritage maoïste et elders conservateurs"
      - "Crise de 1989 et légitimité du parti"
      - "Inégalités et tensions sociales"
    networks:
      - "Zhao Ziyang, Hu Yaobang, Chen Yun"
      - "Investisseurs étrangers et technocrates"
      - "Cadres provinciaux"
    counterpowers:
      - "Aile conservatrice du parti"
      - "Mouvements étudiants et ouvriers"
      - "Armée et sécurité"
    assessment: >-
      Il engage l'ouverture et la croissance, mais maintient le monopole du parti
      et ordonne la répression de 1989. Le « miracle » économique est inséparable
      d'inégalités, de migrations massives et de coûts environnementaux.
    memory: >-
      « Architecte de la Chine moderne » dans le récit officiel ; mémoire critique
      chez les victimes de 1989 et les militants des droits.
    sources: ["SRC-013", "SRC-014"]
