claims:
  - id: "CLAIM-001"
    subject: "Shang"
    predicate: "datation conventionnelle"
    object: "vers -1600"
    text: >-
      La date de -1600 est une convention chronologique pour le début des Shang ;
      les premières écritures abondantes proviennent d'Anyang (vers -1250) et
      l'identification d'Erlitou reste débattue.
    confidence: "disputed"
    sources: ["SRC-001"]
    revisions:
      - "Source unique (synthèse) ; corroboration par une seconde synthèse à ajouter."
  - id: "CLAIM-002"
    subject: "Qin"
    predicate: "unification et standardisation"
    object: "-221"
    text: >-
      L'unification Qin de -221 est associée à la standardisation de l'écriture,
      des poids, des mesures et de la monnaie, ainsi qu'à une administration
      centralisée ; ces mesures furent imposées par la conquête et la coercition.
    confidence: "certain"
    sources: ["SRC-001"]
    revisions:
      - "Source unique (synthèse) ; corroboration par une seconde synthèse à ajouter."
  - id: "CLAIM-003"
    subject: "Empire chinois"
    predicate: "continuité et divisions"
    object: "-221/1912"
    text: >-
      L'expression « Empire unifié » masque des périodes prolongées de division
      (220-589, 907-960, 1127-1279) et des régimes concurrents ; l'unité est une
      prétention récurrente, pas une donnée continue.
    confidence: "certain"
    sources: ["SRC-001"]
    revisions:
      - "Source unique (synthèse) ; corroboration par une seconde synthèse à ajouter."
  - id: "CLAIM-004"
    subject: "Révolution de 1911"
    predicate: "séquence"
    object: "1911-1912"
    text: >-
      Le soulèvement de Wuchang du 10 octobre 1911 déclenche la chute des Qing ;
      la République de Chine est proclamée à Nanjing le 1er janvier 1912 et
      l'abdication de Puyi intervient le 12 février 1912.
    confidence: "certain"
    sources: ["SRC-001", "SRC-002"]
    revisions: []
  - id: "CLAIM-005"
    subject: "Mouvement du 4 Mai"
    predicate: "date et portée"
    object: "1919-05-04"
    text: >-
      Le 4 mai 1919, des étudiants manifestent à Pékin contre le traitement de la
      Chine à Versailles ; le mouvement s'étend aux villes et aux milieux ouvriers
      et devient un moment fondateur du nationalisme et de la Nouvelle Culture.
    confidence: "certain"
    sources: ["SRC-003", "SRC-001"]
    revisions: []
  - id: "CLAIM-006"
    subject: "PCC"
    predicate: "fondation"
    object: "juillet 1921"
    text: >-
      Le premier congrès du Parti communiste chinois se tient à Shanghai en
      juillet 1921, avec une aide du Komintern ; les récits sur le nombre exact de
      participants et le lieu de clôture varient.
    confidence: "probable"
    sources: ["SRC-002", "SRC-001"]
    revisions: []
  - id: "CLAIM-007"
    subject: "Massacre de Nanjing"
    predicate: "bilan humain"
    object: "1937-1938"
    text: >-
      Les estimations du nombre de victimes varient fortement : le tribunal
      militaire international de Tokyo retient environ 200 000 morts ; des travaux
      récents proposent 100 000 à 200 000 ; les mémoires chinoises vont jusqu'à
      300 000. Les catégories de victimes et les méthodes de comptage sont disputées.
    confidence: "disputed"
    sources: ["SRC-005", "SRC-004"]
    revisions: []
  - id: "CLAIM-008"
    subject: "Crue du fleuve Jaune"
    predicate: "bilan humain"
    object: "1938"
    text: >-
      La destruction des digues de Huayuankou en juin 1938 par l'armée nationaliste
      provoque une crue qui tue immédiatement des dizaines de milliers de personnes
      et fait environ 400 000 à 500 000 morts au total, avec des millions de
      déplacés.
    confidence: "probable"
    sources: ["SRC-017", "SRC-004"]
    revisions: []
  - id: "CLAIM-009"
    subject: "Grande famine"
    predicate: "bilan humain"
    object: "1959-1961"
    text: >-
      Les estimations de surmortalité varient d'environ 15 à 46 millions de morts ;
      Ashton et al. proposent environ 30 millions, Dikötter au moins 45 millions.
      La famine résulte des politiques du Grand Bond, des réquisitions, de la
      gestion agricole et de conditions climatiques.
    confidence: "disputed"
    sources: ["SRC-009", "SRC-010", "SRC-008"]
    revisions: []
  - id: "CLAIM-010"
    subject: "Révolution culturelle"
    predicate: "chronologie et violences"
    object: "1966-1976"
    text: >-
      La Révolution culturelle est lancée par Mao en 1966 et se termine avec sa
      mort en 1976 ; elle entraîne persécutions, violences de masse, destructions
      culturelles et militarisation de la société. Le bilan humain reste disputé.
    confidence: "certain"
    sources: ["SRC-007", "SRC-008"]
    revisions: []
  - id: "CLAIM-011"
    subject: "Politique de l'enfant unique"
    predicate: "chronologie et mise en œuvre"
    object: "1979-2015"
    text: >-
      La politique de l'enfant unique est annoncée en 1979, généralisée en 1980,
      inscrite dans la Constitution en 1982, assouplie en 2013 et remplacée par une
      politique de deux enfants en 2015. Des exceptions rurales et minoritaires
      existaient.
    confidence: "certain"
    sources: ["SRC-012", "SRC-001"]
    revisions: []
  - id: "CLAIM-012"
    subject: "Tiananmen 1989"
    predicate: "répression"
    object: "1989-06-04"
    text: >-
      Les manifestations étudiantes et ouvrières de printemps 1989 sont réprimées
      par l'armée dans la nuit du 3 au 4 juin ; le bilan humain est disputé et
      l'événement est censuré en RPC.
    confidence: "disputed"
    sources: ["SRC-018", "SRC-001"]
    revisions: []
  - id: "CLAIM-013"
    subject: "Hong Kong"
    predicate: "rétrocession"
    object: "1997-07-01"
    text: >-
      Hong Kong passe de la souveraineté britannique à la RPC le 1er juillet 1997,
      sous le régime « un pays, deux systèmes » ; la négociation sino-britannique
      est menée dans les années 1980.
    confidence: "certain"
    sources: ["SRC-013", "SRC-001"]
    revisions: []
  - id: "CLAIM-014"
    subject: "Chine et OMC"
    predicate: "accession"
    object: "2001-12-11"
    text: >-
      La Chine devient membre de l'Organisation mondiale du commerce le 11 décembre
      2001, après des négociations commencées en 1986 ; l'accession accélère les
      réformes et l'intégration aux chaînes de valeur mondiales.
    confidence: "certain"
    sources: ["SRC-014", "SRC-013"]
    revisions: []
  - id: "CLAIM-015"
    subject: "Confinement de Wuhan"
    predicate: "date et mesure"
    object: "2020-01-23"
    text: >-
      Le 23 janvier 2020, les autorités chinoises imposent des restrictions de
      circulation strictes à Wuhan pour contenir l'épidémie de COVID-19 ; l'OMS
      qualifie l'épidémie d'urgence de santé publique internationale le 30 janvier.
    confidence: "certain"
    sources: ["SRC-019"]
    revisions:
      - "Source institutionnelle unique (rapport conjoint OMS-Chine) ; corroboration indépendante à ajouter."
  - id: "CLAIM-016"
    subject: "Classification ethnique"
    predicate: "construction administrative"
    object: "années 1950"
    text: >-
      La classification ethnique menée dans les années 1950 fixe progressivement
      56 nationalités officielles ; elle transforme des appartenances locales et
      des identités fluides en catégories administratives, notamment pour les
      Zhuang du Guangxi.
    confidence: "probable"
    sources: ["SRC-020", "SRC-001"]
    revisions: []

