# Vectemporel — dossier pays Chine (méthode v1.0)
# Audit de première version, non signé. Les scores restent null et le verdict pending.
# Aucune source n'est inventée : les identifiants renvoient à source-register.csv.

schema_version: "1.0"

country:
  id: "china"
  iso2: "CN"
  iso3: "CHN"
  name_current: "République populaire de Chine"
  names_historical:
    - "中国 (Zhōngguó)"
    - "中华人民共和国 (Zhōnghuá Rénmín Gònghéguó, 1949-)"
    - "中華民國 (Zhōnghuá Mínguó, 1912-1949 ; continue à Taïwan après 1949)"
    - "大清 (Dà Qīng, 1644-1912)"
    - "Chine / China (exonymes européens)"
  flag: "🇨🇳"

scope:
  territory_current: >-
    République populaire de Chine : Chine continentale, Hong Kong et Macao (régions
    administratives spéciales). Taïwan, revendiquée par la RPC, est gouvernée séparément
    par la République de Chine ; elle est traitée dans ce dossier comme une histoire
    distincte à documenter, sans préjuger de son statut politique. Les frontières
    terrestres et maritimes contestées (Aksai Chin, Doklam, mer de Chine méridionale)
    sont signalées, pas résolues.
  territories_historical:
    - "Empire Qing (1644-1912), y compris la Mandchourie, la Mongolie-Intérieure, le Tibet dans l'orbite Qing et le Xinjiang conquis en 1755-1759"
    - "Taïwan sous administration Qing (1683-1895), colonie japonaise (1895-1945), puis administration de la République de Chine (1945-)"
    - "Hong Kong britannique (1842-1997) et Macao portugais (1557-1999)"
    - "Ports ouverts et concessions étrangères (1842-1945)"
    - "Mandchoukouo (1932-1945)"
    - "République de Chine (1912-1949), dont les territoires revendiqués dépassent les frontières actuelles"
  regions_autonomous:
    - "Tibet (région autonome, 1965)"
    - "Xinjiang ouïghour (1955)"
    - "Mongolie-Intérieure (1947)"
    - "Guangxi zhuang (1958)"
    - "Ningxia hui (1958)"
  populations_included:
    - "Han et 55 groupes ethniques reconnus par la RPC"
    - "Populations rurales et urbaines, travailleurs migrants (nongmingong), jeunes instruits (zhiqing)"
    - "Femmes, minorités religieuses, populations frontalières"
    - "Diasporas chinoises et communautés de Hong Kong, Macao et Taïwan"
  populations_excluded:
    - "Taïwan : hors du périmètre étatique de la RPC, traitée comme histoire distincte, à documenter séparément"
    - "Territoires contestés dont les populations ne sont pas couvertes faute de sources croisées"
    - "Personnes sans statut hukou, sous-représentées dans les sources statistiques"
  diasporas:
    - "Asie du Sud-Est (Malaisie, Indonésie, Singapour, Thaïlande, Vietnam)"
    - "Amérique du Nord, Europe, Afrique, Océanie"
    - "Diasporas taïwanaises et hongkongaises"
  temporal:
    start_edtf: "-1600"
    end_edtf: "2026"
    start_rationale: >-
      Date conventionnelle du début des Shang. La datation est débattue : les plus
      anciennes écritures chinoises abondantes proviennent d'Anyang (vers -1250), et
      l'identification d'Erlitou comme capitale Xia ou Shang reste contestée. La borne
      -1600 est conservée comme repère éditorial, avec une certitude « probable ».
    end_rationale: >-
      2026 est l'année de l'audit. Les événements postérieurs à 2024 sont provisoires,
      soumis à révision et à des sources indépendantes supplémentaires.
  unit_of_analysis: "fiche-événement et fiche-processus"
  inclusion_criteria:
    - "Événements qui modifient les institutions, le territoire, les rapports sociaux ou les représentations"
    - "Processus longs découpés en fiches datées (famine, Révolution culturelle, réformes)"
    - "Au moins un lieu hors de la capitale par période"
    - "Femmes, minorités, classes populaires, environnement et migrations documentés explicitement"
  exclusion_criteria:
    - "Faits locaux sans résonance documentaire ou mémorielle"
    - "Rumeurs, chiffres non corroborés, contenus génératifs non vérifiés"
    - "Événements récents sans source indépendante ; ils restent en file de revue"
    - "Détails biographiques sans portée structurelle"
  audience:
    - "grand public"
    - "scolaire"
    - "diasporas"
    - "recherche"
  evidence_threshold: "deux sources indépendantes par fiche, ou exception documentée"

