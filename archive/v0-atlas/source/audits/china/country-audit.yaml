    - "SRC-017"

periodizations:
  - id: "POL-1"
    label: "Cinq ères Vectemporel (périodisation éditoriale actuelle)"
    type: "political"
    start_edtf: "-1600"
    end_edtf: "2026"
    rationale: >-
      Macro-périodisation lisible pour la navigation : fondation dynastique, empire,
      République, Chine populaire, réforme. Elle privilégie la souveraineté et les
      régimes, au prix d'une sous-périodisation des divisions impériales et de la
      période 1912-1949.
    sources: ["SRC-001", "SRC-002", "SRC-008", "SRC-013"]
    selected: true
  - id: "POL-2"
    label: "Périodisation dynastique et impériale"
    type: "political"
    start_edtf: "-1600"
    end_edtf: "1912"
    rationale: >-
      Découpe par dynasties (Shang, Zhou, Qin, Han, divisions, Sui-Tang, Song, Yuan,
      Ming, Qing). Plus fidèle aux institutions et aux légitimités impériales, mais
      elle masque les continuités sociales et les périodes de fragmentation.
    sources: ["SRC-001", "SRC-020"]
    selected: false
  - id: "POL-3"
    label: "République et révolutions (1895-1949)"
    type: "political"
    start_edtf: "1895"
    end_edtf: "1949"
    rationale: >-
      Périodisation centrée sur la crise impériale, la révolution de 1911, la
      construction du parti-État, la guerre sino-japonaise et la guerre civile.
      Elle permet de traiter 1912-1949 comme une séquence autonome, aujourd'hui vide.
    sources: ["SRC-002", "SRC-003", "SRC-004"]
    selected: false
  - id: "SOC-1"
    label: "Croissance agraire, pression démographique, industrialisation"
    type: "social_economic"
    start_edtf: "1000"
    end_edtf: "2026"
    rationale: >-
      Périodisation par les régimes démographiques et économiques : révolution
      commerciale Song, croissance démographique Qing, industrialisation tardive,
      collectivisation, réformes et urbanisation. Elle fait apparaître les paysans,
      les migrants et les inégalités, absents du récit politique.
    sources: ["SRC-001", "SRC-014", "SRC-017"]
    selected: false
  - id: "CULT-1"
    label: "Bouddhisme, néo-confucianisme, sécularisation, révolution culturelle"
    type: "cultural_religious_environmental"
    start_edtf: "0100"
    end_edtf: "2026"
    rationale: >-
      Périodisation par les configurations religieuses et culturelles : diffusion du
      bouddhisme, synthèse néo-confucéenne, crises et sécularisations du XXe siècle,
      Révolution culturelle, recompositions religieuses contemporaines. Elle inclut
      aussi les ruptures environnementales (fleuve Jaune, déforestation, pollution).
    sources: ["SRC-001", "SRC-017"]
    selected: false

periods:
  - id: "PERIOD-1"
    label: "Dynasties fondatrices"
    start_edtf: "-1600"
    end_edtf: "-221"
    boundary_type: "political"
    boundary_rationale: >-
      Borne conventionnelle : début des Shang selon la chronologie traditionnelle,
      puis unification Qin en -221. La borne est discutée (Anyang vers -1250, Erlitou,
      projet Xia-Shang-Zhou) et le label « fondatrices » est téléologique.
    alternatives_considered:
      - "-1250 (premières inscriptions abondantes à Anyang)"
      - "-1046 (bataille de Muye, changement dynastique Zhou)"
      - "-771 (fin des Zhou occidentaux)"
      - "-453 (début conventionnel des Royaumes combattants)"
    sources: ["SRC-001"]
  - id: "PERIOD-2"
    label: "Empire unifié"
    start_edtf: "-221"
    end_edtf: "1912"
    boundary_type: "political"
    boundary_rationale: >-
      De l'unification Qin à l'abdication Qing. La continuité du label masque les
      périodes de division (Trois Royaumes, dynasties du Nord et du Sud, Cinq
      Dynasties, partition Song-Jin) et la nature changeante de l'empire.
    alternatives_considered:
      - "220 (fin des Han, début des divisions)"
      - "589 (réunification Sui)"
      - "907 (fin des Tang)"
      - "1279 (conquête Yuan de la Chine du Sud)"
      - "1644 (entrée des Qing à Pékin)"
    sources: ["SRC-001"]
  - id: "PERIOD-3"
    label: "République et révolutions"
    start_edtf: "1912"
    end_edtf: "1949"
    boundary_type: "political"
    boundary_rationale: >-
      De la proclamation de la République de Chine à la fondation de la RPC. La
      période est la plus mal couverte : aucune fiche existante, alors qu'elle
      concentre la chute de l'empire, la construction du parti-État, la guerre et
      la révolution.
    alternatives_considered:
      - "1895 (défaite sino-japonaise, réformes et révolution)"
      - "1927 (rupture KMT-PCC, décennie de Nanjing)"
      - "1937 (guerre totale sino-japonaise)"
      - "1945 (fin de la guerre, reprise de la guerre civile)"
    sources: ["SRC-002", "SRC-003", "SRC-004"]
  - id: "PERIOD-4"
    label: "Chine populaire"
    start_edtf: "1949"
    end_edtf: "1978"
    boundary_type: "political"
    boundary_rationale: >-
      De la fondation de la RPC au troisième plénum du XIe Comité central (décembre
      1978). La borne de 1978 est politique et économique ; elle ne coïncide pas avec
      la fin des politiques maoïstes dans tous les domaines.
    alternatives_considered:
      - "1958 (Grand Bond en avant)"
      - "1966 (Révolution culturelle)"
      - "1976 (mort de Mao)"
    sources: ["SRC-007", "SRC-008"]
  - id: "PERIOD-5"
    label: "Réforme et puissance"
    start_edtf: "1978"
    end_edtf: "2026"
    boundary_type: "political"
    boundary_rationale: >-
      Du troisième plénum à 2026. La période est trop longue pour un seul repère :
      elle contient 1989, 1997, 2001, 2008 et 2020, qui ne sont pas dans la frise.
    alternatives_considered:
      - "1989 (répression de Tiananmen)"
      - "1992 (voyage de Deng dans le Sud)"
      - "2001 (entrée à l'OMC)"
      - "2012 (arrivée de Xi Jinping)"
    sources: ["SRC-013", "SRC-014"]

