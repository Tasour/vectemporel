    title: "Révolte de Spartacus"
    subtitle: "Esclaves en armes contre Rome"
    tags: ["guerre", "societe", "economie"]
    importance: 3
    summary: "En 73 av. J.-C., des gladiateurs menés par Spartacus s'échappent de Capoue et rassemblent des dizaines de milliers d'esclaves et de paysans. La révolte est écrasée en 71 par Crassus et Pompée; des milliers de captifs sont crucifiés le long de la Via Appia. L'épisode révèle l'économie esclavagiste et la peur sociale de l'Italie romaine."
    sources: ["SRC-001"]
    confidence: "high"
    rationale: "Comble le vide « économie & travail » de l'ère romaine et donne une place aux esclaves, acteurs sans voix dans la frise actuelle."
