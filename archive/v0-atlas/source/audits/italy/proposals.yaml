    tags: ["societe", "economie", "sciences"]
    importance: 3
    summary: "La peste arrive en Sicile en 1347 et ravage l'Italie jusqu'en 1351. La mortalité bouleverse la démographie, les prix, les salaires et les rapports de travail; les autorités urbaines multiplient les mesures sanitaires et les registres. Les récits de Boccace et les archives fiscales en font un observatoire majeur de la société italienne."
    sources: ["SRC-004"]
    confidence: "high"
    rationale: "Comble le vide démographique et sanitaire du Moyen Âge; permet de relier catastrophe, travail et histoire urbaine."
