    title: "Résistance italienne"
    subtitle: "Guerre patriotique, guerre civile, guerre de classe"
    tags: ["guerre", "politique", "societe"]
    importance: 3
    summary: "Après l'armistice du 8 septembre 1943, des partisans combattent l'occupation allemande et la République sociale italienne, tandis que la guerre divise les familles et les territoires. La Résistance est à la fois une guerre de libération, une guerre civile et un conflit social; les femmes y jouent des rôles de liaison, de ravitaillement et de combat. Elle fonde ensuite une partie de la légitimité de la République."
    sources: ["SRC-014", "SRC-015"]
