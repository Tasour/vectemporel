    tags: ["politique", "societe", "religion"]
    importance: 3
    summary: "En 1938, le régime fasciste promulgue un ensemble de lois antisémites qui excluent les Juifs de l'école, de la fonction publique et de nombreux droits, et interdisent les mariages mixtes. Ces mesures précèdent les arrestations et déportations de 1943-1945. Elles montrent que la persécution a des racines italiennes, pas seulement allemandes."
