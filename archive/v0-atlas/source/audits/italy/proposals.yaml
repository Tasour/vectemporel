corrections:
  - existing_id: "it-476"
    issue: "La « chute de Rome » est présentée comme une fin instantanée, sans nuance sur la déposition de Romulus Augustulus ni sur les continuités."
    proposal: "Requalifier 476 en convention historiographique; préciser Odoacre, l'Empire d'Orient et les continuités gothiques, byzantines et lombardes."
    sources: ["SRC-003"]
    confidence: "high"
  - existing_id: "it-medicis"
    issue: "« Médicis » est un titre vague; 1434 est présenté comme un moment culturel alors qu'il s'agit d'un retour d'exil et d'une consolidation politique."
    proposal: "Titrer « Cosme de Médicis à Florence (1434) »; distinguer pouvoir politique, banque et mécénat; ne pas faire de Florence toute la Renaissance."
    sources: ["SRC-004"]
