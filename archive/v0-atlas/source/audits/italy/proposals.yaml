    tags: ["societe", "politique", "economie"]
    importance: 3
    summary: "À partir des années 1980, l'Italie devient un pays d'immigration: travailleurs africains, asiatiques et est-européens s'installent dans les villes et les campagnes. La loi 91/1992 organise la citoyenneté autour du jus sanguinis, tandis que les débats sur le jus soli et les droits des résidents étrangers se poursuivent. L'immigration transforme l'école, le travail et les représentations de la nation."
