    importance: 3
    summary: "Le 9 octobre 1963, une énorme masse rocheuse se détache du mont Toc et s'abat dans le lac artificiel du Vajont. L'onde submerge Longarone et plusieurs villages, faisant 1 917 victimes selon les chiffres officiels. Le désastre, précédé d'avertissements ignorés, devient un symbole des risques industriels et de la responsabilité publique."
    sources: ["SRC-019"]
    confidence: "high"
