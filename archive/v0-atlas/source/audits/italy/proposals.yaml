periodization:
  current_verdict: "La structure en cinq ères est lisible et compatible avec l'interface, mais elle est massivement politique et militaire. Les bornes de 1494 et de 1945 sont des césures de guerre, non des ruptures sociales; l'ère 2 (476-1494) ne contient qu'un repère et l'ère 3 (1494-1871) est presque vide entre 1559 et 1861. Le récit actuel ne distingue pas la fin de la guerre (1945), la proclamation de la République (1946) et la Constitution (1948)."
  proposed_changes:
    - action: "keep"
      era_name: "Architecture en cinq ères"
      proposal: "Conserver cinq ères pour la vue d'ensemble, mais expliciter qu'il s'agit d'une périodisation politique parmi d'autres."
      rationale: "La continuité de l'interface et la lisibilité priment; les alternatives sont conservées dans country-audit.yaml."
      sources: ["SRC-003", "SRC-004", "SRC-009", "SRC-015"]
    - action: "rename"
      era_name: "Rome antique"
      proposal: "Renommer « Rome antique et Italie romaine »."
      rationale: "Éviter de confondre l'histoire de Rome avec celle de la péninsule et signaler les populations italiques, grecques et étrusques."
      sources: ["SRC-003"]
    - action: "split"
      era_name: "Moyen Âge & Renaissance"
      proposal: "Scinder à 1348 (peste noire) ou, à défaut, ajouter des marqueurs internes 1000 (communes) et 1348."
      rationale: "L'ère couvre 1 018 ans et ne contient qu'un repère (1434); la peste noire et l'essor communal sont des ruptures majeures."
      sources: ["SRC-003", "SRC-004"]
    - action: "split"
      era_name: "Guerres & Risorgimento"
      proposal: "Scinder à 1796 (invasion napoléonienne) en « Domination étrangère (1494-1796) » et « Risorgimento (1796-1871) »."
      rationale: "1494-1796 est une période de dominations espagnole puis autrichienne, distincte du mouvement national du XIXe siècle."
      sources: ["SRC-004", "SRC-009"]
    - action: "rename"
      era_name: "Italie moderne"
      proposal: "Renommer « Italie libérale et fasciste (1871-1945) » et ajouter un marqueur 1922."
      rationale: "Le libellé actuel masque la rupture fasciste et la nature du régime libéral."
      sources: ["SRC-009", "SRC-012", "SRC-013"]
    - action: "move_boundary"
      era_name: "République"
      proposal: "Conserver 1945 comme fin de guerre, mais afficher 1946 (référendum) et 1948 (Constitution) comme marqueurs institutionnels; envisager un début à 1946 pour une périodisation institutionnelle."
      rationale: "La République n'existe pas juridiquement en 1945; la Constitution entre en vigueur en 1948."
      sources: ["SRC-014", "SRC-015"]

