    title: "Édit de Milan"
    subtitle: "Constantin et Licinius tolèrent les chrétiens"
    tags: ["religion", "politique"]
    importance: 2
    summary: "En 313, Constantin et Licinius se rencontrent à Milan et adressent aux provinciaux un texte de tolérance religieuse, souvent appelé « édit de Milan ». Il ne fait pas du christianisme la religion d'État mais met fin aux persécutions et restitue des biens ecclésiastiques. La mesure s'inscrit dans une lutte pour le pouvoir impérial."
    sources: ["SRC-002"]
    confidence: "high"
    rationale: "Premier repère religieux hors Rome; Milan comme centre impérial; nuance le récit d'une « victoire » chrétienne instantanée."
