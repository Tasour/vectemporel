    tags: ["politique", "societe", "economie"]
    importance: 3
    summary: "En 1968, les universités italiennes connaissent occupations et manifestations; en 1969, les grandes usines du Nord sont secouées par l'« automne chaud » et des grèves massives. De nouveaux sujets politiques — étudiants, ouvriers non qualifiés, femmes — contestent l'autorité et les hiérarchies. Le cycle ouvre une décennie de conflits et de réformes."
