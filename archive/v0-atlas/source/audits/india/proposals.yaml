    proposal: "Préciser les précédents, Kalinga, les missions bouddhiques et la distinction entre dhamma et non-violence."
    sources: ["SRC-001", "SRC-002"]
    confidence: "high"

  - existing_id: "in-gupta"
    issue: "« Âge d'or » est un label historiographique ; le zéro n'est pas inventé par les Gupta et la numération décimale se développe sur plusieurs siècles."
    proposal: "Remplacer par « construction d'un âge d'or » et dater les mathématiques (Aryabhata, 499) sans attribuer le zéro aux Gupta."
    sources: ["SRC-001", "SRC-002"]
    confidence: "high"

  - existing_id: "in-delhi"
    issue: "« Dynasties turques » réduit cinq dynasties (Mamelouks, Khalji, Tughlaq, Sayyid, Lodi) et omet les sultanats du Deccan, du Bengale et du Gujarat ; la période va de 1206 à 1526."
    proposal: "Préciser la chronologie, la pluralité des sultanats et les institutions (iqta, monnaie, persan)."
    sources: ["SRC-001", "SRC-003"]
    confidence: "high"

  - existing_id: "in-moghol"
    issue: "« Apogée sous Akbar » confond apogée territoriale (Aurangzeb) et apogée culturelle ; le Taj Mahal est construit de 1632 à 1653 et l'empire décline après 1707."
    proposal: "Distinguer Akbar, Shah Jahan et Aurangzeb ; dater le Taj Mahal et la crise successorale."
    sources: ["SRC-003"]
    confidence: "high"

  - existing_id: "in-eic"
    issue: "1600-1757 est comprimé ; la charte de 1600 ne donne pas de comptoirs, le premier comptoir est à Surat en 1613, et le pouvoir territorial date de Plassey (1757), Buxar (1764) et du Diwani (1765)."
    proposal: "Décrire la Compagnie comme un processus et distinguer commerce, comptoirs et souveraineté."
    sources: ["SRC-003", "SRC-004"]
    confidence: "high"

  - existing_id: "in-cipayes"
    issue: "« Mutinerie des cipayes » sous-estime l'ampleur de la révolte de 1857-1858, qui implique sepoys, paysans, princes et villes, avec une répression massive et des violences des deux côtés."
    proposal: "Renommer « Révolte de 1857-1858 » et ajouter la répression, les victimes civiles et le passage à la Couronne en 1858."
    sources: ["SRC-004", "SRC-005"]
    confidence: "high"

  - existing_id: "in-congres"
    issue: "« Élites réformistes » ignore la diversité sociale du premier Congrès (avocats, journalistes, propriétaires, marchands) et le fait qu'il ne devient un parti de masse qu'après 1920."
    proposal: "Préciser la composition, les phases modérée et de masse, et la concurrence de la Ligue musulmane."
    sources: ["SRC-005"]
    confidence: "high"

  - existing_id: "in-amritsar"
    issue: "« Centaines de morts » est vague ; les estimations vont de 379 à plus de 1 500 morts, avec environ 1 200 blessés ; le rôle du général Dyer et la commission Hunter sont absents."
    proposal: "Donner une fourchette, citer la commission Hunter et replacer le massacre dans la répression du Rowlatt Act."
    sources: ["SRC-005"]
    confidence: "high"

  - existing_id: "in-independance"
    issue: "La fiche confond l'indépendance (15 août 1947) et la Partition (ligne Radcliffe, août 1947) ; elle ne donne pas les ordres de grandeur (12 à 20 millions de déplacés, 200 000 à 2 millions de morts) et ignore le Cachemire."
    proposal: "Scinder en deux fiches, indépendance et Partition, et ajouter la guerre de 1947-1948 au Cachemire."
    sources: ["SRC-007", "SRC-008", "SRC-009"]
    confidence: "high"

  - existing_id: "in-gandhi"
    issue: "« Nationaliste hindou » est vague ; l'assassin est Nathuram Godse, ancien militant du RSS, le 30 janvier 1948. La phrase sur sa pensée qui « continue d'inspirer » est un jugement, et les critiques de ses positions sur la caste et de son rôle dans les négociations de 1942-1947 manquent."
    proposal: "Nommer Godse, dater l'assassinat et ajouter un paragraphe sur les héritages contestés de Gandhi, notamment ses positions sur la caste."
    sources: ["SRC-005", "SRC-006"]
    confidence: "high"

  - existing_id: "in-liberalisation"
    issue: "1991 n'est pas un point unique : crise de balance des paiements, gouvernement Rao, Manmohan Singh, conditions du FMI, libéralisation partielle et croissance inégale."
    proposal: "Décrire un processus 1991-2000s et ajouter des indicateurs sociaux, pas seulement la croissance."
    sources: ["SRC-006", "SRC-014"]
    confidence: "high"

