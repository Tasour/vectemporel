schema_version: "1.0"
country:
  id: "india"
  iso2: "IN"
  iso3: "IND"
  name_current: "République de l'Inde (Bhārat Gaṇarājya)"
  names_historical:
    - "Inde britannique (1757-1947)"
    - "Raj britannique (1858-1947)"
    - "Empire des Indes (1876-1947)"
    - "Hindustan (usages persans)"
    - "Bharat / Bhāratavarṣa"
  flag: "🇮🇳"

scope:
  territory_current: "Union indienne : 28 États et 8 territoires de l'Union (2026) ; frontières du Cachemire contestées avec le Pakistan et la Chine."
  territories_historical:
    - "Présidences de Bombay, Madras et Bengale"
    - "Inde britannique (1757-1947)"
    - "Birmanie rattachée à l'Inde britannique (1886-1937)"
    - "Centaines d'États princiers, intégrés entre 1947 et 1950"
    - "Goa, Daman et Diu, portugais jusqu'en 1961"
    - "Pondichéry, français jusqu'en 1954 (transfert de jure en 1962)"
    - "Cachemire, accession contestée depuis 1947"
  regions_autonomous:
    - "Jammu-et-Cachemire (territoire de l'Union depuis 2019, statut contesté)"
    - "Ladakh"
    - "États du Nord-Est (régimes spéciaux, VIe annexe)"
    - "Districts autonomes tribaux"
  populations_included:
    - "Citoyens indiens"
    - "Diasporas indiennes"
    - "Dalits (Scheduled Castes)"
    - "Adivasis (Scheduled Tribes)"
    - "Minorités religieuses et linguistiques"
    - "Populations frontalières"
  populations_excluded:
    - "Ressortissants pakistanais et bangladais hors diasporas"
    - "Népalais résidents non indiens"
    - "Populations de Birmanie et du Sri Lanka, sauf circulations"
  diasporas:
    - "Caraïbes (Trinité, Guyane, Suriname)"
    - "Maurice"
    - "Fiji"
    - "Afrique du Sud"
    - "Golfe"
    - "Royaume-Uni"
    - "États-Unis"
    - "Canada"
    - "Australie"
    - "Asie du Sud-Est"
  temporal:
    start_edtf: "-2600"
    end_edtf: "2026"
    start_rationale: "Début de la phase urbaine mature de l'Indus (vers -2600) ; la préhistoire antérieure est hors périmètre et documentée dans OM-001."
    end_rationale: "Date de clôture au 13 novembre 2026 ; la période 2024-2026 est traitée comme histoire immédiate, avec sources provisoires."
  unit_of_analysis: "fiche-événement"
  inclusion_criteria:
    - "Événements et processus qui modifient les institutions, les rapports sociaux, les religions, les économies ou les environnements."
    - "Au moins une échelle non nationale par période : locale, régionale, impériale ou transnationale."
    - "Acteurs collectifs, subalternes, femmes et minorités, sans tokenisme."
    - "Faits attestés par au moins une source savante et, si possible, deux sources indépendantes."
  exclusion_criteria:
    - "Faits divers sans portée structurelle."
    - "Commémorations sans source ou sans objet mémoriel distinct."
    - "Claims non corroborées ou purement spéculatives."
    - "Préhistoire antérieure à -2600, traitée comme antécédent hors cadre."
  audience: ["grand public", "scolaire", "diasporas", "recherche"]
  evidence_threshold: "deux sources indépendantes par fiche, ou exception documentée"

governance:
  editor: ""
  country_reader: ""
  method_reader: ""
  arbiter: ""
  data_steward: ""
  sensitivity_expert: ""
  responsible_editor: ""
  conflicts_of_interest: []

historiography:
  schools:
    - "Historiographie coloniale et orientaliste (James Mill, 1817 ; administrateurs et missionnaires)"
    - "Historiographie nationaliste (R. C. Majumdar, Jawaharlal Nehru)"
    - "Historiographie marxiste (D. D. Kosambi, R. S. Sharma, Irfan Habib)"
    - "Cambridge School (Anil Seal, C. A. Bayly) : factions, élites, réseaux"
    - "Subaltern Studies (Ranajit Guha, Partha Chatterjee, Gyanendra Pandey, Gayatri Spivak)"
    - "Histoire des femmes et du genre (Geraldine Forbes, Uma Chakravarti, Kumkum Roy)"
    - "Histoire dalit et bahujan (B. R. Ambedkar, Christophe Jaffrelot, Anupama Rao)"
    - "Histoire environnementale (Madhav Gadgil, Ramachandra Guha, Mahesh Rangarajan, Sunil Amrith)"
    - "Histoire globale et connectée (Sanjay Subrahmanyam, Sunil Amrith)"
    - "Historiographies régionales (tamoule, bengalie, marathe, pendjabie, kéralaise)"
    - "Historiographie hindoue-nationaliste (V. D. Savarkar, M. S. Golwalkar), à traiter comme objet et non comme autorité"
  national_narratives:
    - "Fondation par l'Indus et les Védas"
    - "Âges d'or maurya et gupta"
    - "Grandeur moghole"
    - "Exploitation coloniale et drain"
    - "Lutte pour la liberté et non-violence"
    - "République séculière et développementaliste"
    - "Libéralisation de 1991 et puissance mondiale"
    - "Renouveau hindou-nationaliste après 2014"
  counter_narratives:
    - "Récits dalits : caste, exclusion, Ambedkar, conversion"
    - "Récits adivasis : dépossession, forêts, gram sabhas"
    - "Récits musulmans : minorisation, Partition, droits personnels"
    - "Récits sikhes : Khalsa, 1984, diaspora"
    - "Récits chrétiens et parsis : minorités et modernité coloniale"
    - "Récits dravidiens et linguistiques : anti-hindi, fédéralisme"
    - "Récits cachemiris : accession, autonomie, répression"
    - "Récits féministes : patriarcat brahmanique, réforme, droits"
    - "Récits environnementaux : forêts, eau, pollution, climat"
    - "Récits de la diaspora : engagisme, Golfe, racisme, appartenances"
  structuring_debates:
    - "Migrations indo-européennes et « aryen » : linguistique, génétique, politique"
    - "Caste : construction coloniale ou continuité ancienne ?"
    - "Partition : responsabilités britanniques, Congress, Ligue musulmane"
    - "Sécularisme : neutralité, reconnaissance des minorités, majoritarisme"
    - "Périodisation : Indus, Védas, 1206, 1757, 1858, 1947"
    - "Bilan économique du colonialisme : drain, désindustrialisation, développement"
    - "Langues : hindi imposé ou fédéralisme multilingue ?"
    - "État d'urgence, 1984, 1992, 2002 : mémoire et responsabilité"
  blind_spots:
    - "Femmes et genre, surtout avant 1800"
    - "Dalits et castes dominées"
    - "Adivasis et peuples forestiers"
    - "Minorités religieuses : musulmans, chrétiens, sikhs, bouddhistes, jaïns, parsis, juifs"
    - "Classes populaires, paysans, travailleurs informels"
    - "Nord-Est, Cachemire, Manipur"
    - "Handicap, transidentité, droits LGBTQ+"
    - "Migrations de travail vers le Golfe et diasporas récentes"
    - "Environnement : eau, sols, pollution, climat"
    - "Arts populaires, cinéma, musique, sport"
  key_syntheses: ["SRC-001", "SRC-002", "SRC-003", "SRC-004", "SRC-005", "SRC-006", "SRC-007", "SRC-008", "SRC-009", "SRC-010", "SRC-011", "SRC-012", "SRC-013", "SRC-014", "SRC-015", "SRC-016", "SRC-017", "SRC-018"]

periodizations:
  - id: "POL-1"
    label: "Quatre ères actuelles (data.js)"
    type: "political"
    start_edtf: "-2600"
    end_edtf: "2026"
    rationale: "Périodisation actuelle : Civilisations anciennes (-2600/1206), Sultanats & Moghols (1206/1757), Raj britannique (1757/1947), Inde contemporaine (1947/2026). Cohérente mais déséquilibrée."
    sources: ["SRC-001", "SRC-002", "SRC-003", "SRC-004", "SRC-005", "SRC-006"]
    selected: false
  - id: "POL-2"
    label: "Cinq ères révisées"
    type: "political"
    start_edtf: "-2600"
    end_edtf: "2026"
    rationale: "Scinde l'ère ancienne à la seconde urbanisation (-600) et distingue la Compagnie (1757-1858) du Raj de la Couronne (1858-1947). Conserve 1206 et 1947 comme ruptures politiques majeures."
    sources: ["SRC-001", "SRC-002", "SRC-003", "SRC-004", "SRC-005"]
    selected: true
  - id: "SOC-1"
    label: "Phases sociales et économiques"
    type: "social_economic"
    start_edtf: "-2600"
    end_edtf: "2026"
    rationale: "Âge du bronze urbain (-2600/-1300), expansion agraire et fer (-1300/-600), empires agraires et commerciaux (-600/1757), extraction coloniale (1757/1947), État développementaliste (1947/1991), économie libéralisée et services (1991/2026)."
    sources: ["SRC-002", "SRC-004", "SRC-006", "SRC-014"]
    selected: false
  - id: "CULT-1"
    label: "Phases culturelles et religieuses"
    type: "cultural_religious_environmental"
    start_edtf: "-2600"
    end_edtf: "2026"
    rationale: "Indus et Védas (-2600/-600), axial et classique (-600/600), puranique, bhakti et soufi (600/1757), modernité coloniale et réforme (1757/1947), république séculière et pluralisme contesté (1947/2026)."
    sources: ["SRC-001", "SRC-002", "SRC-003", "SRC-005", "SRC-012"]
    selected: false
  - id: "ENV-1"
    label: "Phases environnementales"
    type: "cultural_religious_environmental"
    start_edtf: "-2600"
    end_edtf: "2026"
    rationale: "Régime des moussons et famines (avant 1757), État colonial extractif et forêts (1757/1947), Révolution verte et grands barrages (1947/1991), crise de l'eau, pollution et climat (1991/2026)."
    sources: ["SRC-013", "SRC-016", "SRC-017"]
    selected: false

periods:
  - id: "PERIOD-1"
    label: "Indus & Védique"
    start_edtf: "-2600"
    end_edtf: "-600"
    boundary_type: "cultural"
    boundary_rationale: "La seconde urbanisation, l'écriture et les religions universalistes (bouddhisme, jaïnisme) ouvrent une nouvelle séquence ; -600 est une convention, à discuter avec -500 et -400."
    alternatives_considered: ["-1900 (dé-urbanisation de l'Indus)", "-1200 (Rigveda)", "-500 (Bouddha)"]
    sources: ["SRC-001", "SRC-002"]
  - id: "PERIOD-2"
    label: "Empires classiques & régionaux"
    start_edtf: "-600"
    end_edtf: "1200"
    boundary_type: "political"
    boundary_rationale: "1206 marque l'installation du sultanat de Delhi ; la borne est politique et ne doit pas masquer les continuités commerciales et culturelles."
    alternatives_considered: ["-322 (Maurya)", "320 (Gupta)", "600 (Harsha)", "1000 (Ghaznavides)"]
    sources: ["SRC-001", "SRC-002", "SRC-003"]
  - id: "PERIOD-3"
    label: "Sultanats, Vijayanagara & Moghols"
    start_edtf: "1200"
    end_edtf: "1757"
    boundary_type: "military"
    boundary_rationale: "Plassey (1757) est la borne conventionnelle de la domination territoriale de la Compagnie ; 1526 (Babur) et 1707 (mort d'Aurangzeb) sont des alternatives."
    alternatives_considered: ["1206 (sultanat de Delhi)", "1526 (Babur)", "1707 (mort d'Aurangzeb)", "1765 (Diwani)"]
    sources: ["SRC-003", "SRC-004"]
  - id: "PERIOD-4"
    label: "Compagnie & Raj"
    start_edtf: "1757"
    end_edtf: "1947"
    boundary_type: "political"
    boundary_rationale: "La période combine la domination de la Compagnie (1757-1858) et le Raj de la Couronne (1858-1947) ; 1858 est une sous-borne majeure."
    alternatives_considered: ["1858 (Couronne)", "1885 (Congrès)", "1919 (Amritsar)"]
    sources: ["SRC-004", "SRC-005"]
  - id: "PERIOD-5"
    label: "République & Inde contemporaine"
    start_edtf: "1947"
    end_edtf: "2026"
    boundary_type: "political"
    boundary_rationale: "L'indépendance et la Partition fondent l'Inde contemporaine ; 1950 (Constitution) et 1991 (libéralisation) sont des sous-bornes."
    alternatives_considered: ["1950 (Constitution)", "1991 (libéralisation)"]
    sources: ["SRC-006", "SRC-007"]

coverage:
  matrix_file: "coverage-matrix.csv"
  omissions_file: "omissions.yaml"
  target_threshold: "90 % des cellules couvertes ou justifiées"
  status_summary:
    covered: 26
    partial: 30
    justified_empty: 0
    untreated_empty: 0
  known_omissions: ["OM-001", "OM-002", "OM-003", "OM-004", "OM-005", "OM-006", "OM-007", "OM-008", "OM-009", "OM-010", "OM-011", "OM-012", "OM-013", "OM-014", "OM-015"]

# period_ids renvoient aux périodes proposées PERIOD-1..PERIOD-5 (voir periods).
actors:
  - id: "ACTOR-001"
    label: "Ashoka"
    type: "individual"
    roles: ["empereur maurya (268-232 av. J.-C.)", "promoteur du dhamma", "patron du bouddhisme"]
    period_ids: ["PERIOD-2"]
    places: ["Pataliputra", "Kalinga", "Sarnath"]
    resources: ["armée", "administration impériale", "réseau de missions bouddhiques", "édits rupestres et sur piliers"]
    constraints: ["violence de la conquête de Kalinga (261 av. J.-C.)", "résistances des élites brahmaniques", "limites de l'administration impériale", "succession disputée"]
    networks: ["sangha bouddhique", "missionnaires à Ceylan et en Asie centrale", "rois hellénistiques"]
    counterpowers: ["élites locales", "brahmanes", "gouverneurs régionaux"]
    assessment: "Le dhamma est un programme de gouvernement moral, pas un pacifisme absolu ; l'empire reste fondé sur l'armée et l'impôt."
    memory: "Figure de l'unité nationale et de la non-violence officielle ; les édits sont des objets patrimoniaux et politiques."
    sources: ["SRC-001", "SRC-002"]

  - id: "ACTOR-002"
    label: "Akbar"
    type: "individual"
    roles: ["empereur moghol (1556-1605)", "réformateur administratif", "patron culturel"]
    period_ids: ["PERIOD-3"]
    places: ["Fatehpur Sikri", "Agra", "Lahore", "Delhi"]
    resources: ["mansabdari", "revenu agraire", "armée", "alliances rajputes", "ateliers de traduction"]
    constraints: ["légitimité timouride", "factions nobiliaires", "résistances religieuses", "frontières du Deccan"]
    networks: ["maisons rajputes", "soufis", "jésuites", "lettrés persans"]
    counterpowers: ["ulémas", "noblesse turco-mongole", "révoltes régionales"]
    assessment: "Consolide un empire pluriel par l'intégration des élites ; l'« apogée » est autant politique que culturelle et n'efface pas les hiérarchies."
    memory: "Modèle de tolérance ou de syncrétisme, souvent idéalisé ; mémoire contrastée avec celle d'Aurangzeb."
    sources: ["SRC-003"]

  - id: "ACTOR-003"
    label: "Nur Jahan"
    type: "individual"
    roles: ["impératrice moghole (vers 1577-1645)", "régente de fait (1611-1627)", "patronne architecturale"]
    period_ids: ["PERIOD-3"]
    places: ["Agra", "Lahore", "Kashmir"]
    resources: ["réseau familial (I'timad-ud-Daula, Asaf Khan)", "faction de cour", "domaines et pensions", "patronage artistique"]
    constraints: ["purdah et normes de genre", "luttes de succession", "dépendance à Jahangir", "opposition des nobles"]
    networks: ["« junta » de Nur Jahan", "nobles rajputs et persans", "marchands et artisans"]
    counterpowers: ["princes rivaux", "noblesse militaire", "clergé"]
    assessment: "Actrice politique majeure, souvent réduite à un cliché de harem ; son pouvoir passe par la cour, la famille et le patronage."
    memory: "Figure romanesque et orientaliste ; réévaluée par l'histoire des femmes et de la cour moghole."
    sources: ["SRC-003"]

  - id: "ACTOR-004"
    label: "Sarojini Naidu"
    type: "individual"
    roles: ["poétesse", "dirigeante du Congrès", "présidente du Congrès (1925)", "gouverneure de l'Uttar Pradesh (1947-1949)"]
    period_ids: ["PERIOD-4", "PERIOD-5"]
    places: ["Hyderabad", "Bombay", "Dandi", "Lucknow"]
    resources: ["éloquence", "réseaux du Congrès", "poésie", "amitiés avec Gandhi et Nehru"]
    constraints: ["répression coloniale", "normes de genre", "hiérarchies du parti", "tensions communautaires"]
    networks: ["Congrès", "associations de femmes", "ligne Gandhi"]
    counterpowers: ["Raj britannique", "conservateurs sociaux", "Ligue musulmane"]
    assessment: "Mobilise les femmes dans la marche du sel et les campagnes civiles ; son rôle est institutionnel et symbolique, pas seulement décoratif."
    memory: "« Rossignol de l'Inde », figure de l'émancipation ; parfois réduite à sa poésie."
    sources: ["SRC-012", "SRC-005"]

  - id: "ACTOR-005"
    label: "B. R. Ambedkar"
    type: "individual"
    roles: ["juriste", "dirigeant dalit", "président du comité de rédaction de la Constitution", "fondateur de la Scheduled Castes Federation"]
    period_ids: ["PERIOD-4", "PERIOD-5"]
    places: ["Mahad", "Bombay", "Nagpur", "Delhi"]
    resources: ["formation juridique", "presse (Mooknayak)", "organisations dalits", "expertise constitutionnelle"]
    constraints: ["exclusion de caste", "opposition de Gandhi et du Congrès", "Poona Pact (1932)", "faible base électorale"]
    networks: ["militants dalits", "réformateurs", "juristes", "délégations britanniques"]
    counterpowers: ["Congrès", "Hindu Mahasabha", "élites brahmaniques"]
    assessment: "Fait de l'égalité juridique et de la représentation politique des Dalits un enjeu national ; la conversion de 1956 est un acte politique et religieux."
    memory: "Icône dalite, architecte de la Constitution, figure de l'anti-caste ; usages politiques concurrents."
    sources: ["SRC-019", "SRC-011", "SRC-010"]

  - id: "ACTOR-006"
    label: "M. K. Gandhi"
    type: "individual"
    roles: ["dirigeant national", "théoricien de la non-violence", "organisateur de campagnes de masse"]
    period_ids: ["PERIOD-4", "PERIOD-5"]
    places: ["Sabarmati", "Dandi", "Calcutta", "Delhi", "Noakhali"]
    resources: ["autorité morale", "réseau du Congrès", "ashrams", "presse (Young India, Harijan)", "capacité de mobilisation"]
    constraints: ["élites du Congrès", "répression britannique", "politique communautaire", "ses propres limites politiques et sociales"]
    networks: ["Nehru", "Patel", "Sarojini Naidu", "radicaux britanniques", "mouvements paysans"]
    counterpowers: ["Ligue musulmane", "Hindu Mahasabha", "gauche révolutionnaire", "gouvernement colonial"]
    assessment: "Transforme le nationalisme en mouvement de masse non violent ; ses campagnes ont des limites et des angles morts (caste, genre, Afrique du Sud)."
    memory: "Père de la nation, icône mondiale de la non-violence ; mémoire contestée par les Dalits et les nationalistes hindous."
    sources: ["SRC-005", "SRC-006"]

  - id: "ACTOR-007"
    label: "Jawaharlal Nehru"
    type: "individual"
    roles: ["Premier ministre (1947-1964)", "architecte du non-alignement", "promoteur de la planification"]
    period_ids: ["PERIOD-4", "PERIOD-5"]
    places: ["Allahabad", "Delhi", "Lahore"]
    resources: ["parti du Congrès", "appareil d'État", "planification", "prestige international"]
    constraints: ["Partition", "guerre froide", "crises alimentaires", "mouvements régionaux", "défaite de 1962"]
    networks: ["Mountbatten", "Krishna Menon", "Nasser", "Tito", "experts économiques"]
    counterpowers: ["RSS", "partis communistes", "partis régionaux", "cour suprême"]
    assessment: "Fonde un fédéralisme parlementaire et un État développementaliste ; son bilan est terni par la guerre de 1962 et les tensions au Cachemire."
    memory: "Symbole de la République séculière et du non-alignement ; cible des critiques hindou-nationalistes."
    sources: ["SRC-006", "SRC-005"]

  - id: "ACTOR-008"
    label: "Indira Gandhi"
    type: "individual"
    roles: ["Première ministre (1966-1977, 1980-1984)", "cheffe de guerre (1971)", "auteure de l'État d'urgence"]
    period_ids: ["PERIOD-5"]
    places: ["Delhi", "Allahabad", "Amritsar"]
    resources: ["centralisation du Congrès", "services de renseignement", "contrôle des médias", "légitimité dynastique"]
    constraints: ["barons du parti", "judiciaire", "mouvements régionaux", "crise économique", "Pendjab"]
    networks: ["Sanjay Gandhi", "Congrès(I)", "conseillers", "alliés internationaux"]
    counterpowers: ["mouvement JP", "Cour suprême", "presse", "militants sikhs", "oppositions régionales"]
    assessment: "Bilan contrasté : victoire de 1971 et test nucléaire de 1974, mais État d'urgence, censure et opération Blue Star."
    memory: "« Dame de fer » pour ses partisans, figure autoritaire pour ses adversaires ; mémoire fortement genrée."
    sources: ["SRC-006", "SRC-020"]

  - id: "ACTOR-009"
    label: "Muhammad Ali Jinnah"
    type: "individual"
    roles: ["avocat", "dirigeant de la Ligue musulmane", "fondateur du Pakistan"]
    period_ids: ["PERIOD-4"]
    places: ["Bombay", "Lahore", "Karachi", "Delhi"]
    resources: ["compétence juridique", "Ligue musulmane", "négociation avec les Britanniques", "réseaux provinciaux"]
    constraints: ["majoritarisme du Congrès", "factions de la Ligue", "élites provinciales", "pression de la base"]
    networks: ["Liaquat Ali Khan", "vice-rois britanniques", "élites musulmanes"]
    counterpowers: ["Congrès", "clergé musulman", "partis provinciaux"]
    assessment: "Utilise la demande du Pakistan comme levier constitutionnel ; sa responsabilité dans la Partition est discutée, pas unique."
    memory: "Fondateur du Pakistan, figure contestée en Inde ; les récits nationalistes des deux pays s'opposent."
    sources: ["SRC-009", "SRC-008"]

  - id: "ACTOR-010"
    label: "Dalit Panthers"
    type: "collective"
    roles: ["mouvement politique et littéraire dalit", "organisation de quartier", "voix anti-caste"]
    period_ids: ["PERIOD-5"]
    places: ["Bombay", "Pune", "Maharashtra"]
    resources: ["poésie et presse", "réseaux de quartier", "mémoire de Ambedkar", "capacité de mobilisation"]
    constraints: ["répression policière", "factionnalisme", "violences de caste", "cooptation politique"]
    networks: ["Namdeo Dhasal", "J. V. Pawar", "Arun Kamble", "militants dalits"]
    counterpowers: ["Shiv Sena", "police", "Congrès", "patronat"]
    assessment: "Rend visible la violence de caste et radicalise une génération ; son influence décline après les années 1980, mais son héritage littéraire demeure."
    memory: "Icône de la fierté dalite ; commémorations et récupérations politiques."
    sources: ["SRC-011", "SRC-019"]

  - id: "ACTOR-011"
    label: "Indian National Congress"
    type: "collective"
    roles: ["parti national (fondé en 1885)", "vecteur du mouvement d'indépendance", "parti dominant (1947-1977)"]
    period_ids: ["PERIOD-4", "PERIOD-5"]
    places: ["Bombay", "Calcutta", "Allahabad", "Delhi"]
    resources: ["comités provinciaux", "presse", "militants", "réseaux de notables", "aura de Gandhi et Nehru"]
    constraints: ["divisions communautaires", "répression britannique", "modération des élites", "concurrence de la Ligue musulmane"]
    networks: ["Gandhi", "Nehru", "Patel", "ailes féminines", "syndicats"]
