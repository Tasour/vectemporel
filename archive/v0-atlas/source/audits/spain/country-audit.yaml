periodizations:
  - id: "POL-1"
    label: "Périodisation politique proposée : souverainetés, régimes et ruptures"
    type: "political"
    start_edtf: "-0218"
    end_edtf: "2026"
    rationale: "Hispanie romaine (-218/409), royaume wisigoth (418/711), al-Andalus et royaumes chrétiens (711/1492), monarchie composite et empire (1492/1808), révolution libérale (1808/1874), Restauration (1874/1931), République et guerre (1931/1939), franquisme (1939/1975), démocratie (1975/2026)."
    sources: ["SRC-001", "SRC-002", "SRC-008", "SRC-011"]
    selected: true
  - id: "SOC-1"
    label: "Périodisation sociale et économique proposée : travail, démographie, techniques"
    type: "social_economic"
    start_edtf: "-0218"
    end_edtf: "2026"
    rationale: "Romanisation et esclavage (-218/409), société wisigothe (418/711), économie agraire et marchande d'al-Andalus (711/1492), empire colonial et fiscalité (1492/1808), révolution agraire et industrialisation (1808/1936), société de masse et exode rural (1936/1975), tertiarisation, immigration et précarité (1975/2026)."
    sources: ["SRC-011", "SRC-012"]
    selected: false
  - id: "CULT-1"
    label: "Périodisation culturelle, religieuse et environnementale proposée"
    type: "cultural_religious_environmental"
    start_edtf: "-0218"
    end_edtf: "2026"
    rationale: "Paganisme romain et christianisation (-218/589), catholicisme wisigoth (589/711), coexistence et conflits des trois religions (711/1492), État confessionnel et Inquisition (1492/1808), sécularisation et anticléricalisme (1808/1936), national-catholicisme (1939/1975), pluralisme, mémoires et crise environnementale (1975/2026)."
    sources: ["SRC-004", "SRC-006", "SRC-019"]
    selected: false

periods:
  - id: "PERIOD-1"
    label: "Al-Andalus & Reconquista"
    start_edtf: "711"
    end_edtf: "1492"
    boundary_type: "military"
    boundary_rationale: "711 : bataille de Guadalete et effondrement du royaume wisigoth. La période mêle al-Andalus et royaumes chrétiens ; le label « Reconquista » est téléologique et doit être discuté."
    alternatives_considered:
      - "711-1212 / 1212-1492"
      - "711-1031 / 1031-1492"
      - "garder 711-1492 avec sous-périodes"
    sources: ["SRC-001", "SRC-003"]
  - id: "PERIOD-2"
    label: "Empire espagnol"
    start_edtf: "1492"
    end_edtf: "1808"
    boundary_type: "political"
    boundary_rationale: "1492 est un triple événement (Grenade, expulsion des Juifs, Colomb) ; 1808 ouvre la crise de la monarchie. La période couvre les Habsbourg et les Bourbons."
    alternatives_considered:
      - "1492-1700 / 1700-1808"
      - "1516-1700 / 1700-1808"
    sources: ["SRC-006", "SRC-008"]
  - id: "PERIOD-3"
    label: "Crises & nation"
    start_edtf: "1808"
    end_edtf: "1936"
    boundary_type: "political"
    boundary_rationale: "1808-1814 : guerre et révolution libérale ; 1814-1874 : construction de l'État libéral ; 1874-1931 : Restauration ; 1931-1936 : République. La borne de 1936 est politique et militaire."
    alternatives_considered:
      - "1808-1874 / 1874-1936"
      - "1808-1898 / 1898-1936"
    sources: ["SRC-010", "SRC-011"]
  - id: "PERIOD-4"
    label: "Guerre civile & franquisme"
    start_edtf: "1936"
    end_edtf: "1975"
    boundary_type: "military"
    boundary_rationale: "1936-1939 : guerre civile ; 1939-1975 : dictature. La borne de 1936 inclut le coup d'État et la guerre ; 1975 marque la mort de Franco, pas la fin immédiate du régime."
    alternatives_considered:
      - "1936-1939 / 1939-1975"
      - "1939-1975 seulement"
    sources: ["SRC-013", "SRC-014"]
  - id: "PERIOD-5"
    label: "Démocratie"
    start_edtf: "1975"
    end_edtf: "2026"
    boundary_type: "political"
    boundary_rationale: "1975-1982 : transition ; 1982-2008 : consolidation européenne ; 2008-2026 : crises, 15-M, Catalogne, mémoire. La borne de 1975 est symbolique et doit être complétée par 1978."
    alternatives_considered:
      - "1975-1986 / 1986-2026"
      - "1975-2008 / 2008-2026"
    sources: ["SRC-015", "SRC-018"]

