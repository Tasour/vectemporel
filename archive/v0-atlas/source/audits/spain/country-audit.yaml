    subject: "Conquête de 711"
    predicate: "fut"
    object: "un processus"
    text: "La conquête musulmane de 711 ne se réduit pas à un débarquement unique : elle combine une bataille (Guadalete), des accords locaux et une installation progressive de forces arabo-berbères."
    confidence: "probable"
    sources: ["SRC-001", "SRC-003"]
    revisions: []
  - id: "CLAIM-2"
    subject: "Covadonga"
    predicate: "est"
    object: "une construction historiographique"
    text: "La bataille de Covadonga, traditionnellement datée de 722, est connue par des sources tardives ; son rôle de « début de la Reconquista » est une construction médiévale et moderne."
    confidence: "disputed"
    sources: ["SRC-001"]
    revisions: []
  - id: "CLAIM-3"
    subject: "1492"
    predicate: "doit être traité comme"
    object: "un ensemble d'événements"
    text: "1492 réunit la capitulation de Grenade (2 janvier), le décret d'expulsion des Juifs (31 mars) et l’arrivée de Colomb aux Caraïbes (12 octobre) ; les confondre en une « fin de la Reconquista » masque les politiques de confessionnalisation."
    confidence: "certain"
    sources: ["SRC-005", "SRC-008"]
    revisions: []
  - id: "CLAIM-4"
    subject: "Convivencia"
    predicate: "est"
    object: "un modèle historiographique discuté"
    text: "La notion de convivencia décrit des formes réelles de coexistence, mais elle ne doit pas effacer les violences, les conversions forcées et les persécutions."
    confidence: "disputed"
    sources: ["SRC-004", "SRC-003"]
    revisions: []
  - id: "CLAIM-5"
    subject: "1898"
    predicate: "ne marque pas"
    object: "la fin de toutes les colonies espagnoles"
    text: "L'Espagne perd Cuba, Porto Rico, les Philippines et Guam en 1898, mais conserve le Río de Oro/Sahara occidental et la Guinée équatoriale, et établit plus tard un protectorat au Maroc (1912)."
    confidence: "certain"
    sources: ["SRC-010", "SRC-009"]
    revisions: []
  - id: "CLAIM-6"
    subject: "Régime franquiste"
    predicate: "est"
    object: "un régime autoritaire et national-catholique"
    text: "Le franquisme combine répression, parti unique, corporatisme et national-catholicisme ; sa qualification de « fasciste » fait débat chez les historiens."
    confidence: "disputed"
    sources: ["SRC-014", "SRC-013"]
    revisions: []
  - id: "CLAIM-7"
    subject: "Transition démocratique"
    predicate: "fut"
    object: "une transition négociée avec des coûts mémoriels"
    text: "La transition de 1975-1982 repose sur des pactes, une amnistie et des compromis ; elle n'efface ni les violences de la guerre ni les demandes de justice des victimes."
    confidence: "disputed"
    sources: ["SRC-015", "SRC-011"]
    revisions: []
  - id: "CLAIM-8"
