    scale: "transnational"
    what_is_missing: "Les interventions secrètes de la guerre froide (Iran 1953, Guatemala 1954, Cuba 1961, Chili 1973) et les guerres par procuration ne sont pas traitées."
    reason: "not_yet_researched"
    justification: "La fiche « guerre froide » parle d’un conflit sans conflit direct; elle efface les interventions, les dictatures soutenues et les morts des pays du Sud. C’est un biais exceptionnaliste majeur. Aucune synthèse spécialisée sur les interventions n’est encore au registre."
