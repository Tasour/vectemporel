    domain: "Peuples autochtones & minorités"
    scale: "regional"
    what_is_missing: "Le renversement de la monarchie hawaïenne (1893), l’annexion de 1898 et les revendications de souveraineté kanaka maoli ne sont pas traités."
    reason: "not_yet_researched"
    justification: "Hawaï apparaît au mieux comme un État de 1959; l’annexion impériale et la dépossession de la monarchie sont absentes. Cela naturalise la frontière américaine dans le Pacifique."
