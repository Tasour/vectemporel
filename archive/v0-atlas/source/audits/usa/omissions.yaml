  - id: "OM-009"
    period_id: "ERA-3"
    domain: "Guerres & diplomatie"
    scale: "imperial"
    what_is_missing: "La guerre américano-philippine (1899-1902), la répression de l’insurrection et les camps de reconcentration ne sont pas traités."
    reason: "out_of_scope"
    justification: "1898 est présenté comme une victoire contre l’Espagne, mais l’annexion des Philippines ouvre une guerre coloniale longue et meurtrière. L’absence est un angle mort de l’histoire impériale."
    evidence_checked: ["SRC-009"]
    status: "to_fill"
    reviewer: "audit v1.0 (non signé)"
    review_date: "2026-11-13"
  - id: "OM-010"
    period_id: "ERA-4"
    domain: "Politique & institutions"
    scale: "imperial"
    what_is_missing: "Le statut de Porto Rico après 1898 (Foraker Act 1900, Jones-Shafroth Act 1917, commonwealth 1952) et la citoyenneté américaine des Porto-Ricains ne sont pas traités."
    reason: "not_yet_researched"
    justification: "La frise parle d’un territoire national continu; elle ne montre pas que des millions de citoyens américains vivent dans des territoires non incorporés sans représentation fédérale complète."
