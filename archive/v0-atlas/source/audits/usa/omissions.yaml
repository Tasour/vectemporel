omissions:
  - id: "OM-001"
    period_id: "ERA-1"
    domain: "Peuples autochtones & minorités"
    scale: "regional"
    what_is_missing: "L’histoire des peuples autochtones avant 1607 (Cahokia, Chaco, Haudenosaunee, sociétés mississippiennes) n’a aucun repère dans la frise."
    reason: "out_of_scope"
    justification: "La borne de 1607 est une convention anglo-coloniale, pas un commencement humain. L’absence est acceptable dans la frise actuelle seulement si un module antérieur est explicitement prévu; elle reste une dette éditoriale."
    evidence_checked: ["SRC-006"]
    status: "to_fill"
    reviewer: "audit v1.0 (non signé)"
    review_date: "2026-11-13"
  - id: "OM-002"
    period_id: "ERA-1"
    domain: "Politique & institutions"
    scale: "regional"
    what_is_missing: "La présence coloniale espagnole (Saint Augustine, 1565; Santa Fe, 1610) et française (Detroit, 1701; La Nouvelle-Orléans, 1718) est absente ou marginalisée."
    reason: "out_of_scope"
    justification: "La frise commence à Jamestown et construit un récit anglais des origines. Cette omission est structurante: elle efface les empires rivaux et les populations métisses du Sud-Ouest et du Mississippi. Aucune synthèse spécialisée sur la Louisiane française n’est encore au registre."
    evidence_checked: ["SRC-006"]
    status: "to_fill"
    reviewer: "audit v1.0 (non signé)"
    review_date: "2026-11-13"
  - id: "OM-003"
    period_id: "ERA-1"
    domain: "Économie & travail"
    scale: "transnational"
    what_is_missing: "L’esclavage atlantique avant 1619, l’esclavage espagnol en Floride et dans les Caraïbes, et la traite portugaise ne sont pas traités."
    reason: "out_of_scope"
    justification: "1619 est la première arrivée attestée en Amérique du Nord britannique, pas le début de l’esclavage dans les Amériques. La formulation actuelle risque de confondre commencement anglais et commencement atlantique."
    evidence_checked: ["SRC-007", "SRC-006"]
    status: "to_fill"
    reviewer: "audit v1.0 (non signé)"
    review_date: "2026-11-13"
  - id: "OM-004"
    period_id: "ERA-1"
    domain: "Femmes, genre, sexualités"
    scale: "local"
    what_is_missing: "Aucun repère sur les femmes coloniales, le travail domestique, le genre et la sexualité avant 1776; Pocahontas n’est pas traitée comme actrice historique."
    reason: "not_yet_researched"
    justification: "Le silence est double: les femmes autochtones et les femmes européennes sont absentes, et le mythe de Pocahontas n’est pas confronté aux sources. Une fiche genrée est nécessaire."
    evidence_checked: ["SRC-006", "SRC-013"]
    status: "to_fill"
    reviewer: "audit v1.0 (non signé)"
    review_date: "2026-11-13"
  - id: "OM-005"
    period_id: "ERA-2"
    domain: "Économie & travail"
    scale: "national"
    what_is_missing: "Le travail artisanal, les filatures de Lowell, l’apprentissage et le travail esclave dans l’économie du Nord et du Sud ne sont pas traités avant 1886."
    reason: "not_yet_researched"
    justification: "L’histoire du travail commence dans la frise avec le chemin de fer et Haymarket, ce qui saute l’industrialisation précoce et l’esclavage comme système de travail."
    evidence_checked: ["SRC-007", "SRC-008"]
    status: "to_fill"
    reviewer: "audit v1.0 (non signé)"
    review_date: "2026-11-13"
  - id: "OM-006"
    period_id: "ERA-3"
    domain: "Migrations & diasporas"
    scale: "transnational"
    what_is_missing: "La ruée vers l’or, les travailleurs chinois du transcontinental et les communautés asiatiques avant 1882 ne sont pas traités."
    reason: "not_yet_researched"
    justification: "Le Chinese Exclusion Act de 1882 arrive sans l’histoire de ceux qu’il exclut. La frise donne l’exclusion sans les trajectoires migratoires qui la précèdent."
    evidence_checked: ["SRC-010", "SRC-002"]
    status: "to_fill"
    reviewer: "audit v1.0 (non signé)"
    review_date: "2026-11-13"
  - id: "OM-007"
    period_id: "ERA-2"
    domain: "Migrations & diasporas"
    scale: "regional"
    what_is_missing: "L’histoire latino-américaine antérieure à 1848 (Californie, Texas, Floride espagnole et mexicaine) n’est pas traitée."
    reason: "out_of_scope"
    justification: "Le traité de Guadalupe Hidalgo ne peut pas être compris sans les sociétés mexicaines annexées. La frise risque de faire apparaître les Latinos seulement comme immigrants."
    evidence_checked: ["SRC-012", "SRC-001"]
    status: "to_fill"
    reviewer: "audit v1.0 (non signé)"
    review_date: "2026-11-13"
