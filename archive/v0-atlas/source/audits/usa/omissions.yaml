    period_id: "ERA-3"
    domain: "Femmes, genre, sexualités"
    scale: "national"
    what_is_missing: "Le mouvement suffragiste entre 1865 et 1920, la NAWSA, la NWP et les militantes noires comme Ida B. Wells ne sont pas traités."
    reason: "not_yet_researched"
    justification: "Le 19e amendement est proposé comme un événement isolé; sans l’histoire du mouvement, il risque d’apparaître comme un cadeau constitutionnel plutôt qu’une conquête conflictuelle."
    evidence_checked: ["SRC-013"]
    status: "to_fill"
    reviewer: "audit v1.0 (non signé)"
