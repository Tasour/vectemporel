    summary: "Le traité signé le 2 février 1848 met fin à la guerre américano-mexicaine. Mexico cède la Californie, le Nevada, l’Utah, le Nouveau-Mexique, la majeure partie de l’Arizona et du Colorado, ainsi que des parties de l’Oklahoma, du Kansas et du Wyoming, et renonce au Texas; l’article X protégeant les concessions foncières est supprimé par le Sénat."
