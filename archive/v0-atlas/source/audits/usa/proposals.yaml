    end_year: null
    title: "Révolte des Pueblo"
    subtitle: "Popé et l’expulsion des Espagnols"
    tags: ["guerre", "societe"]
    importance: 3
    summary: "Du 10 au 21 août 1680, des villages pueblos coordonnent une révolte contre le pouvoir colonial espagnol au Nouveau-Mexique. Les Espagnols sont expulsés de Santa Fe et ne reviennent qu’en 1692; la révolte reste une référence de souveraineté autochtone."
    sources: ["SRC-006"]
    confidence: "medium"
    rationale: "Elle documente la présence espagnole et la capacité politique autochtone avant 1776, absentes de la frise."
