corrections:
  - existing_id: "us-jamestown"
    issue: "La fiche dit « première colonie anglaise durable » et fait de 1607 l’origine nationale; elle omet la présence espagnole (Saint Augustine 1565, Santa Fe 1610), française, et les Powhatans."
    proposal: "Reformuler en « première colonie anglaise durable en Amérique du Nord » et ajouter un chapeau sur les empires rivaux et les peuples autochtones; envisager une borne à 1565 ou un module pré-1607."
    sources: ["SRC-006"]
    confidence: "high"
  - existing_id: "us-independance"
    issue: "« La Déclaration affirme des droits naturels et l’égalité des hommes » est exact, mais la fiche ne dit pas que les signataires incluent des propriétaires d’esclaves et que les nations autochtones sont exclues."
    proposal: "Ajouter une phrase sur l’esclavage et la souveraineté autochtone; distinguer le texte et ses usages."
    sources: ["SRC-007", "SRC-006"]
    confidence: "high"
  - existing_id: "us-constitution"
    issue: "La fiche omet le compromis des trois cinquièmes, les protections de l’esclavage et l’exclusion des femmes, des Autochtones et des esclaves."
    proposal: "Ajouter un paragraphe sur les compromis fondateurs et leurs exclusions; ne pas présenter la Constitution comme une démocratie achevée."
    sources: ["SRC-007", "SRC-008"]
    confidence: "high"
  - existing_id: "us-louisiane"
    issue: "« Napoléon vend la Louisiane pour financer ses guerres » est trop simple; la révolution haïtienne et l’échec de la reconquête de Saint-Domingue pèsent sur la décision."
    proposal: "Ajouter Haïti et l’esclavage; préciser que l’achat accélère l’expansion de la plantation et la dépossession autochtone."
    sources: ["SRC-007"]
