periodization:
  current_verdict: "La séquence en six ères est contiguë et lisible, mais elle confond l’histoire anglaise et l’histoire du territoire, fond la Reconstruction dans la guerre civile et construit une téléologie de l’hyperpuissance. Elle doit être conservée dans sa logique politique, avec des bornes corrigées et des fils transversaux."
  proposed_changes:
    - action: "add"
      era_name: "Module pré-1607"
      proposal: "Ajouter un module ou une ère consacrée aux sociétés autochtones avant 1607 (Cahokia, Chaco, Haudenosaunee) et aux empires espagnol et français."
      rationale: "La borne de 1607 est une convention anglo-coloniale; sans module antérieur, la frise naturalise la fondation anglaise et efface les histoires autochtone et impériale."
      sources: ["SRC-006"]
    - action: "move_boundary"
      era_name: "Colonisation"
      proposal: "Déplacer la borne de début de 1607 à 1565 (Saint Augustine) ou assumer explicitement un module pré-1607."
      rationale: "Saint Augustine (1565) et Santa Fe (1610) précèdent Jamestown; la présence espagnole et française structure le continent."
      sources: ["SRC-006"]
    - action: "rename"
      era_name: "Colonisation"
      proposal: "Renommer « Colonisation » en « Colonies atlantiques et empires »."
      rationale: "Le mot « colonisation » au singulier masque la pluralité des empires et des sociétés autochtones."
      sources: ["SRC-006"]
    - action: "keep"
      era_name: "Naissance d’une nation"
      proposal: "Conserver 1776-1861, en précisant « république esclavagiste » dans le sous-titre."
      rationale: "La séquence est pertinente, mais elle doit nommer l’esclavage et l’expansion territoriale."
      sources: ["SRC-007", "SRC-008"]
    - action: "split"
      era_name: "Guerre civile & reconstruction"
      proposal: "Scinder 1861-1900 en 1861-1877 (guerre et Reconstruction) et 1877-1900 (Gilded Age, Jim Crow et empire)."
      rationale: "La Reconstruction est une séquence politique autonome; la fondre dans 1861-1900 masque sa fin et la mise en place de Jim Crow."
      sources: ["SRC-008", "SRC-009"]
    - action: "keep"
      era_name: "Puissance mondiale"
      proposal: "Conserver 1900-1945."
      rationale: "La séquence est cohérente pour l’industrialisation, les guerres mondiales et le New Deal."
      sources: ["SRC-009", "SRC-016"]
    - action: "keep"
      era_name: "Guerre froide & droits civiques"
      proposal: "Conserver 1945-1991, en ajoutant les guerres de Corée et du Vietnam et les interventions."
      rationale: "La période est juste, mais son récit actuel est trop consensuel et omet les guerres réelles."
      sources: ["SRC-009", "SRC-017"]
    - action: "split"
      era_name: "Hyperpuissance"
      proposal: "Scinder 1991-2026 en 1991-2001 (après-guerre froide) et 2001-2026 (sécurité, crise et polarisation)."
      rationale: "Le 11-Septembre ouvre une séquence distincte; 1991-2001 est une décennie de mondialisation et de confiance impériale."
      sources: ["SRC-009", "SRC-020"]
    - action: "rename"
      era_name: "Hyperpuissance"
      proposal: "Renommer « Hyperpuissance » en « Après-guerre froide » puis « Sécurité, crise et polarisation »."
      rationale: "« Hyperpuissance » est un jugement triumphaliste et ne décrit pas la période 2001-2026."
      sources: ["SRC-009", "SRC-020"]

events:
  - id: "PROP-001"
    action: "add"
    existing_id: null
    year: 1619
    end_year: null
    title: "Premiers Africains en Virginie"
    subtitle: "Point Comfort, août 1619"
    tags: ["societe", "economie"]
    importance: 3
    summary: "Une vingtaine d’Africains capturés par le White Lion sont vendus à Point Comfort, en Virginie, à la fin du mois d’août 1619. Leur statut initial n’est pas uniformément l’esclavage héréditaire, codifié plus tard dans la colonie; leur arrivée ouvre néanmoins la longue histoire de l’esclavage racial en Amérique du Nord britannique."
    sources: ["SRC-007"]
    confidence: "medium"
    rationale: "La frise commence en 1607 mais saute 1619, alors que l’esclavage structure l’économie et la société coloniales."
