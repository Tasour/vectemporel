      name: "Reich médiéval"
    confidence: "high"
    rationale: >-
      La borne 962 est conservée comme convention, mais « Saint-Empire »
      projette sur le Xe siècle une institution dont le titre se fixe plus tard.
      « Reich médiéval » évite de faire de 962 la naissance d’un État allemand
      (SRC-001).

  - name: "Deux Allemagnes"
