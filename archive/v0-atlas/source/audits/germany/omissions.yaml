# Vectemporel — registre des omissions (méthode v1.0)
# Dossier Allemagne — omissions explicites, non silencieuses.

schema_version: "1.0"
country_id: "germany"
reviewed_at: "2026-11-13"
reviewer: ""

reviewed_scope:
  period_ids: ["ERA-1", "ERA-2", "ERA-3", "ERA-4", "ERA-5", "ERA-6"]
  domains:
    - "Politique & institutions"
    - "Guerres & diplomatie"
    - "Droit & justice"
    - "Économie & travail"
    - "Société & démographie"
    - "Femmes, genre, sexualités"
    - "Religions & croyances"
    - "Sciences, techniques & santé"
    - "Arts & lettres"
