      construction de l’Empire.
    evidence_checked: ["SRC-004", "SRC-005"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"

  - id: "OM-010"
    period_id: "ERA-3"
    domain: "Sciences, techniques & santé"
    scale: "national"
    what_is_missing: >-
      Robert Koch, Siemens, chimie industrielle, universités de recherche,
      médecine sociale et hygiène urbaine.
    reason: "not_yet_researched"
    justification: >-
      L’Allemagne du XIXe siècle est un pôle scientifique majeur ; la frise
