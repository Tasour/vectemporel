  scales: ["local", "regional", "national", "imperial", "transnational"]

omissions:
  - id: "OM-001"
    period_id: "ERA-1"
    domain: "Guerres & diplomatie"
    scale: "imperial"
    what_is_missing: >-
      Guerres ottoniennes, conflit des Investitures, expéditions impériales en
      Italie et campagnes contre les Slaves.
    reason: "not_yet_researched"
    justification: >-
      La frise ne retient que le couronnement de 962 ; les guerres médiévales
      ne sont pas documentées dans le corpus actuel. Une fiche sur la querelle
      des Investitures (1076–1122) est la priorité.
    evidence_checked: ["SRC-001"]
    status: "documented"
    reviewer: ""
    review_date: "2026-11-13"

  - id: "OM-002"
    period_id: "ERA-1"
    domain: "Économie & travail"
    scale: "regional"
    what_is_missing: >-
      Économie agraire, essor urbain, Hanse, mines et commerce à longue
      distance.
    reason: "not_yet_researched"
    justification: >-
      Aucun repère économique médiéval n’est présent. La Hanse et les villes
      d’Allemagne du Nord sont un angle mort majeur, faute de source dans le
      registre.
    evidence_checked: ["SRC-001"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"

  - id: "OM-003"
    period_id: "ERA-1"
    domain: "Femmes, genre, sexualités"
    scale: "national"
    what_is_missing: >-
      Hildegarde de Bingen, femmes nobles, monastères féminins, travail des
      femmes et normes de genre.
    reason: "not_yet_researched"
    justification: >-
      La période médiévale n’a aucune entrée sur les femmes. Le silence est
      d’autant plus problématique que des sources existent (Hildegarde,
      chartes, coutumiers), mais elles ne sont pas dans le corpus vérifié.
    evidence_checked: ["SRC-001"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"

  - id: "OM-004"
    period_id: "ERA-1"
    domain: "Sciences, techniques & santé"
    scale: "transnational"
    what_is_missing: >-
      Imprimerie de Gutenberg (vers 1450), universités, astronomie et
      circulation des savoirs.
    reason: "not_yet_researched"
    justification: >-
      L’imprimerie est l’un des apports majeurs de l’espace germanique à
      l’histoire mondiale ; son absence est une dette documentaire, non un
      jugement de valeur.
    evidence_checked: ["SRC-001"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"

  - id: "OM-005"
    period_id: "ERA-2"
    domain: "Droit & justice"
    scale: "imperial"
    what_is_missing: >-
      Chambre impériale de justice (Reichskammergericht), Caroline (1532),
      droit coutumier et procédures de tolérance confessionnelle.
    reason: "not_yet_researched"
    justification: >-
      La frise traite la Réforme et la guerre, mais pas la construction d’un
      ordre juridique impérial. Le sujet exige des sources juridiques
      spécifiques, absentes du registre.
    evidence_checked: ["SRC-003"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"

  - id: "OM-006"
    period_id: "ERA-2"
    domain: "Économie & travail"
    scale: "regional"
    what_is_missing: >-
      Proto-industrialisation, crises agraires, mines d’argent, manufactures et
      circuits commerciaux.
    reason: "not_yet_researched"
    justification: >-
      La période 1517–1815 est représentée par la religion et la guerre ; son
      histoire économique n’est pas instrumentée.
    evidence_checked: ["SRC-003"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"

  - id: "OM-007"
    period_id: "ERA-2"
    domain: "Femmes, genre, sexualités"
    scale: "national"
    what_is_missing: >-
      Femmes dans la Réforme, fermeture des couvents, procès en sorcellerie,
      travail féminin et normes sexuelles.
    reason: "not_yet_researched"
    justification: >-
      La Réforme transforme les institutions féminines et les normes de genre ;
      aucune entrée ne le documente. Une fiche sur les couvents et la
      sorcellerie est à prévoir.
    evidence_checked: ["SRC-002"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"

  - id: "OM-008"
    period_id: "ERA-2"
    domain: "Migrations & diasporas"
    scale: "transnational"
    what_is_missing: >-
      Huguenots après l’édit de Potsdam (1685), protestants de Salzbourg,
      Juifs d’Europe centrale, migrations de travail saisonnières.
    reason: "not_yet_researched"
    justification: >-
      Les migrations de l’époque moderne sont absentes, alors qu’elles
      structurent des territoires entiers (Brandebourg, Prusse, villes
      rhénanes).
    evidence_checked: ["SRC-003"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"

