schema_version: "1.0"
country:
  id: "japan"
  iso2: "JP"
  iso3: "JPN"
  name_current: "Japon"
  names_historical:
    - "Nihon / Nippon (日本)"
    - "Wa (倭)"
    - "Yamato (大和)"
    - "Dai-Nippon Teikoku (大日本帝国), 1889–1947"
    - "Nippon-koku (日本国), depuis 1947"
  flag: "🇯🇵"

scope:
  territory_current: "Archipel japonais: Honshū, Hokkaidō, Kyūshū, Shikoku, Okinawa et des milliers d'îles. Différends territoriaux non tranchés avec la Russie (Kouriles du Sud), la Chine/Taïwan (Senkaku/Diaoyu) et la Corée du Sud (Takeshima/Dokdo)."
  territories_historical:
    - "Royaume de Ryūkyū, annexé en 1879 (préfecture d'Okinawa)"
    - "Taïwan et Pescadores, 1895–1945"
    - "Corée, 1910–1945"
    - "Karafuto / Sakhaline du Sud, 1905–1945"
    - "Territoire loué du Kwantung, 1905–1945"
    - "Mandchourie / Mandchoukouo, État fantoche de 1932 à 1945"
    - "Mandat des mers du Sud, 1919–1945"
  regions_autonomous: []
  populations_included:
    - "nationaux japonais"
    - "Ainu (peuple autochtone de Hokkaidō et du nord de Honshū)"
    - "Ryūkyūens / Okinawaïens"
    - "résidents coréens au Japon (Zainichi), y compris les résidents permanents spéciaux"
    - "burakumin (groupe discriminé, citoyens japonais)"
    - "résidents étrangers et naturalisés"
    - "rapatriés et Nikkei revenus au Japon"
  populations_excluded:
    - "diasporas nikkei installées hors archipel, traitées comme circulations transnationales"
    - "populations des anciennes colonies après 1945, sauf rapatriés et résidents au Japon"
  diasporas:
    - "Nikkei du Brésil, du Pérou, des États-Unis, du Canada et d'Hawaï"
    - "communautés japonaises en Asie et en Océanie"
    - "rapatriés de Mandchourie, de Corée et de Sakhaline après 1945"
    - "Zainichi coréens et leurs descendants"
  temporal:
    start_edtf: "538"
    end_edtf: "2026"
    start_rationale: "Borne actuelle de l'application, choisie pour l'arrivée traditionnelle du bouddhisme. L'audit recommande une extension à la préhistoire (Jōmon, Yayoi, Kofun), car 538 n'est ni le début du peuplement ni celui de l'écriture; le Nihon Shoki donne aussi 552."
    end_rationale: "2026, année de l'audit; la période contemporaine est ouverte et doit être mise à jour à chaque release."
  unit_of_analysis: "fiche-événement; fiches-processus pour la préhistoire, l'industrialisation, la colonisation et le vieillissement"
  inclusion_criteria:
    - "événement ou processus qui modifie les institutions, le territoire, les rapports sociaux ou les mémoires"
    - "au moins un acteur identifié, un lieu daté et une source vérifiée"
    - "au moins une connexion transfrontalière par période"
    - "au moins un acteur non élitaire par grande période, sans tokenisme"
  exclusion_criteria:
    - "anecdote sans effet structurel documenté"
    - "événement étranger sans lien japonais explicite"
    - "date ou acteur non vérifiable"
    - "commémoration confondue avec l'événement commémoré"
  audience:
    - "grand public"
    - "scolaire"
    - "diasporas"
    - "recherche"
  evidence_threshold: "deux sources indépendantes par fiche, ou exception documentée"

governance:
  editor: "à désigner"
  country_reader: "à désigner"
  method_reader: "à désigner"
  arbiter: "à désigner"
  data_steward: "à désigner"
  sensitivity_expert: "à désigner"
  responsible_editor: "à désigner"
  conflicts_of_interest: []

historiography:
  schools:
    - "histoire politique et institutionnelle (Cambridge History of Japan)"
    - "histoire sociale et du travail (Andrew Gordon)"
    - "histoire du genre et des femmes (Vera Mackie)"
    - "histoire postcoloniale et des minorités (Peter Duus, Tessa Morris-Suzuki, Richard Siddle)"
    - "histoire environnementale (Brett Walker, Timothy George)"
    - "histoire de la mémoire et de l'empire (John Dower, Laura Hein, Mark Selden)"
    - "histoire régionale (Okinawa, Hokkaidō, Tōhoku, Kansai)"
  national_narratives:
    - "continuité impériale et récit de la fondation Yamato"
    - "ouverture forcée puis modernisation réussie de Meiji"
    - "miracle économique et pacifisme d'après-guerre"
    - "déclin et « décennies perdues » depuis les années 1990"
    - "exception culturelle japonaise (Nihonjinron)"
  counter_narratives:
    - "colonisation de Hokkaidō et de Ryūkyū, dépossession ainu et okinawaïenne"
    - "sujets coloniaux coréens et taïwanais, travail forcé et migrations"
    - "discrimination des burakumin et des résidents coréens"
    - "violences de guerre, femmes de réconfort, Nanjing, mémoire de l'empire"
    - "pollution industrielle et victimes de Minamata, Ashio, Fukushima"
    - "luttes ouvrières, paysannes et féministes"
  structuring_debates:
    - "date de l'introduction du bouddhisme: 538 ou 552"
    - "date de fondation du bakufu de Kamakura: 1185 ou 1192"
    - "Meiji: révolution, restauration ou réforme oligarchique"
    - "responsabilité japonaise dans la guerre d'Asie-Pacifique"
    - "bilans de Nanjing et du massacre du Kantō"
    - "caractère coercitif du système des femmes de réconfort"
    - "causes et responsabilités de l'accident de Fukushima"
    - "statut des Ainu et des Ryūkyūens dans la nation"
  blind_spots:
    - "femmes ordinaires, paysannes, ouvrières et prostituées"
    - "paysans, artisans et classes populaires urbaines"
    - "Ainu, Ryūkyūens/Okinawaïens, Coréens, burakumin"
    - "migrations, diasporas et rapatriés"
    - "handicap, maladie de Hansen et santé publique"
    - "environnement, catastrophes et résilience"
    - "travail, syndicats et mouvements sociaux"
    - "mémoires contestées de l'empire et de la guerre"
  key_syntheses: ["SRC-001", "SRC-002", "SRC-003", "SRC-004", "SRC-005", "SRC-006", "SRC-007", "SRC-008", "SRC-009", "SRC-010", "SRC-011", "SRC-012", "SRC-013", "SRC-014", "SRC-015", "SRC-016", "SRC-017"]

periodizations:
  - id: "POL-1"
    label: "Périodisation politique par régimes et souveraineté"
    type: "political"
    start_edtf: "538"
    end_edtf: "2026"
    rationale: "Asuka/Nara (538–794), Heian (794–1185), Kamakura (1185–1333), Muromachi (1336–1573), Azuchi-Momoyama (1573–1603), Edo (1603–1868), Empire (1868–1945), occupation et après-guerre (1945–2026). Récit principal actuel, mais il commence trop tard et fusionne 809 ans de Moyen Âge."
    sources: ["SRC-001", "SRC-002", "SRC-003", "SRC-004", "SRC-005", "SRC-006", "SRC-007"]
    selected: true
  - id: "SOC-1"
    label: "Périodisation sociale et économique"
    type: "social_economic"
    start_edtf: "-14000"
    end_edtf: "2026"
    rationale: "Chasseurs-cueilleurs Jōmon; riziculture et hiérarchies Yayoi; aristocratie agraire et fiscalité ritsuryō; féodalité guerrière et manoirs; commercialisation préindustrielle et villes Edo; capitalisme industriel et empire; haute croissance et société salariale; société post-industrielle vieillissante. Cette lecture déplace les bornes vers l'économie et le travail."
    sources: ["SRC-001", "SRC-004", "SRC-005", "SRC-006", "SRC-007", "SRC-008", "SRC-019"]
    selected: false
  - id: "CULT-1"
    label: "Périodisation culturelle, religieuse et environnementale"
    type: "cultural_religious_environmental"
    start_edtf: "-14000"
    end_edtf: "2026"
    rationale: "Animismes et cultures Jōmon; bouddhisme d'État et capitales; culture de cour Heian; sectes médiévales; néo-confucianisme et culture urbaine Edo; culte impérial Meiji; sécularisation et société de consommation; crise environnementale de l'ère industrielle à Fukushima. Cette lecture fait apparaître des continuités qui traversent les régimes."
    sources: ["SRC-001", "SRC-002", "SRC-003", "SRC-004", "SRC-008", "SRC-018"]
    selected: false

periods:
  - id: "PERIOD-1"
    label: "Préhistoire & Protohistoire"
    start_edtf: "-14000"
    end_edtf: "538"
    boundary_type: "cultural"
    boundary_rationale: "La borne de 538 marque l'arrivée traditionnelle du bouddhisme, pas le début du peuplement ni de l'histoire humaine. Jōmon, Yayoi et Kofun précèdent la période historique; la date de début est débattue (poterie ancienne vers 14 000 av. J.-C., chronologies régionales)."
    alternatives_considered: ["10 500 av. J.-C.", "300 av. J.-C. pour le début de Yayoi", "250 apr. J.-C. pour le début de Kofun"]
    sources: ["SRC-001"]
  - id: "PERIOD-2"
    label: "Antiquité, Asuka & Nara"
    start_edtf: "538"
    end_edtf: "794"
    boundary_type: "religious"
    boundary_rationale: "Introduction du bouddhisme (538/552), formation de l'État ritsuryō, capitales de Fujiwara, Nara et Nagaoka. La date de 538 est conventionnelle; le Nihon Shoki donne 552."
    alternatives_considered: ["552 (Nihon Shoki)", "710–784 pour la seule période Nara", "794 pour l'installation à Heian-kyō"]
    sources: ["SRC-001"]
  - id: "PERIOD-3"
    label: "Heian"
    start_edtf: "794"
    end_edtf: "1185"
    boundary_type: "political"
    boundary_rationale: "Capitale à Heian-kyō, régence Fujiwara, culture de cour; la période s'achève avec la mise en place du bakufu de Kamakura, datée 1185 ou 1192."
    alternatives_considered: ["1185 (bakufu)", "1192 (titre de shogun)", "1333 (chute de Kamakura)"]
    sources: ["SRC-002", "SRC-003"]
  - id: "PERIOD-4"
    label: "Japon médiéval"
    start_edtf: "1185"
    end_edtf: "1603"
    boundary_type: "political"
    boundary_rationale: "Kamakura, Muromachi, guerre d'Ōnin, Sengoku et Azuchi-Momoyama; la période s'achève avec Sekigahara (1600) et le shogunat Tokugawa (1603)."
    alternatives_considered: ["1333 (restauration de Kenmu)", "1467 (début d'Ōnin)", "1573 (chute de Muromachi)"]
    sources: ["SRC-003", "SRC-004"]
  - id: "PERIOD-5"
    label: "Époque Edo"
    start_edtf: "1603"
    end_edtf: "1868"
    boundary_type: "political"
    boundary_rationale: "Shogunat Tokugawa, contrôle des échanges, société urbaine et paix relative; la période s'achève avec la restauration de Meiji."
    alternatives_considered: ["1600 (Sekigahara)", "1853 (Perry)", "1867 (abdication de Yoshinobu)"]
    sources: ["SRC-004", "SRC-005"]
  - id: "PERIOD-6"
    label: "Empire et guerres mondiales"
    start_edtf: "1868"
    end_edtf: "1945"
    boundary_type: "political"
    boundary_rationale: "Meiji, Taishō et Shōwa; industrialisation, empire colonial, guerres et capitulation. La borne de 1945 est militaire et politique."
    alternatives_considered: ["1912 (fin de Meiji)", "1931 (Mandchourie)", "1945 (capitulation)"]
    sources: ["SRC-005", "SRC-006", "SRC-007"]
  - id: "PERIOD-7"
    label: "Japon contemporain"
    start_edtf: "1945"
    end_edtf: "2026"
    boundary_type: "military"
    boundary_rationale: "Occupation, Constitution, haute croissance, crises et vieillissement; période ouverte, avec des sous-périodes possibles (1945–1952, 1952–1973, 1973–1991, 1991–2011, 2011–2026)."
    alternatives_considered: ["1952 (fin de l'occupation)", "1973 (choc pétrolier)", "1991 (éclatement de la bulle)", "2011 (Fukushima)"]
    sources: ["SRC-007", "SRC-018", "SRC-019"]

