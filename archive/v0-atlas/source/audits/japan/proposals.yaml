    tags: ["economie", "societe"]
    importance: 2
    summary: "Après l'envolée des prix de l'immobilier et des actions dans les années 1980, la Banque du Japon relève les taux d'intérêt et la bulle spéculative éclate au début des années 1990. Les banques héritent de créances douteuses, les entreprises réduisent leurs investissements et l'emploi précaire se développe. La croissance ralentit durablement, tandis que le chômage et la dette publique augmentent."
    sources: ["SRC-006"]
    confidence: "medium"
    rationale: "La frise passe de 1964 à 2011 sans expliquer la crise des années 1990; cette fiche est la charnière économique. Source unique de synthèse: exception documentée, à corroborer par des données de la Banque du Japon."
  - id: "PROP-018"
