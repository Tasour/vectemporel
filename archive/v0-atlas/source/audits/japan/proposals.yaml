periodization:
  current_verdict: "La charpente politique en cinq ères est lisible, mais elle commence en 538 et efface la préhistoire, puis fusionne 809 ans d'histoire médiévale sous « Heian & shoguns ». Elle ne peut pas rester en l'état sans une période de préhistoire et une scission à 1185."
  proposed_changes:
    - action: "add"
      era_name: "Préhistoire & Protohistoire"
      proposal: "Ajouter une ère de -14000 à 538, couvrant Jōmon, Yayoi et Kofun."
      rationale: "538 est une borne religieuse (bouddhisme), pas le début du peuplement ni de l'écriture. Les frises Égypte, Chine et Inde commencent des millénaires avant notre ère; le Japon commence en 538."
      sources: ["SRC-001"]
    - action: "rename"
      era_name: "Antiquité & Nara"
      proposal: "Renommer « Antiquité, Asuka & Nara » et conserver 538–794."
      rationale: "La période inclut Asuka et Nagaoka-kyō; « Nara » seul réduit la période à sa capitale la plus connue."
      sources: ["SRC-001"]
    - action: "split"
      era_name: "Heian & shoguns"
      proposal: "Scinder en « Heian » (794–1185) et « Japon médiéval » (1185–1603)."
      rationale: "809 ans en une ère masquent Kamakura, Muromachi, Ōnin, Sengoku et Azuchi-Momoyama; la rupture de 1185 est politique et militaire."
      sources: ["SRC-002", "SRC-003", "SRC-004"]
    - action: "move_boundary"
      era_name: "Antiquité & Nara"
      proposal: "Distinguer Nara (710–784) et Nagaoka-kyō (784–794) à l'intérieur de l'ère, avant Heian (794)."
      rationale: "La période Nara s'achève en 784; 794 est l'installation à Heian-kyō. La frise actuelle confond les deux bornes."
      sources: ["SRC-001"]
    - action: "keep"
      era_name: "Époque Edo"
      proposal: "Conserver 1603–1868, en précisant que 1600 (Sekigahara) et 1868 (Meiji) sont des alternatives."
      rationale: "La borne de 1603 correspond au shogunat Tokugawa; elle est conventionnelle mais cohérente."
      sources: ["SRC-004", "SRC-005"]
    - action: "rename"
      era_name: "Empire du Japon"
      proposal: "Renommer « Empire et guerres mondiales » et conserver 1868–1945."
      rationale: "Le régime impérial ne se réduit pas à la guerre, mais la période est structurée par l'expansion coloniale et les guerres de 1894–1945."
      sources: ["SRC-005", "SRC-006", "SRC-007"]
    - action: "keep"
      era_name: "Japon contemporain"
      proposal: "Conserver 1945–2026, avec des sous-périodes éditoriales: occupation (1945–1952), haute croissance (1952–1973), après-chocs (1973–1991), décennies perdues (1991–2011), après-Fukushima (2011–2026)."
      rationale: "La période est trop longue pour un seul bloc; les sous-périodes permettent de distinguer occupation, croissance, crise et vieillissement sans multiplier les ères."
      sources: ["SRC-006", "SRC-007", "SRC-018", "SRC-019"]

