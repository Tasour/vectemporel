    summary: "La population japonaise cesse de croître autour de 2008 et diminue ensuite; au 1er octobre 2024, elle compte 123,80 millions d'habitants, dont 29,3 % ont 65 ans ou plus. Le vieillissement, la faible natalité et la concentration urbaine pèsent sur les retraites, les soins et l'emploi, tandis que les politiques familiales et migratoires restent limitées. Le Japon est souvent présenté comme un laboratoire des sociétés vieillissantes."
