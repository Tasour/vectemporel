    title: "Yayoi"
    subtitle: "Riziculture, métallurgie et migrations continentales"
    tags: ["economie", "societe"]
    importance: 2
    summary: "La riziculture irriguée, le bronze et le fer se diffusent depuis le nord de Kyūshū à partir du premier millénaire av. J.-C.; des migrants et des échanges avec la péninsule coréenne participent à ces transformations. Les sociétés Yayoi développent des hiérarchies plus marquées, visibles sur des sites comme Yoshinogari et dans les sources chinoises."
    sources: ["SRC-001"]
    confidence: "medium"
    rationale: "Les datations radiocarbone controversées repoussent le début de Yayoi; la frise doit couvrir l'économie agricole, les migrations et la genèse de l'État, pas seulement Nara."
