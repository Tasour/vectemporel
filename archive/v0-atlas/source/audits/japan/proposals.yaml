    tags: ["arts", "societe"]
    importance: 2
    summary: "Autour de 1000, la cour de Heian-kyō (Kyoto) produit une littérature en kana largement écrite par des femmes. Murasaki Shikibu, dame de la suite de l'impératrice Shōshi, compose le Dit du Genji; Sei Shōnagon rédige les Notes de chevet. Ces œuvres témoignent de l'autonomie culturelle de la cour et des contraintes de genre qui structurent la vie des femmes aristocrates."
    sources: ["SRC-002", "SRC-012"]
    confidence: "high"
    rationale: "La frise mentionne le Genji sans nommer d'autrice ni analyser le genre; cette fiche donne des actrices, un lieu et une source."
