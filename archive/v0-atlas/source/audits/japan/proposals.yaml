    title: "Jōmon"
    subtitle: "Poterie, sédentarisation et sociétés de chasseurs-cueilleurs"
    tags: ["societe", "arts"]
    importance: 2
    summary: "Des sociétés de chasseurs-cueilleurs-pêcheurs occupent l'archipel et produisent certaines des plus anciennes poteries connues, dès environ 14 000 av. J.-C. La période Jōmon, caractérisée par des villages semi-sédentaires et des productions artistiques (dogū, jarres), s'étend jusqu'aux environs de 300 av. J.-C. selon les chronologies, avec de fortes variations régionales; le site de Sannai-Maruyama (Aomori) en est un exemple."
    sources: ["SRC-001"]
    confidence: "medium"
    rationale: "La frise commence en 538 et efface plusieurs millénaires; cette proposition ouvre la préhistoire. Les dates de début et de fin sont débattues et doivent être affichées avec incertitude."
