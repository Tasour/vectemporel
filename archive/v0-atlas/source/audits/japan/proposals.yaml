    sources: ["SRC-011"]
    confidence: "high"
    rationale: "Les burakumin sont totalement absents de la frise; cette fiche couvre le droit, la discrimination et l'action collective, avec un lieu hors Tokyo. Source principale unique (SRC-011), à corroborer par des travaux japonais."
