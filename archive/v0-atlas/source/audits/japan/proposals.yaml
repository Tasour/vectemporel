    title: "Invasions de la Corée"
    subtitle: "Hideyoshi, la Corée et la mémoire de l'Imjin"
    tags: ["guerre", "politique"]
    importance: 2
    summary: "Toyotomi Hideyoshi lance en 1592 puis en 1597 des invasions de la Corée, avec pour objectif de passer en Chine. Les armées japonaises occupent Séoul et une partie du pays; les résistances coréennes, l'aide des Ming et la marine de Yi Sun-sin contribuent au retrait japonais après la mort de Hideyoshi en 1598. Les destructions et les déportations marquent durablement les mémoires coréennes."
    sources: ["SRC-004", "SRC-010"]
    confidence: "high"
