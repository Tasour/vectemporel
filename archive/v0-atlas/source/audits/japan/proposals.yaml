    tags: ["politique", "societe"]
    importance: 3
    summary: "Le royaume de Ryūkyū, tributaire de la Chine et vassal de Satsuma depuis 1609, est intégré au Japon en 1879 malgré les protestations de Pékin et du roi Shō Tai. L'annexion devient la préfecture d'Okinawa; elle s'accompagne de politiques d'assimilation linguistique et culturelle. La souveraineté reste disputée avec la Chine jusqu'à la guerre sino-japonaise."
    sources: ["SRC-010", "SRC-017"]
    confidence: "high"
