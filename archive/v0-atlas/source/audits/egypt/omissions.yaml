    what_is_missing: "Aucune fiche ne distingue les Tulunides (868–905), les Ikhshidides (935–969), les Fatimides (969–1171), les Ayyubides (1171–1250), les Mamelouks (1250–1517) et les Ottomans (1517–1798)."
