corrections:
- existing_id: fr-code-civil
  issue: L'égalité civile du Code civil est présentée comme générale, sans ses limites genrées et coloniales.
  proposal: Préciser que le Code civil consacre l'égalité civile des hommes majeurs et propriétaires, tout en maintenant la
    subordination des femmes et en laissant l'esclavage colonial hors de son champ.
  sources:
  - SRC-003
  - SRC-002
  confidence: high
- existing_id: fr-revolution
  issue: Le résumé présente les droits de l'homme comme un acquis universel sans mentionner les exclusions des femmes et des
    esclaves.
  proposal: Ajouter que la Déclaration de 1789 exclut les femmes de la citoyenneté et que l'abolition de 1794 est suivie du
    rétablissement de l'esclavage en 1802.
  sources:
  - SRC-003
  - SRC-002
  confidence: high
- existing_id: fr-ww2
  issue: La fiche fond Occupation, Vichy, Résistance et Shoah en un seul bloc, et fait de la Résistance le sujet principal
    de la Libération.
  proposal: Distinguer 1940 (défaite et Vichy), 1942 (rafle du Vél' d'Hiv), 1944 (Libération) et préciser le rôle des Alliés
    et des troupes coloniales.
  sources:
  - SRC-008
  - SRC-009
  confidence: high
- existing_id: fr-trente
  issue: L'événement « Trente Glorieuses » est daté 1945-1975, tandis que l'ère du même nom va de 1945 à 1989.
  proposal: Conserver 1945-1975 pour l'expansion, mais renommer l'ère ou ajouter une seconde séquence 1975-1989 (crises, chômage,
    désindustrialisation).
  sources:
  - SRC-019
  confidence: high
- existing_id: fr-veil
  issue: Le résumé dit que la loi « dépénalise » l'IVG, sans mentionner son caractère conditionnel et temporaire.
  proposal: Écrire que la loi autorise l'IVG sous conditions pour cinq ans, avant reconduction et régime définitif.
  sources:
  - SRC-014
  confidence: high
- existing_id: fr-algerie
  issue: La fiche ne mentionne ni le FLN, ni les civils algériens, ni la torture, ni les harkis, ni les effets migratoires
    en métropole.
  proposal: Ajouter ces acteurs et distinguer la guerre d'indépendance algérienne de ses effets métropolitains (17 octobre
    1961, rapatriements, mémoire).
  sources:
  - SRC-011
  - SRC-012
  confidence: high
- existing_id: fr-laicite
  issue: La laïcité est présentée comme un principe structurant consensuel, sans les conflits qui l'ont accompagnée.
  proposal: Rappeler que la loi de 1905 est contestée, que son application est progressive et que les débats sur le voile
    (1989, 2004) la réactualisent.
  sources:
  - SRC-017
  confidence: high
- existing_id: fr-maastricht
  issue: Le traité est présenté comme une étape nécessaire de l'intégration, sans le caractère conflictuel du référendum de
    1992.
  proposal: Mentionner le référendum du 20 septembre 1992 et les clivages qu'il révèle, sans présenter l'approbation comme
    une évidence.
  sources:
  - SRC-010
  confidence: high
- existing_id: fr-euro
  issue: L'euro est présenté comme un approfondissement naturel de l'intégration, sans les débats sur la souveraineté et les
    politiques économiques.
  proposal: Ajouter que le passage à l'euro s'inscrit dans un choix de politique économique et monétaire discuté, et non dans
    une simple continuité technique.
  sources:
  - SRC-010
  confidence: medium
- existing_id: fr-charlie
  issue: Le résumé réduit les attentats de janvier 2015 à la liberté d'expression et omet les victimes de l'Hyper Cacher et
    du policier tué.
  proposal: Mentionner les attentats de Charlie Hebdo, de Montrouge et de l'Hyper Cacher, ainsi que les débats sur l'antisémitisme
    et la laïcité.
  sources:
  - SRC-017
  confidence: medium
review:
  status: draft
  unresolved:
  - 'Date exacte du baptême de Clovis : 496, 498 ou 499 selon les sources ; la frise doit utiliser un TimeSpan incertain,
    pas une année nue.'
  - 'Bilan exact de la manifestation du 17 octobre 1961 : les estimations varient de plusieurs dizaines à plus de 200 morts
    ; le chiffre doit rester disputed.'
  - 'Nombre exact de victimes de la rafle du Vél'' d''Hiv : environ 13 000 arrestations, mais les catégories et les transferts
    doivent être vérifiés.'
  - 'Date et portée du décret de création du parc national de la Vanoise : 6 juillet 1963 à confirmer sur le texte officiel,
    la source Bess étant une synthèse.'
  - Rôle exact des acteurs locaux et des associations dans la marche de 1983 ; les récits divergent sur l'initiative et la
    récupération politique.
  - 'Causalité des révoltes de 2005 : éviter une explication monocausale ; confronter Fassin, Hargreaves et les rapports parlementaires.'
  - 'Portée juridique exacte de la loi Neuwirth : autorisation, prescription, publicité et remboursement sont des questions
    distinctes.'
  - 'Limites coloniales du droit de vote des femmes en 1944 : l''ordonnance ne s''applique pas de manière uniforme aux femmes
    des colonies et d''Algérie.'
  - 'Place de la Shoah et de Vichy dans la frise : une seule fiche « Seconde Guerre mondiale » ne permet pas de distinguer
    les événements et les mémoires.'
  - 'Absence de sources du registre sur l''histoire LGBTQ+, le handicap, les diasporas autres qu''algériennes et les outre-mer
    : dettes à combler avant publication.'
  - Vérifier la formulation constitutionnelle de 2024 et le caractère « droit » ou « liberté » de la garantie, qui fait débat
    parmi les juristes.
  - 'Arbitrer la périodisation 1945-1989 : conserver l''ère unique, la scinder en 1945-1975 / 1975-1989, ou adopter une périodisation
    sociale plus longue.'
