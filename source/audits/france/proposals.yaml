author: ''
periodization:
  current_verdict: 'La structure en neuf ères est lisible et continue, mais elle reste une périodisation politique et européenne.
    Trois césures sont particulièrement fragiles pour la France : 1492 (événement ibérique et atlantique), 1610-1789 (fusion
    de l''absolutisme et des Lumières) et 1945-1989 (étiquette « Trente Glorieuses » appliquée à une période qui inclut les
    crises de 1975-1989). La borne 1989 ne correspond à aucun repère français de la frise actuelle.'
  proposed_changes:
  - action: keep
    era_name: Structure en neuf ères
    proposal: Conserver la structure comme récit principal de la vue d'ensemble, en affichant les alternatives et les césures
      discutées.
    rationale: Elle est continue, lisible et compatible avec les données actuelles ; la remplacer entièrement coûterait plus
      qu'elle n'apporterait à court terme.
    sources:
    - SRC-001
    - SRC-019
  - action: split
    era_name: Trente Glorieuses
    proposal: Scinder 1945-1989 en « Reconstruction et Trente Glorieuses (1945-1975) » puis « Crises et mutations (1975-1989)
      ».
    rationale: Fourastié borne les Trente Glorieuses à 1946-1975 ; la crise de 1973-1975, le chômage de masse et la désindustrialisation
      ouvrent une autre séquence.
    sources:
    - SRC-019
  - action: rename
    era_name: Temps présents
    proposal: 'Renommer « Temps présents » en « 1989-2026 : mondialisation, crises et mémoire » et expliciter que 1989 est
      une césure européenne.'
    rationale: La frise ne contient aucun repère français daté de 1989 ; l'affaire de Creil (octobre 1989) est le seul événement
      français qui pourrait justifier la borne.
    sources:
    - SRC-017
  - action: move_boundary
    era_name: Temps présents
    proposal: Étudier un déplacement de la borne de 1989 à 1981 (alternance) ou 1992 (Maastricht), avec 1989 conservée comme
      césure secondaire.
    rationale: 1981 et 1992 structurent davantage l'histoire politique et européenne française que la chute du mur de Berlin.
    sources:
    - SRC-010
    - SRC-017
  - action: rename
    era_name: Renaissance
    proposal: Renommer « Renaissance » en « Guerres d'Italie et Réforme (1494-1610) » et déplacer la borne de 1492 à 1494.
    rationale: 1492 ne structure pas l'histoire française ; 1494 ouvre les guerres d'Italie, 1515 Marignan, 1539 Villers-Cotterêts
      et 1562 les guerres de Religion.
    sources: []
  - action: split
    era_name: Grand Siècle & Lumières
    proposal: Scinder en « Absolutisme (1610-1715) » et « Lumières et crise de l'Ancien Régime (1715-1789) ».
    rationale: 'Le label fusionne deux moments distincts : l''affirmation de l''État louis-quatorzien et la critique philosophique
      du XVIIIe siècle.'
    sources:
    - SRC-002
  - action: rename
    era_name: Guerres mondiales
    proposal: Renommer « Guerres, crises et occupations (1914-1945) » ou scinder en 1914-1918, 1919-1939, 1939-1945.
    rationale: Le label actuel réduit l'entre-deux-guerres à une préparation de 1939 et masque les crises sociales, coloniales
      et mémorielles.
    sources:
    - SRC-007
    - SRC-008
    - SRC-009
  - action: move_boundary
    era_name: Antiquité
    proposal: Conserver 476 comme convention européenne, mais afficher 486 (Soissons) comme borne française alternative.
    rationale: 476 ne correspond pas à une rupture gauloise ; 486 marque la victoire de Clovis sur Syagrius et la fin de l'autorité
      romaine en Gaule du Nord.
    sources:
    - SRC-001
  - action: add
    era_name: Toutes les ères
    proposal: Ajouter une couche « empire » et une couche « diasporas » indépendantes des ères, visibles dans la vue pays.
    rationale: Les colonies, les protectorats et les diasporas traversent les césures politiques ; les enfermer dans une seule
      ère ou dans l'Algérie fausse l'échelle.
    sources:
    - SRC-002
    - SRC-004
    - SRC-012
events:
- id: PROP-001
  action: add
  existing_id: null
  year: 1685
  end_year: null
  title: Code noir
  subtitle: L'esclavage codifié dans les colonies
  tags:
  - politique
  - religion
  - societe
  importance: 3
  summary: 'L''édit de mars 1685, dit Code noir, fixe le statut des esclaves dans les colonies françaises : police des plantations,
    châtiments, obligations religieuses et restrictions de déplacement. Promulgué par Louis XIV dans la continuité de la politique
    coloniale de Colbert, il s''applique notamment aux Antilles, où il structure l''économie sucrière.'
  sources:
  - SRC-002
  confidence: high
  rationale: La frise mentionne la révocation de l'édit de Nantes (1685) sans le Code noir, alors que les deux textes participent
    de la même année de consolidation autoritaire et de l'ordre colonial. Cette proposition ouvre le domaine Droit & justice
    et l'échelle impériale.
- id: PROP-002
  action: add
  existing_id: null
  year: 1791
  end_year: null
  title: Olympe de Gouges
  subtitle: La Déclaration des droits de la femme
  tags:
  - societe
  - politique
  - arts
  importance: 2
  summary: En septembre 1791, Olympe de Gouges publie la Déclaration des droits de la femme et de la citoyenne, qui reprend
    et retourne la Déclaration de 1789. Elle y réclame l'égalité civile et politique des femmes, critique le mariage et l'esclavage
    ; elle est guillotinée en 1793.
  sources:
  - SRC-003
  confidence: high
  rationale: La Révolution est racontée par les institutions et les guerres, sans les femmes qui en discutent les principes.
    Cette proposition documente un acteur, un texte et un lieu (Paris), et prépare la loi de 1944 et les débats de 2024.
- id: PROP-003
  action: add
  existing_id: null
  year: 1830
  end_year: null
  title: Prise d'Alger
  subtitle: Le début de la conquête coloniale
  tags:
  - guerre
  - politique
  importance: 3
  summary: Le 5 juillet 1830, après le débarquement de juin, les troupes françaises commandées par le général de Bourmont
    prennent Alger ; le dey Hussein capitule. Charles X, renversé quelques semaines plus tard, engage une conquête que la
    monarchie de Juillet poursuit et qui devient une colonie de peuplement.
  sources:
  - SRC-004
  confidence: high
  rationale: La frise passe de 1815 à 1830 sans la conquête de l'Algérie, alors qu'elle structure le XIXe siècle, l'armée,
    la citoyenneté et les mémoires. Elle permet d'articuler guerre, empire et politique intérieure.
- id: PROP-004
  action: add
  existing_id: null
  year: 1874
  end_year: null
  title: Première exposition impressionniste
  subtitle: Une avant-garde au temps des Salons
  tags:
  - arts
  - societe
  importance: 2
  summary: Du 15 avril au 15 mai 1874, la Société anonyme des artistes peintres, sculpteurs et graveurs expose 165 œuvres
    dans l'ancien atelier de Nadar, 35 boulevard des Capucines à Paris. Monet, Morisot, Renoir, Pissarro, Degas et Cézanne
    y participent ; le critique Louis Leroy forge le mot « impressionniste » en se moquant d'Impression, soleil levant.
  sources:
  - SRC-005
  confidence: high
  rationale: La frise n'a aucun repère artistique entre Saint-Denis (1144) et l'Académie française (1635), puis aucun sur
    l'art du XIXe siècle. Cette exposition documente une actrice femme (Morisot), un lieu et un réseau transnational.
- id: PROP-005
  action: add
  existing_id: null
  year: 1898
  end_year: null
  title: Marie et Pierre Curie
  subtitle: Polonium et radium
  tags:
  - sciences
  - societe
  importance: 3
  summary: En 1898, Marie Curie et Pierre Curie découvrent le polonium puis le radium en traitant des minerais d'uranium dans
    leur laboratoire parisien. Ces travaux prolongent ceux d'Henri Becquerel sur les rayonnements ; ils valent à Marie Curie
    le prix Nobel de physique en 1903, puis celui de chimie en 1911.
  sources:
  - SRC-006
  confidence: high
  rationale: La frise n'a aucun repère scientifique après l'Académie des sciences (1666), et aucune femme scientifique. Cette
    proposition documente un laboratoire, un couple de chercheurs et une reconnaissance internationale.
- id: PROP-006
  action: add
  existing_id: null
  year: 1931
  end_year: null
  title: Exposition coloniale internationale
  subtitle: L'empire mis en scène à Vincennes
  tags:
  - arts
  - politique
  - societe
  importance: 2
  summary: Du 6 mai au 15 novembre 1931, l'Exposition coloniale internationale du Bois de Vincennes présente les territoires
    et populations de l'empire français à des millions de visiteurs. Le maréchal Lyautey en est le commissaire général ; l'exposition
    légitime la « mission civilisatrice » et suscite une contre-exposition anticoloniale.
  sources:
  - SRC-007
  confidence: high
  rationale: L'empire n'apparaît dans la frise qu'à travers la guerre d'Algérie. Cette exposition montre comment l'empire
    est représenté, administré et contesté dans l'entre-deux-guerres.
- id: PROP-007
  action: add
  existing_id: null
  year: 1942
  end_year: null
  title: Rafle du Vél' d'Hiv
  subtitle: La police française et la déportation des Juifs
  tags:
  - guerre
  - religion
  - societe
  importance: 3
  summary: Les 16 et 17 juillet 1942, la police parisienne arrête environ 13 000 Juifs, dont des milliers d'enfants, et les
    rassemble au Vélodrome d'Hiver avant leur transfert vers les camps. La rafle est organisée par la préfecture de police
    de Paris, sous l'autorité de René Bousquet, en lien avec l'occupant allemand ; elle devient un lieu central de la mémoire
    de Vichy.
  sources:
  - SRC-008
  - SRC-009
  confidence: high
  rationale: La fiche « Seconde Guerre mondiale » fond en un seul bloc Occupation, Vichy, Résistance et Shoah. Cette proposition
    distingue un événement daté, des acteurs français et un lieu de mémoire, sans réduire la période à la Résistance.
- id: PROP-008
  action: add
  existing_id: null
  year: 1950
  end_year: null
  title: Déclaration Schuman
  subtitle: La CECA et l'Europe communautaire
  tags:
  - politique
  - economie
  importance: 3
  summary: Le 9 mai 1950, au Quai d'Orsay, le ministre français des Affaires étrangères Robert Schuman propose de placer la
    production franco-allemande de charbon et d'acier sous une autorité commune. Le plan, préparé avec Jean Monnet, ouvre
    la voie à la CECA (1951) et à la construction européenne ; il est présenté comme un moyen de rendre la guerre matériellement
    impossible.
  sources:
  - SRC-010
  confidence: high
  rationale: La frise passe de 1945 à Maastricht (1992) sans la déclaration Schuman, alors que l'Europe est un cadre structurant
    de l'après-guerre. Cette proposition documente un acteur, un lieu et une échelle transnationale.
- id: PROP-009
  action: add
  existing_id: null
  year: 1961
  end_year: null
  title: 17 octobre 1961
  subtitle: La répression de la manifestation du FLN
  tags:
  - guerre
  - societe
  - politique
  importance: 3
  summary: Le 17 octobre 1961, des dizaines de milliers d'Algériens manifestent à Paris contre le couvre-feu imposé par la
    préfecture de police. La répression, conduite sous l'autorité de Maurice Papon, fait plusieurs dizaines de morts ; le
    bilan exact reste disputé. L'événement est longtemps occulté avant de devenir un enjeu majeur de mémoire.
  sources:
  - SRC-011
  - SRC-015
  confidence: high
  rationale: La guerre d'Algérie est racontée à l'échelle algérienne, pas dans ses effets métropolitains. Cette proposition
    documente les immigrés algériens comme acteurs, Paris comme lieu de répression et la mémoire coloniale comme enjeu.
- id: PROP-010
  action: add
  existing_id: null
  year: 1962
  end_year: null
  title: Indépendance de l'Algérie
  subtitle: La fin de la guerre et la recomposition de la France
  tags:
  - guerre
  - politique
  importance: 3
  summary: Les accords d'Évian du 18 mars 1962 mettent fin aux combats et ouvrent la voie à l'indépendance de l'Algérie, proclamée
    le 3 juillet 1962. La guerre a divisé la France, provoqué l'exode des pieds-noirs et de nombreux harkis, et transformé
    la nationalité et la citoyenneté françaises.
  sources:
  - SRC-012
  - SRC-015
  confidence: high
  rationale: La fiche « Guerre d'Algérie » s'arrête en 1962 sans dire ce que l'indépendance fait à la France. Cette proposition
    relie décolonisation, migrations, nationalité et mémoire.
- id: PROP-011
  action: add
  existing_id: null
  year: 1963
  end_year: null
  title: Parc national de la Vanoise
  subtitle: Le premier parc national français
  tags:
  - societe
  - sciences
  importance: 2
  summary: Le 6 juillet 1963, un décret crée le parc national de la Vanoise, premier parc national français, dans les Alpes
    savoyardes. Sa création résulte d'un compromis entre protection de la nature, développement touristique et pastoralisme,
    dans un contexte de forte croissance des sports d'hiver.
  sources:
  - SRC-013
  confidence: medium
  rationale: La frise n'a aucun repère environnemental. Cette proposition documente une politique publique, un territoire
    hors Paris et un conflit d'usages, sans réduire l'écologie à une histoire militante.
- id: PROP-012
  action: add
  existing_id: null
  year: 1967
  end_year: null
  title: Loi Neuwirth
  subtitle: La contraception autorisée
  tags:
  - societe
  - politique
  - sciences
  importance: 3
  summary: La loi du 28 décembre 1967, portée par le député Lucien Neuwirth, autorise la contraception et met fin à l'interdiction
    héritée de 1920. Elle ne garantit ni l'accès réel ni le remboursement, et son application se heurte à l'opposition catholique
    et aux résistances administratives.
  sources:
  - SRC-014
  confidence: high
  rationale: La frise saute de 1944 (vote des femmes) à 1975 (loi Veil) sans la contraception, qui transforme la vie des femmes
    et les rapports de genre. Cette proposition documente une loi, un acteur et un débat de société.
- id: PROP-013
  action: add
  existing_id: null
  year: 1983
  end_year: null
  title: Marche pour l'égalité et contre le racisme
  subtitle: De Marseille à Paris
  tags:
  - societe
  - politique
  importance: 2
  summary: Du 15 octobre au 3 décembre 1983, des jeunes issus de l'immigration et des militants antiracistes marchent de Marseille
    à Paris pour dénoncer les crimes racistes, les violences policières et les inégalités. Née dans le sillage des mobilisations
    des Minguettes, à Vénissieux, la marche rassemble des dizaines de milliers de personnes à son arrivée et rend visibles
    les enfants de l'immigration postcoloniale.
  sources:
  - SRC-015
  - SRC-016
  confidence: high
  rationale: La frise ne traite l'immigration que par la guerre d'Algérie. Cette proposition documente un acteur collectif,
    un parcours hors Paris et une mobilisation qui précède les débats des années 2000.
- id: PROP-014
  action: add
  existing_id: null
  year: 1995
  end_year: null
  title: Discours de Jacques Chirac
  subtitle: La reconnaissance de la responsabilité de l'État français
  tags:
  - politique
  - societe
  - religion
  importance: 2
  summary: Le 16 juillet 1995, lors de la commémoration de la rafle du Vél' d'Hiv, le président Jacques Chirac reconnaît que
    l'État français a participé à la déportation des Juifs pendant l'Occupation. Ce discours rompt avec la mémoire gaullienne
    qui assimilait Vichy à une parenthèse étrangère à la nation.
  sources:
  - SRC-009
  - SRC-008
  confidence: high
  rationale: La frise n'a aucun repère mémoriel distinct des événements. Cette proposition documente un acte politique de
    mémoire, ses acteurs et son lieu, et permet de distinguer 1942 de 1995.
- id: PROP-015
  action: add
  existing_id: null
  year: 1989
  end_year: null
  title: Affaire des foulards de Creil
  subtitle: Laïcité, islam et genre à l'école
  tags:
  - religion
  - societe
  - politique
  importance: 2
  summary: 'En octobre 1989, trois collégiennes de Creil sont exclues de leur établissement pour avoir refusé d''ôter leur
    foulard en classe. L''affaire devient nationale : elle oppose partisans d''une laïcité stricte, défenseurs de la liberté
    de conscience et acteurs de l''islam de France, et ouvre un débat durable sur le voile, le genre et l''école.'
  sources:
  - SRC-017
  - SRC-015
  confidence: high
  rationale: La frise fait commencer les Temps présents en 1989 sans aucun événement français cette année-là. Cette proposition
    donne un contenu français à la borne et documente un conflit social et religieux hors Paris.
- id: PROP-016
  action: add
  existing_id: null
  year: 2005
  end_year: null
  title: Révoltes des banlieues
  subtitle: Clichy-sous-Bois et la crise sociale
  tags:
  - societe
  - politique
  importance: 3
  summary: Après la mort de Zyed Benna et Bouna Traoré, électrocutés dans un transformateur à Clichy-sous-Bois le 27 octobre
    2005, des révoltes éclatent dans de nombreuses banlieues françaises. Le gouvernement décrète l'état d'urgence le 8 novembre
    ; les violences, la répression et les débats sur la ségrégation urbaine révèlent une crise sociale et raciale durable.
  sources:
  - SRC-016
  - SRC-015
  confidence: medium
  rationale: La frise n'a aucun repère sur les banlieues, les discriminations et les violences policières après 1968. Cette
    proposition documente un acteur collectif, un lieu hors Paris et une causalité multiple, sans réduire l'événement à une
    « émeute ».
- id: PROP-017
  action: add
  existing_id: null
  year: 2015
  end_year: null
  title: Accord de Paris
  subtitle: La COP21 au Bourget
  tags:
  - politique
  - sciences
  - economie
  importance: 2
  summary: Du 30 novembre au 12 décembre 2015, la France accueille à Paris-Le Bourget la 21e conférence des parties à la convention
    climat. L'accord de Paris, adopté le 12 décembre, fixe l'objectif de limiter le réchauffement bien en dessous de 2 °C
    et invite les États à réviser leurs engagements ; il est salué comme un tournant mais critiqué pour la faiblesse de ses
    obligations.
  sources:
  - SRC-018
  - SRC-013
  confidence: high
  rationale: La frise n'a aucun repère environnemental global après 1989, et la France n'apparaît pas comme acteur de la diplomatie
    climatique. Cette proposition documente un lieu, une négociation et une échelle transnationale.
- id: PROP-018
  action: add
  existing_id: null
  year: 2024
  end_year: null
  title: IVG dans la Constitution
  subtitle: La liberté garantie
  tags:
  - societe
  - politique
  importance: 2
  summary: Le 4 mars 2024, le Parlement réuni en Congrès à Versailles adopte la loi constitutionnelle qui insère dans l'article
    34 la liberté garantie à la femme de recourir à l'interruption volontaire de grossesse. Promulguée le 8 mars 2024, la
    réforme est présentée comme une protection contre les remises en cause ; sa portée juridique est discutée, entre liberté
    garantie et droit subjectif autonome, et la loi fixe les conditions d'exercice.
  sources:
  - SRC-020
  - SRC-014
  confidence: high
  rationale: La frise s'arrête en 2024 avec les JO et le Covid, sans les droits des femmes. Cette proposition documente un
    événement récent, un lieu (Versailles) et une continuité avec 1975, tout en signalant les débats juridiques.
