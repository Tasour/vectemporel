periodizations:
  - id: "POL-1"
    label: "Souveraineté, unions et régimes"
    type: "political"
    start_edtf: "0043"
    end_edtf: "2026"
    rationale: >-
      Périodisation politique centrée sur les régimes et les souverainetés :
      Bretagne romaine, royaumes anglo-saxons, conquête normande (1066), État
      anglais médiéval, Réforme (1534), guerres des Trois Royaumes (1639–1653),
      Glorieuse Révolution (1688), union de 1707, union de 1801, État libre
      d'Irlande (1922), État-providence (1945), tournant thatchérien (1979),
      Brexit (2016–2020). Cette périodisation est la plus proche de la frise
      actuelle, mais elle survalorise Londres et l'Angleterre.
    sources: ["SRC-001", "SRC-002", "SRC-005"]
    selected: true
  - id: "SOC-1"
    label: "Travail, démographie et État social"
    type: "social_economic"
    start_edtf: "0043"
    end_edtf: "2026"
    rationale: >-
      Périodisation sociale et économique : économie agraire et peste noire
      (1348), enclosure et marché du travail, industrialisation (vers 1750–1850),
      New Poor Law (1834), urbanisation victorienne, État-providence (1945),
      choc pétrolier et entrée dans la CEE (1973), crise financière (2008).
      Elle fait apparaître les classes populaires, les femmes au travail, les
      migrations et les régions industrielles, absents de la périodisation
      politique.
    sources: ["SRC-007", "SRC-011", "SRC-012"]
    selected: false
  - id: "CULT-1"
    label: "Religion, culture et environnement"
    type: "cultural_religious_environmental"
    start_edtf: "0043"
    end_edtf: "2026"
    rationale: >-
      Périodisation culturelle, religieuse et environnementale : christianisation
      (597), Réforme et confessionnalisation (1534–1688), Lumières écossaises et
      romantisme, darwinisme (1859), sécularisation des années 1960, smog de 1952
      et Clean Air Act de 1956, mobilisations environnementales et climatiques
      contemporaines. Elle met au premier plan les croyances, les arts, les
      paysages et les usages de l'énergie.
    sources: ["SRC-001", "SRC-003", "SRC-016"]
    selected: false

periods:
  - id: "PERIOD-1"
    label: "Antiquité & invasions"
    start_edtf: "0043"
    end_edtf: "1066"
    boundary_type: "military"
    boundary_rationale: >-
      43 (conquête romaine) et 1066 (conquête normande) sont des bornes
      militaires et politiques. Le libellé « invasions » est chargé : il met au
      même plan la conquête romaine, les installations anglo-saxonnes et les
      raids vikings, et masque la continuité des sociétés bretonnes.
    alternatives_considered:
      - "Scinder en 43–410 (Bretagne romaine) et 410–1066 (Anglo-Saxons et Vikings)."
      - "Commencer à la préhistoire (Néolithique) plutôt qu'à 43."
    sources: ["SRC-001", "SRC-002"]
  - id: "PERIOD-2"
    label: "Moyen Âge"
    start_edtf: "1066"
    end_edtf: "1485"
    boundary_type: "political"
    boundary_rationale: >-
      1066 et 1485 (Bosworth) sont des bornes anglaises. Elles ne structurent pas
      l'histoire de l'Écosse, du pays de Galles ou de l'Irlande, dont les
      chronologies médiévales sont différentes. La période est conservée pour la
      continuité éditoriale, mais doit être explicitement plurinationale.
    alternatives_considered:
      - "1283 (conquête du pays de Galles) ou 1314 (Bannockburn) comme bornes internes."
      - "1534 (Réforme irlandaise) plutôt que 1485 pour l'Irlande."
    sources: ["SRC-002", "SRC-004", "SRC-005", "SRC-006"]
  - id: "PERIOD-3"
    label: "Renaissance & Réforme"
    start_edtf: "1485"
    end_edtf: "1688"
    boundary_type: "religious"
    boundary_rationale: >-
      1485–1688 couvre la Réforme, les guerres des Trois Royaumes et la
      Glorieuse Révolution. Le mot « Renaissance » est peu adapté aux îles
      Britanniques et le label masque la Réforme écossaise, galloise et
      irlandaise ainsi que la colonisation de l'Irlande.
    alternatives_considered:
      - "1534–1660 (Réforme et guerres civiles), puis 1660–1688 (Restauration)."
      - "Conserver 1485 mais renommer la période « Réforme, guerres des Trois Royaumes et Révolution »."
    sources: ["SRC-001", "SRC-002", "SRC-005"]
  - id: "PERIOD-4"
    label: "Empire & industrie"
    start_edtf: "1688"
    end_edtf: "1914"
    boundary_type: "political"
    boundary_rationale: >-
      1688–1914 est trop large (226 ans) et confond trois phénomènes : la
      construction de l'État britannique et de l'union, le premier empire
      atlantique et la traite, puis l'industrialisation et l'empire victorien.
      La césure de 1815 (fin des guerres napoléoniennes) ou de 1832 (Reform Act)
      est plus opérante.
    alternatives_considered:
      - "Scinder en 1688–1815 (Grande-Bretagne et premier empire) et 1815–1914 (industrialisation et empire victorien)."
      - "Scinder en 1688–1832 et 1832–1914."
      - "Commencer en 1707 (union) plutôt qu'en 1688."
    sources: ["SRC-003", "SRC-007", "SRC-009"]
  - id: "PERIOD-5"
    label: "Guerres mondiales"
    start_edtf: "1914"
    end_edtf: "1945"
    boundary_type: "military"
    boundary_rationale: >-
      1914–1945 est structuré par les deux guerres mondiales, mais le label
      masque la révolution irlandaise (1916–1922), la partition de l'Irlande, la
      crise impériale, la famine du Bengale (1943) et la construction de
      l'État-providence de guerre (rapport Beveridge, 1942).
    alternatives_considered:
      - "Scinder en 1914–1922 (guerre totale et révolution irlandaise) et 1922–1945 (entre-deux-guerres et Seconde Guerre mondiale)."
      - "Renommer « Guerres totales et crise impériale » sans changer les bornes."
    sources: ["SRC-001", "SRC-012", "SRC-016"]
  - id: "PERIOD-6"
    label: "Royaume-Uni contemporain"
    start_edtf: "1945"
    end_edtf: "2026"
    boundary_type: "political"
    boundary_rationale: >-
      1945–2026 est trop large (81 ans) : État-providence et décolonisation,
      guerre froide, tournant thatchérien, dévolution, sociétés multiculturelles
      et Brexit. La césure de 1979 (élection de Margaret Thatcher) est la plus
      utilisée, mais 1973 (choc pétrolier, entrée dans la CEE) et 2008 (crise
      financière) sont des alternatives défendables.
    alternatives_considered:
      - "Scinder en 1945–1979 et 1979–2026."
      - "Scinder en 1945–1973 et 1973–2026."
      - "Scinder en 1945–2008 et 2008–2026."
    sources: ["SRC-001", "SRC-012", "SRC-013"]

