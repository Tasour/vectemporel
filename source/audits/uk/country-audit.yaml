actors:
  - id: "ACTOR-001"
    label: "Emmeline Pankhurst"
    type: "individual"
    roles: ["militante suffragiste", "fondatrice de la WSPU"]
    period_ids: ["PERIOD-4", "PERIOD-5"]
    places: ["PLACE-001", "PLACE-009"]
    resources:
      - "Réseaux de la classe moyenne radicale et du Lancashire"
      - "Presse, réunions publiques, actions directes"
      - "Capacité à mobiliser des femmes jeunes et des ouvrières"
    constraints:
      - "Répression policière, emprisonnement, grèves de la faim"
      - "Exclusion des femmes du suffrage national avant 1918"
      - "Divisions du mouvement suffragiste"
    networks:
      - "Women's Social and Political Union (WSPU)"
      - "Famille Pankhurst, militantes de Manchester"
    counterpowers:
      - "Parlement, partis libéral et conservateur"
      - "National Union of Women's Suffrage Societies (NUWSS)"
      - "Mouvement ouvrier et suffragistes radicales"
    assessment: >-
      Figure centrale de la mobilisation suffragiste, mais son récit militant ne
      résume pas le mouvement : les suffragistes radicales du Lancashire et les
      femmes travaillant en usine ont joué un rôle décisif et sont souvent
      oubliées.
    memory: >-
      Statue de Victoria Tower Gardens (1930), commémorations du centenaire de
      1918; mémoire disputée entre héroïsation et critique des tactiques.
    sources: ["SRC-014", "SRC-001"]
  - id: "ACTOR-002"
    label: "Jayaben Desai"
    type: "individual"
    roles: ["ouvrière", "militante syndicale", "porte-parole de la grève de Grunwick"]
    period_ids: ["PERIOD-6"]
    places: ["PLACE-009"]
    resources:
      - "Comité de grève, réseaux sud-asiatiques de Willesden"
      - "Soutien de syndicats et de la gauche britannique"
      - "Expérience de l'action collective et de la parole publique"
    constraints:
      - "Employeur intransigeant, police, loi sur les piquets"
      - "Prudence du TUC et de certains syndicats"
      - "Racisme et sexisme au travail"
    networks:
      - "Grève de Grunwick (1976–1978)"
      - "APEX, Brent Trades Council, mouvement antiraciste"
    counterpowers:
      - "Direction de Grunwick, État, tribunaux"
      - "Direction syndicale nationale"
    assessment: >-
      Symbole de l'intersection entre classe, race et genre dans le syndicalisme
      britannique; la défaite de la grève ne diminue pas son impact sur la
      reconnaissance des travailleuses migrantes.
    memory: >-
      Archives du Working Class Movement Library, People's History Museum,
      commémorations des 40e et 50e anniversaires.
    sources: ["SRC-017", "SRC-012"]
  - id: "ACTOR-003"
    label: "Margaret Thatcher"
    type: "individual"
    roles: ["Première ministre (1979–1990)", "cheffe du Parti conservateur"]
    period_ids: ["PERIOD-6"]
    places: ["PLACE-009"]
    resources:
      - "Majorité parlementaire, appareil d'État, médias"
      - "Programme de privatisations et de libéralisation"
      - "Soutien d'une partie de l'électorat du Sud et des classes moyennes"
    constraints:
      - "Cabinet divisé, syndicats, Communauté européenne"
      - "Opposition travailliste et libérale-démocrate"
      - "Poll tax et crise de légitimité"
    networks:
      - "Parti conservateur, conseillers de Downing Street"
      - "Milieux d'affaires et presse populaire"
    counterpowers:
      - "National Union of Mineworkers"
      - "Collectivités locales, Écosse et pays de Galles"
      - "Tribunaux et opinion publique"
    assessment: >-
      La « révolution thatchérienne » est réelle (privatisations, monétarisme,
      affaiblissement des syndicats, centralisation), mais elle est aussi une
      construction politique contestée : chômage de masse, inégalités
      territoriales, résistances sociales.
    memory: >-
      Figure la plus polarisante de l'après-guerre; usages politiques
      contradictoires, de l'éloge de la liberté économique à la critique de la
      désindustrialisation.
    sources: ["SRC-012", "SRC-001"]
  - id: "ACTOR-004"
    label: "Doreen Lawrence"
    type: "individual"
    roles: ["mère de Stephen Lawrence", "militante antiraciste", "membre de la Chambre des lords"]
    period_ids: ["PERIOD-6"]
    places: ["PLACE-009"]
    resources:
      - "Famille, réseaux associatifs, presse"
      - "Capacité à obtenir une enquête publique"
      - "Soutien d'organisations antiracistes"
    constraints:
      - "Lenteur de la justice, résistance policière"
      - "Racisme institutionnel"
      - "Charge personnelle et médiatique"
    networks:
      - "Campagne pour la justice pour Stephen Lawrence"
      - "Organisations noires britanniques, avocats, journalistes"
    counterpowers:
      - "Metropolitan Police, Crown Prosecution Service"
      - "État et gouvernement"
    assessment: >-
      La campagne de la famille Lawrence a produit le rapport Macpherson (1999)
      et imposé la notion de racisme institutionnel dans le débat public
      britannique; elle illustre la capacité d'acteurs ordinaires à transformer
      l'agenda institutionnel.
    memory: >-
      Stephen Lawrence Day (22 avril, depuis 2019), mémoriaux, débats sur la
      police et le racisme.
    sources: ["SRC-019", "SRC-012"]
  - id: "ACTOR-005"
    label: "Selina Cooper"
    type: "individual"
    roles: ["ouvrière du textile", "suffragiste radicale", "militante travailliste"]
    period_ids: ["PERIOD-4", "PERIOD-5"]
    places: ["PLACE-001"]
    resources:
      - "Réseaux des ouvrières du Lancashire, coopératives et syndicats"
      - "Expérience de la campagne suffragiste de terrain"
    constraints:
      - "Classe, genre, charges familiales"
      - "Hostilité du mouvement ouvrier masculin"
      - "Distance entre Londres et le Lancashire"
    networks:
      - "NUWSS, Independent Labour Party, coopératives"
    counterpowers:
      - "Partis libéral et conservateur, autorités locales"
    assessment: >-
      Elle montre que le suffrage n'est pas seulement l'affaire des
      suffragettes londoniennes : les ouvrières du Nord ont lié le vote aux
      conditions de travail, au logement et à la protection maternelle.
    memory: >-
      Redécouverte par l'histoire des femmes; archives et travaux de Jill
      Liddington.
    sources: ["SRC-014", "SRC-001"]
  - id: "ACTOR-006"
    label: "Chartistes"
    type: "collective"
    roles: ["mouvement pour la réforme parlementaire", "pétitions nationales"]
    period_ids: ["PERIOD-4"]
    places: ["PLACE-001", "PLACE-009"]
    resources:
      - "Pétitions de masse, meetings, presse radicale"
      - "Réseaux locaux et internationaux"
    constraints:
      - "Répression, divisions stratégiques, refus du Parlement"
      - "Exclusion des femmes du suffrage"
    networks:
      - "London Working Men's Association, radicaux du Nord"
    counterpowers:
      - "Parlement, magistrats, armée"
    assessment: >-
      Le chartisme est le premier grand mouvement de masse pour le suffrage
      universel masculin; ses six demandes structurent le débat démocratique
      britannique jusqu'au XXe siècle.
    memory: >-
      Mémoire ouvrière, musées, commémorations; parfois réduit à une
      « agitation » plutôt qu'à un mouvement politique.
    sources: ["SRC-007", "SRC-001"]
  - id: "ACTOR-007"
    label: "Women Against Pit Closures"
    type: "collective"
    roles: ["mouvement de soutien aux mineurs en grève", "organisation de femmes"]
    period_ids: ["PERIOD-6"]
    places: ["PLACE-005", "PLACE-003"]
    resources:
      - "Cuisines collectives, collectes, réseaux de solidarité"
      - "Archives, presse, chansons, récits"
    constraints:
