claims:
  - id: "CLAIM-001"
    subject: "Royaume-Uni"
    predicate: "est un État d'unions successives"
    object: "1707, 1801, 1922"
    text: >-
      Le Royaume-Uni n'est pas un État-nation unitaire d'origine immémoriale : il
      résulte de l'union de l'Angleterre et de l'Écosse (1707), de l'union avec
      l'Irlande (1801), puis de la partition de 1922 et de la création de l'État
      libre d'Irlande.
    confidence: "certain"
    sources: ["SRC-002", "SRC-005", "SRC-003"]
    revisions: []
  - id: "CLAIM-002"
    subject: "Slavery Abolition Act 1833"
    predicate: "a indemnisé les propriétaires, pas les personnes asservies"
    object: "£20 millions"
    text: >-
      L'acte de 1833 prévoit une compensation de £20 millions pour les
      propriétaires d'esclaves; les personnes asservies ne reçoivent aucune
      indemnisation et passent par une période d'apprentissage avant 1838.
    confidence: "certain"
    sources: ["SRC-020", "SRC-008"]
    revisions: []
  - id: "CLAIM-003"
    subject: "Suffrage féminin"
    predicate: "est limité en 1918, égal en 1928"
    object: "femmes de plus de 30 ans, puis 21 ans"
    text: >-
      La loi de 1918 accorde le vote aux femmes de plus de 30 ans remplissant
      une condition de propriété, et aux hommes de plus de 21 ans; l'égalité
      électorale est atteinte en 1928.
    confidence: "certain"
    sources: ["SRC-014", "SRC-001"]
    revisions: []
  - id: "CLAIM-004"
    subject: "National Health Service"
    predicate: "est gratuit au point d'usage, avec des charges dès 1951"
    object: "5 juillet 1948"
    text: >-
      Le NHS ouvre le 5 juillet 1948 et est financé principalement par l'impôt;
      des charges pour les prescriptions, les lunettes et les soins dentaires
      sont introduites à partir de 1951.
    confidence: "probable"
    sources: ["SRC-012", "SRC-001"]
    revisions: []
  - id: "CLAIM-005"
    subject: "Référendum Brexit"
    predicate: "a donné une majorité au Leave"
    object: "51,9 % des voix, 72,2 % de participation"
    text: >-
      Le 23 juin 2016, 51,9 % des votants se prononcent pour la sortie de l'Union
      européenne, avec une participation de 72,2 %; l'Écosse et l'Irlande du Nord
      votent majoritairement Remain.
    confidence: "certain"
    sources: ["SRC-013", "SRC-001"]
    revisions: []
  - id: "CLAIM-006"
    subject: "Famine du Bengale"
    predicate: "a causé une mortalité de masse disputée"
    object: "1943"
    text: >-
      La famine du Bengale de 1943 cause environ 2 à 3 millions de morts selon
      les estimations; les causes combinent guerre, réquisitions, transports,
      politique coloniale et perturbations locales.
    confidence: "disputed"
    sources: ["SRC-016", "SRC-009"]
    revisions: []
  - id: "CLAIM-007"
    subject: "Massacre d'Amritsar"
    predicate: "a un bilan officiel inférieur aux estimations"
    object: "13 avril 1919"
    text: >-
      Le 13 avril 1919, les troupes du général Dyer tirent sur la foule de
      Jallianwala Bagh; le bilan officiel est de 379 morts, mais les estimations
      savantes sont plus élevées.
    confidence: "certain"
    sources: ["SRC-015", "SRC-009"]
    revisions: []
  - id: "CLAIM-008"
    subject: "Fin de l'empire britannique"
    predicate: "est un processus violent et contesté"
    object: "1919–1997"
    text: >-
      La décolonisation britannique ne se réduit pas à des transferts de
      souveraineté : elle inclut des violences coloniales (Amritsar, Kenya), des
      famines (Bengale), des partitions (Inde, Palestine) et des conflits
      armés (Irlande, Chypre).
    confidence: "disputed"
    sources: ["SRC-009", "SRC-015", "SRC-016", "SRC-010"]
    revisions: []

