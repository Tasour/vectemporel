# Vectemporel — registre des omissions du Royaume-Uni (méthode v1.0)
# Une omission est une décision documentée, pas un oubli silencieux.
# Aucune justification n'invente de source : si la source manque, elle est signalée.

schema_version: "1.0"
country_id: "uk"
reviewed_at: "2026-11-13"
reviewer: ""

reviewed_scope:
  period_ids: ["ERA-1", "ERA-2", "ERA-3", "ERA-4", "ERA-5", "ERA-6"]
  domains:
    - "Politique & institutions"
    - "Guerres & diplomatie"
    - "Droit & justice"
    - "Économie & travail"
    - "Société & démographie"
    - "Femmes, genre, sexualités"
    - "Religions & croyances"
    - "Sciences, techniques & santé"
    - "Arts & lettres"
    - "Environnement & territoire"
    - "Migrations & diasporas"
    - "Peuples autochtones & minorités"
    - "Mémoire & patrimoine"
    - "Circulations transnationales"
  scales: ["local", "regional", "national", "imperial", "transnational"]

omissions:
  - id: "OM-001"
    period_id: "ERA-1"
    domain: "Politique & institutions"
    scale: "national"
    what_is_missing: >-
      La Bretagne préromaine (Néolithique, âge du bronze, âge du fer) avant la
      conquête de 43 : Stonehenge, sociétés agricoles, réseaux d'échange,
      territoires tribaux.
    reason: "out_of_scope"
    justification: >-
      La frise commence en 43, borne conventionnelle de la conquête romaine.
      L'absence est un choix de périmètre, pas une négation de l'histoire
      préromaine. Une extension ou un module « préhistoire » est recommandé.
    evidence_checked: ["SRC-001", "SRC-002"]
    status: "documented"
    reviewer: ""
    review_date: "2026-11-13"
  - id: "OM-002"
    period_id: "ERA-1"
    domain: "Droit & justice"
    scale: "national"
    what_is_missing: >-
      Société, droit, économie, religion et arts de la Bretagne romaine :
      administration provinciale, cités, villas, esclavage, cultes, routes,
      mines et artisanat.
    reason: "not_yet_researched"
    justification: >-
      La frise ne conserve que deux repères politiques (conquête, retrait). Une
      fiche-processus sur la romanisation est nécessaire; les synthèses
      existent, mais les sources spécialisées ne sont pas encore au registre.
    evidence_checked: ["SRC-001", "SRC-002"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"
  - id: "OM-003"
    period_id: "ERA-1"
    domain: "Société & démographie"
    scale: "national"
    what_is_missing: >-
      Angleterre anglo-saxonne, Danelaw, royaumes vikings, christianisation
      (597), formation du royaume d'Angleterre (927), société paysanne et
      monastique.
    reason: "not_yet_researched"
    justification: >-
      La frise saute de 410 à 1066 et ne traite ni les sociétés anglo-saxonnes
      ni les implantations vikings. C'est un angle mort majeur, non justifié
      par l'absence de sources.
    evidence_checked: ["SRC-001", "SRC-002"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"
  - id: "OM-004"
    period_id: "ERA-2"
    domain: "Femmes, genre, sexualités"
    scale: "national"
    what_is_missing: >-
      Histoire des femmes, du genre et des sexualités au Moyen Âge : mariage,
      travail, religion, veuvage, voix féminines, normes de genre.
    reason: "not_yet_researched"
    justification: >-
      Aucune fiche médiévale ne traite les femmes ou le genre. Les synthèses
      générales en disent peu; une recherche spécifique est nécessaire avant
      toute fiche, pour éviter le tokenisme.
    evidence_checked: ["SRC-001", "SRC-002"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"
  - id: "OM-005"
    period_id: "ERA-2"
    domain: "Sciences, techniques & santé"
    scale: "national"
    what_is_missing: >-
      Médecine médiévale, savoirs techniques, architecture, arts et histoire
      environnementale du Moyen Âge.
    reason: "not_yet_researched"
    justification: >-
      La période est couverte par trois repères politiques et démographiques;
      les sciences, les arts et l'environnement n'ont pas de fiche. Dette
      documentaire, pas absence de sources.
    evidence_checked: ["SRC-001", "SRC-002"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"
  - id: "OM-006"
    period_id: "ERA-2"
    domain: "Peuples autochtones & minorités"
    scale: "regional"
    what_is_missing: >-
      Histoire médiévale de l'Écosse, du pays de Galles et de l'Irlande :
      Bannockburn (1314), princes gallois, seigneurie d'Irlande, populations
      gaéliques et marches.
    reason: "not_yet_researched"
    justification: >-
      La périodisation médiévale est anglaise (1066–1485). Les histoires
      écossaise, galloise et irlandaise ont leurs propres césures et ne peuvent
      pas être déduites de la chronologie anglaise.
    evidence_checked: ["SRC-002", "SRC-004", "SRC-005", "SRC-006"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"
  - id: "OM-007"
    period_id: "ERA-3"
    domain: "Religions & croyances"
    scale: "national"
    what_is_missing: >-
      Réforme en Écosse, au pays de Galles et en Irlande; dissolution des
      monastères; catholicisme clandestin; non-conformisme; guerres de religion.
    reason: "not_yet_researched"
    justification: >-
      L'acte de suprématie de 1534 est le seul repère religieux. Il est anglais
      et ne rend pas compte de la Réforme écossaise (1560), de la Réforme
      irlandaise ni de la diversité des dissidences.
    evidence_checked: ["SRC-001", "SRC-002", "SRC-004", "SRC-005", "SRC-006"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"
  - id: "OM-008"
    period_id: "ERA-4"
    domain: "Femmes, genre, sexualités"
    scale: "national"
    what_is_missing: >-
      Femmes, genre et sexualités de 1485 à 1914 : travail, famille, droit,
      éducation, voix publique, sorcellerie, prostitution, homosexualités.
    reason: "not_yet_researched"
    justification: >-
      Le seul repère explicitement féminin est le vote de 1918. Les femmes
      apparaissent comme victimes à Peterloo ou militantes abolitionnistes,
      mais sans fiche structurée; la période moderne est un angle mort.
    evidence_checked: ["SRC-007", "SRC-014", "SRC-001"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"
  - id: "OM-009"
    period_id: "ERA-3"
    domain: "Sciences, techniques & santé"
    scale: "national"
    what_is_missing: >-
      Histoire des sciences, des arts et de l'environnement de 1485 à 1914 :
      révolution scientifique, Lumières écossaises, darwinisme, roman victorien,
      enclosure, pollution industrielle.
    reason: "not_yet_researched"
    justification: >-
      La frise traite l'industrialisation comme un processus technique, mais
      n'a pas de fiche sur la science savante, les arts ou l'environnement. Les
      sources existent; la recherche n'est pas faite.
    evidence_checked: ["SRC-001", "SRC-007", "SRC-009"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"
  - id: "OM-010"
    period_id: "ERA-4"
    domain: "Guerres & diplomatie"
    scale: "imperial"
    what_is_missing: >-
      Révolution américaine (1775–1783), guerres napoléoniennes (1803–1815),
      Waterloo (1815), guerres impériales du XIXe siècle, défaites et
      résistances coloniales.
    reason: "not_yet_researched"
    justification: >-
      La période 1688–1914 ne contient aucun repère de guerre alors qu'elle
      inclut la perte des Treize Colonies, les guerres contre la France et les
      campagnes impériales. C'est un déséquilibre majeur du récit.
    evidence_checked: ["SRC-001", "SRC-009"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"
  - id: "OM-011"
    period_id: "ERA-4"
    domain: "Économie & travail"
    scale: "imperial"
    what_is_missing: >-
      Traite atlantique, esclavage dans les colonies et en Grande-Bretagne avant
      1833, présence noire britannique, ports négriers (Bristol, Liverpool,
      Londres), économie de plantation.
    reason: "not_yet_researched"
    justification: >-
      La frise ne traite l'esclavage qu'au moment de l'abolition de 1833. Elle
      ne dit rien de la traite, de la propriété esclavagiste, des personnes
      asservies ni de leur présence en Grande-Bretagne.
    evidence_checked: ["SRC-008", "SRC-020"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"
  - id: "OM-012"
    period_id: "ERA-4"
    domain: "Migrations & diasporas"
    scale: "transnational"
    what_is_missing: >-
      Migrations irlandaise, juive, sud-asiatique et caribéenne de 1800 à 1945;
      diasporas portuaires et urbaines; émigration britannique vers les
      dominions et les États-Unis.
    reason: "not_yet_researched"
    justification: >-
      Les migrations sont absentes avant 1948, alors qu'elles structurent
      l'industrialisation, les villes portuaires et la société britannique. La
      famine irlandaise est proposée, mais les autres flux restent à documenter.
    evidence_checked: ["SRC-005", "SRC-012", "SRC-001"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"
  - id: "OM-013"
    period_id: "ERA-6"
    domain: "Guerres & diplomatie"
    scale: "transnational"
    what_is_missing: >-
      Guerres et interventions post-1945 : Malaisie, Corée, Suez, Falklands,
      Irak, Afghanistan; service militaire, opinion publique et mémoire.
    reason: "not_yet_researched"
    justification: >-
      La frise contemporaine ne contient aucun repère de guerre ou
      d'intervention militaire, alors que le Royaume-Uni reste une puissance
      militaire et que ces conflits structurent sa politique étrangère.
    evidence_checked: ["SRC-012", "SRC-001"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"
  - id: "OM-014"
    period_id: "ERA-6"
    domain: "Religions & croyances"
    scale: "national"
    what_is_missing: >-
      Sécularisation, diversité religieuse, islam britannique, histoire LGBTQ+
      et handicap : décriminalisation de 1967, Section 28 (1988), mariage
      égalitaire (2013), droits des personnes handicapées.
    reason: "not_yet_researched"
    justification: >-
      La frise contemporaine est centrée sur l'État, l'économie et la question
      irlandaise; les transformations religieuses, sexuelles et du handicap
      sont absentes. Les sources existent, mais ne sont pas au registre.
    evidence_checked: ["SRC-012", "SRC-001"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"
  - id: "OM-015"
    period_id: "ERA-6"
    domain: "Arts & lettres"
    scale: "national"
    what_is_missing: >-
      Arts, sport et culture populaire 1945–2026; smog de 1952 et Clean Air Act
      de 1956; mémoire impériale, statues, musées; processus Brexit 2016–2020.
    reason: "not_yet_researched"
    justification: >-
      La frise traite le NHS, Thatcher, l'accord de 1998 et le Brexit, mais pas
      la culture de masse, l'environnement urbain ni les guerres de mémoire.
      Ces domaines sont documentés ailleurs et doivent être intégrés.
    evidence_checked: ["SRC-012", "SRC-013", "SRC-001"]
    status: "to_fill"
    reviewer: ""
    review_date: "2026-11-13"
