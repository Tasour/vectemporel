periodizations:
  - id: "POL-1"
    label: "Cinq ères politiques et militaires (récit actuel)"
    type: "political"
    start_edtf: "-753"
    end_edtf: "2026"
    rationale: "Périodisation retenue pour la continuité avec l'interface actuelle: Rome, Moyen Âge/Renaissance, guerres et Risorgimento, Italie libérale et fasciste, République. Elle est centrée sur les régimes, les guerres et la souveraineté; elle sous-représente les continuités sociales, religieuses et environnementales."
    sources: ["SRC-001", "SRC-003", "SRC-004", "SRC-009", "SRC-015"]
    selected: true
  - id: "SOC-1"
    label: "Travail, économie et migrations"
    type: "social_economic"
    start_edtf: "-753"
    end_edtf: "2026"
    rationale: "Phases proposées: Antiquité esclavagiste et latifundiaire; Haut Moyen Âge rural et seigneurial; XIe-XVe siècles communes, commerce et peste noire; 1500-1750 proto-industrialisation et crises; 1750-1871 transition agraire et démographique; 1871-1945 triangle industriel, émigration de masse et dualisme Nord-Sud; 1945-1970s fordisme, migrations internes et État social; 1970s-2026 désindustrialisation, précarité, services et immigration. Cette périodisation déplace la césure de 1494 vers le travail et les migrations."
    sources: ["SRC-001", "SRC-003", "SRC-004", "SRC-010", "SRC-011", "SRC-015"]
    selected: false
  - id: "CULT-1"
    label: "Religions, savoirs et environnement"
    type: "cultural_religious_environmental"
    start_edtf: "-753"
    end_edtf: "2026"
    rationale: "Phases proposées: religions italiques et romaines, puis christianisation (313); 313-1000 papauté et monachisme; 1000-1500 communes, ordres mendiants, humanisme et Renaissance; 1500-1700 Réforme catholique, Baroque et révolution scientifique; 1700-1815 Lumières et réformes; 1815-1871 romantisme national et Risorgimento; 1871-1945 culture de masse et sacralisation fasciste; 1945-2026 sécularisation, consumérisme, mémoire et crise environnementale."
    sources: ["SRC-002", "SRC-003", "SRC-005", "SRC-007", "SRC-008", "SRC-016"]
    selected: false
  - id: "POL-2"
    label: "De la cité-État à l'État-nation"
    type: "political"
    start_edtf: "1200"
    end_edtf: "2026"
    rationale: "Alternative centrée sur la souveraineté fragmentée: communes et seigneuries (XIe-XVe siècles), dominations étrangères (1494-1796), construction de l'État-nation (1796-1871), État libéral et fasciste (1871-1945), République et intégration européenne (1945-2026). Elle rend visible la longue absence d'un État péninsulaire unifié."
    sources: ["SRC-004", "SRC-009"]
    selected: false

periods:
  - id: "ERA-1"
    label: "Rome antique"
    start_edtf: "-753"
    end_edtf: "476"
    boundary_type: "political"
    boundary_rationale: "Bornes conventionnelles: fondation légendaire de Rome et déposition de Romulus Augustulus. La seconde est un repère historiographique, non une fin instantanée; les continuités byzantines, gothiques et lombardes traversent la césure."
    alternatives_considered:
      - "Début à -509 (République) ou -27 (Empire)"
      - "Fin à 410 (sac de Rome) ou 493 (royaume ostrogoth)"
    sources: ["SRC-001", "SRC-003"]
  - id: "ERA-2"
    label: "Moyen Âge & Renaissance"
    start_edtf: "476"
    end_edtf: "1494"
    boundary_type: "political"
    boundary_rationale: "La borne de 1494 correspond au début des guerres d'Italie et à l'entrée de Charles VIII; elle est politique et militaire. Elle ne marque ni une rupture économique ni une rupture culturelle: la Renaissance commence avant 1494 et se prolonge après."
    alternatives_considered:
      - "Scinder à 1000 (communes) ou 1348 (peste noire)"
      - "Fin à 1454 (paix de Lodi) ou 1559 (paix de Cateau-Cambrésis)"
    sources: ["SRC-003", "SRC-004"]
  - id: "ERA-3"
    label: "Guerres & Risorgimento"
    start_edtf: "1494"
    end_edtf: "1871"
    boundary_type: "military"
    boundary_rationale: "La borne de 1494 ouvre les guerres d'Italie; celle de 1871 correspond au transfert de la capitale à Rome. L'ère englobe trois siècles de dominations étrangères, puis le Risorgimento; elle est trop longue pour un récit homogène."
    alternatives_considered:
      - "Scinder à 1796 (invasion napoléonienne) ou 1815 (Congrès de Vienne)"
      - "Fin à 1861 (proclamation du royaume) ou 1870 (prise de Rome)"
    sources: ["SRC-004", "SRC-009"]
  - id: "ERA-4"
    label: "Italie moderne"
    start_edtf: "1871"
    end_edtf: "1945"
    boundary_type: "political"
    boundary_rationale: "1871 marque l'achèvement territorial de l'Unité avec Rome; 1945 la fin de la guerre et de l'occupation. La césure de 1922 (marche sur Rome) est une rupture interne majeure que l'ère ne signale pas."
    alternatives_considered:
      - "Scinder à 1922 (fascisme) ou 1943 (armistice)"
      - "Fin à 1946 (référendum) plutôt que 1945"
    sources: ["SRC-009", "SRC-012", "SRC-013"]
  - id: "ERA-5"
    label: "République"
    start_edtf: "1945"
    end_edtf: "2026"
    boundary_type: "military"
    boundary_rationale: "1945 correspond à la Libération et à la fin de la guerre; la République n'est proclamée qu'en 1946 et la Constitution n'entre en vigueur qu'en 1948. La borne de 1945 est donc militaire et politique, pas institutionnelle."
    alternatives_considered:
      - "Début à 1943 (armistice) ou 1946 (référendum)"
      - "Marquer 1948 (Constitution) comme borne institutionnelle"
    sources: ["SRC-014", "SRC-015"]

