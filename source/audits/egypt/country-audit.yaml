    subject: "Révolution de 2011"
    predicate: "a conduit"
    object: "à une transition conflictuelle"
    text: "La révolution de 2011 provoque la chute de Moubarak, puis une transition marquée par l'élection de Morsi, le coup militaire de 2013 et la répression."
