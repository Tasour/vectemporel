periodizations:
  - id: "POL-1"
    label: "Périodisation politique éditoriale (5 ères, avec scission recommandée de l'ère islamique)"
    type: "political"
    start_edtf: "-3100"
    end_edtf: "2026"
    rationale: "Récit principal actuel : unification pharaonique, mondes grec et romain, islam, modernité coloniale, république. Il est lisible mais agrège 1 157 ans d'histoire islamique et surestime la césure de 1798."
    sources: ["SRC-001", "SRC-007", "SRC-011", "SRC-019"]
    selected: true
  - id: "SOC-1"
    label: "Périodisation sociale et économique"
    type: "social_economic"
    start_edtf: "-3100"
    end_edtf: "2026"
    rationale: "Succession de régimes agraires et fiscaux : économie nilotique et corvée, ordre agraire-commercial islamique, ordre fiscal ottoman, coton et dette, État développementiste, restructuration néolibérale, économie militarisée. Elle fait apparaître les paysans, les artisans et les marchés que la périodisation politique masque."
    sources: ["SRC-002", "SRC-007", "SRC-008", "SRC-010", "SRC-011", "SRC-017"]
    selected: false
  - id: "CULT-1"
    label: "Périodisation culturelle, religieuse et environnementale"
    type: "cultural_religious_environmental"
    start_edtf: "-3100"
    end_edtf: "2026"
    rationale: "Ordre polythéiste et temple, christianisation et Alexandrie tardive, islamisation et coexistence copte, ordre confessionnel ottoman, réformes et Nahda, nationalismes et cultures de masse, islamismes et mémoires. Elle met au premier plan les croyances, les langues et les milieux."
    sources: ["SRC-005", "SRC-006", "SRC-007", "SRC-019"]
    selected: false

periods:
  - id: "PERIOD-1"
    label: "Égypte pharaonique"
    start_edtf: "-3100"
    end_edtf: "-332"
    boundary_type: "political"
    boundary_rationale: "Convention chronologique : unification et effondrement de l'État pharaonique. La borne -332 correspond à la conquête d'Alexandre, pas à une fin culturelle brutale."
    alternatives_considered:
      - "-3200/-3000 pour l'unification"
      - "-343 pour la fin de la XXXe dynastie"
      - "-30 pour l'annexion romaine"
    sources: ["SRC-001", "SRC-002"]
  - id: "PERIOD-2"
    label: "Égypte gréco-romaine"
    start_edtf: "-332"
    end_edtf: "641"
    boundary_type: "political"
    boundary_rationale: "Conquête d'Alexandre et intégration romaine. La borne 641 est conventionnelle : la conquête arabe s'étend de 639 à 642 et l'islamisation est un processus long."
    alternatives_considered:
      - "-331 pour la fondation d'Alexandrie"
      - "-30 pour l'annexion romaine"
      - "451 pour la rupture copte"
    sources: ["SRC-001", "SRC-006"]
  - id: "PERIOD-3"
    label: "Égypte islamique"
    start_edtf: "641"
    end_edtf: "1798"
    boundary_type: "political"
    boundary_rationale: "De la conquête arabe à l'expédition française. Période trop longue : elle agrège les Tulunides, les Fatimides, les Ayyubides, les Mamelouks et les Ottomans, dont les régimes, les élites et les institutions diffèrent."
    alternatives_considered:
      - "641–1517 (Égypte islamique médiévale) + 1517–1798 (Égypte ottomane)"
      - "969–1517 (Caire impérial)"
      - "1250–1517 (sultanat mamelouk)"
    sources: ["SRC-007", "SRC-008"]
  - id: "PERIOD-4"
    label: "Égypte moderne"
    start_edtf: "1798"
    end_edtf: "1952"
    boundary_type: "political"
    boundary_rationale: "Expédition française, Muhammad Ali, occupation britannique et monarchie. La borne 1798 est un marqueur européen ; 1805 et 1882 sont des alternatives plus structurantes pour l'histoire sociale et impériale."
    alternatives_considered:
      - "1805 (Muhammad Ali)"
      - "1882 (occupation britannique)"
      - "1919/1922 (révolution et indépendance)"
    sources: ["SRC-010", "SRC-011", "SRC-012"]
  - id: "PERIOD-5"
    label: "Égypte contemporaine"
    start_edtf: "1952"
    end_edtf: "2026"
    boundary_type: "political"
    boundary_rationale: "République, Nasser, Sadate, Moubarak, 2011 et 2013. Période ouverte ; les sous-périodes 1952–1970, 1970–1981, 1981–2011 et 2011–2026 sont plus explicatives que l'unité actuelle."
    alternatives_considered:
      - "1970 (mort de Nasser)"
      - "1981 (assassinat de Sadate)"
      - "2011 (révolution)"
      - "2013 (coup militaire)"
    sources: ["SRC-015", "SRC-019", "SRC-020"]

