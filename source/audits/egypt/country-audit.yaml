claims:
  - id: "CLAIM-001"
    subject: "Unification de l'Égypte"
    predicate: "est datée"
    object: "vers 3100 av. J.-C."
    text: "La date de -3100 est une convention chronologique pour un processus d'unification, pas la date certaine d'un événement unique."
    confidence: "probable"
    sources: ["SRC-001"]
    revisions: []
  - id: "CLAIM-002"
    subject: "Islamisation de l'Égypte"
    predicate: "est un processus"
    object: "pluriséculaire"
    text: "La conquête arabe de 641 ne marque pas une islamisation immédiate ; les coptes restent majoritaires pendant plusieurs siècles et les estimations de bascule varient."
    confidence: "probable"
    sources: ["SRC-007", "SRC-006"]
    revisions: []
  - id: "CLAIM-003"
    subject: "Mortalité des travailleurs du canal de Suez"
    predicate: "est"
    object: "disputée"
    text: "Le chiffre de 120 000 morts, souvent cité pour la construction du canal de Suez, n'est pas documenté de façon fiable ; les estimations varient fortement."
    confidence: "disputed"
    sources: ["SRC-011", "SRC-012"]
    revisions: []
  - id: "CLAIM-004"
    subject: "Révolution de 1919"
    predicate: "a impliqué"
    object: "paysans, ouvriers, femmes et chrétiens"
    text: "La révolution de 1919 dépasse les élites du Wafd : des paysans, des ouvriers, des femmes et des chrétiens y participent, avec des violences rurales importantes."
    confidence: "probable"
    sources: ["SRC-013"]
    revisions: []
  - id: "CLAIM-005"
    subject: "Coup de 1952"
    predicate: "est qualifié"
    object: "de révolution par le régime"
    text: "Le 23 juillet 1952 est un coup d'État militaire qui se présente comme une révolution ; la qualification reste un enjeu historiographique."
    confidence: "disputed"
    sources: ["SRC-015"]
    revisions: []
  - id: "CLAIM-006"
    subject: "Traité de paix égypto-israélien"
    predicate: "est signé"
    object: "le 26 mars 1979"
    text: "Les accords de Camp David datent de septembre 1978 ; le traité de paix est signé à Washington le 26 mars 1979. Le prix Nobel de la paix est attribué à Sadate et Begin en 1978."
    confidence: "certain"
    sources: ["SRC-011"]
    revisions: []
  - id: "CLAIM-007"
    subject: "Déplacement des Nubiens"
    predicate: "a concerné"
    object: "environ 50 000 personnes en Égypte"
    text: "Le déplacement de 1963–1964 concerne environ 50 000 Nubiens égyptiens, relogés à Kom Ombo ; les chiffres varient selon les sources et les modes de comptage."
    confidence: "probable"
    sources: ["SRC-018"]
    revisions: []
  - id: "CLAIM-008"
    subject: "Massacre de Rabaa"
    predicate: "a tué"
    object: "au moins 817 personnes"
    text: "Human Rights Watch documente au moins 817 morts lors de la dispersion du sit-in de Rabaa le 14 août 2013, et probablement plus de 1 000 ; les chiffres officiels sont inférieurs."
    confidence: "probable"
    sources: ["SRC-020"]
    revisions: []
