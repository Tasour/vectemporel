scope:
  territory_current: "Égypte contemporaine : vallée du Nil et delta, déserts occidental et oriental, Sinaï, oasis, côtes méditerranéenne et rouge ; frontières terrestres avec la Libye, le Soudan, Israël et Gaza."
  territories_historical:
    - "Égypte pharaonique (v. 3100–332 av. J.-C.)"
    - "Royaume ptolémaïque (305–30 av. J.-C.)"
    - "Province romaine d'Égypte (30 av. J.-C.–641)"
    - "Égypte islamique (641–1517)"
    - "Province ottomane d'Égypte (1517–1805)"
    - "Khédivat d'Égypte (1867–1914)"
    - "Protectorat britannique (1914–1922)"
    - "Royaume d'Égypte et du Soudan (1922–1953)"
    - "République arabe unie (1958–1961)"
    - "Sinaï occupé par Israël (1967–1982)"
  regions_autonomous:
    - "Aucune région autonome dans l'État actuel ; la Nubie et le Sinaï sont des espaces historiques à statut variable."
  scope_note: "Les listes populations_included et populations_excluded distinguent le récit national des couches transnationales ; aucune population n'est exclue de l'histoire."
  populations_included:
    - "Égyptiens"
    - "Coptes"
    - "Nubiens"
    - "Bedouins"
    - "Siwis"
    - "Communautés juives historiques"
    - "Grecs, Italiens et Arméniens historiques"
    - "Soudanais et réfugiés installés en Égypte"
  populations_excluded:
    - "Diasporas égyptiennes du Golfe, d'Europe, d'Amérique du Nord et d'Australie (hors cadre territorial, à traiter en couche transnationale)"
    - "Populations transfrontalières égypto-soudanaises (hors cadre national, à traiter en couche régionale)"
    - "Palestiniens de Gaza et réfugiés palestiniens en Égypte (non nationaux, à traiter comme acteurs transfrontaliers)"
    - "Travailleurs migrants sans statut (non nationaux, à traiter comme acteurs transfrontaliers)"
  diasporas:
    - "Diaspora égyptienne du Golfe"
    - "Diaspora copte"
    - "Diaspora nubienne"
    - "Diaspora juive d'Égypte"
    - "Étudiants et professionnels en Europe et en Amérique du Nord"
  temporal:
    start_edtf: "-3100"
    end_edtf: "2026"
    start_rationale: "Date conventionnelle de l'unification de la Haute et de la Basse-Égypte ; les spécialistes proposent une fourchette de part et d'autre de 3100 av. J.-C. La borne est retenue pour la lisibilité, pas comme certitude."
    end_rationale: "Année de travail de l'audit ; la période contemporaine est ouverte et doit être mise à jour chaque année."
  unit_of_analysis: "fiche-événement"
  inclusion_criteria:
    - "Événement, processus ou institution qui modifie durablement les institutions, les rapports de force, les conditions de vie ou les représentations d'une partie significative des populations."
    - "Connexion transfrontalière, impériale ou diasporique ayant des effets sur le territoire égyptien ou sur les Égyptiens."
    - "Fait attesté par au moins une source savante ou primaire vérifiée, avec acteur, lieu et date."
  exclusion_criteria:
    - "Date isolée sans acteur, lieu ou source."
    - "Événement purement dynastique ou anecdotique sans effet structurel documenté."
    - "Événement étranger sans implication égyptienne directe."
    - "Commémoration sans événement historique distinct, sauf si elle est elle-même objet d'histoire."
  audience:
    - "grand public"
    - "scolaire"
    - "diasporas"
    - "recherche"
  evidence_threshold: "deux sources indépendantes par fiche, ou exception documentée"

