    reason: >-
      Scission de « Chine populaire (1949-1978) » en « Chine maoïste
      (1949-1976) » et « Transition (1976-1978) » : periodization redesign, non
      autorisé dans era_updates ; à traiter dans une refonte de la périodisation.

  - id: "era-reforme-puissance-split"
    reason: >-
      Scission de « Réforme et puissance (1978-2026) » en « Réformes
      (1978-2001) » et « Puissance et tensions (2001-2026) » : periodization
      redesign, non autorisé dans era_updates ; à traiter dans une refonte de la
