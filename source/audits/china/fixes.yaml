  - id: "cn-prop-tibet"
    reason: >-
      PROP-011 (accord en dix-sept points sur le Tibet, 1951) n'est pas ajouté
      comme fiche autonome : plafond de 4 ajouts et source principale (SRC-016)
      critique, sans contrepartie institutionnelle chinoise dans le registre.
      L'accord est mentionné dans cn-1949 ; une fiche dédiée exige des sources
      institutionnelles chinoises et tibétaines croisées.

  - id: "cn-1949-fiches-distinctes"
    reason: >-
      La correction de cn-1949 demande des fiches distinctes pour la réforme
      agraire (1950-1952), la famine (1959-1961) et la Révolution culturelle
      (1966-1976). Elles ne sont pas ajoutées faute de place ; le résumé les
      mentionne et les propositions PROP-012 et PROP-013 restent en file.

  - id: "cn-deng-fiches-distinctes"
    reason: >-
      La correction de cn-deng demande des fiches pour 1989, 1997, 2001 et 2020.
      Elles ne sont pas ajoutées faute de place ; le résumé les mentionne et les
      propositions PROP-015 à PROP-018 restent en file.

  - id: "sources-imperiales"
    reason: >-
      Les corrections cn-shang à cn-ming reposent sur SRC-001 seul ; une seconde
      synthèse (Cambridge History of China) est nécessaire avant publication,
      conformément aux dettes du rapport.
