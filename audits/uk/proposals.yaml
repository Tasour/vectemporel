    subtitle: "Le village de Capel Celyn englouti"
    tags: ["societe", "politique"]
    importance: 2
    summary: >-
      Le Liverpool Corporation Act de 1957 autorise la construction d'un
      réservoir dans la vallée de Tryweryn. Malgré les protestations, le village
      gallois de Capel Celyn est inondé en 1965. L'événement devient un symbole
      du rapport de force entre Londres/Liverpool et le pays de Galles et
      stimule le nationalisme gallois.
    sources: ["SRC-006", "SRC-002"]
    confidence: "high"
