      15 millions de personnes et des violences qui tuent peut-être un million
      de personnes. Le Royaume-Uni met fin à son empire indien dans une
      précipitation controversée.
    sources: ["SRC-010", "SRC-005"]
    confidence: "high"
    rationale: >-
