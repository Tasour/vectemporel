    subtitle: "Guerre, empire et mortalité de masse"
    tags: ["societe", "guerre", "economie"]
    importance: 3
    summary: >-
      La famine frappe le Bengale en 1943, dans le contexte de la guerre contre
      le Japon, des réquisitions, des transports et de la politique coloniale.
      Les estimations de mortalité vont d'environ 2 à 3 millions. L'événement
      est central dans la critique de l'empire britannique.
    sources: ["SRC-016", "SRC-009"]
    confidence: "high"
    rationale: >-
      Événement impérial majeur; environnement et guerre; populations
      colonisées; absent.
  - id: "PROP-009"
    action: "add"
