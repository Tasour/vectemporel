    title: "Amritsar"
    subtitle: "Le massacre de Jallianwala Bagh"
    tags: ["guerre", "politique"]
    importance: 3
    summary: >-
      Le 13 avril 1919, le général Dyer ordonne de tirer sur une foule réunie à
      Jallianwala Bagh, Amritsar. Le bilan officiel est de 379 morts, mais les
      estimations sont plus élevées. L'événement nourrit le mouvement
      nationaliste indien et la critique de l'empire.
    sources: ["SRC-015", "SRC-009"]
    confidence: "high"
    rationale: >-
      Violence coloniale; populations colonisées; mémoire; absent de la frise.
  - id: "PROP-008"
