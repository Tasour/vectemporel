periodization:
  current_verdict: >-
    La périodisation actuelle (6 ères) est cohérente et contiguë, mais elle
    souffre de trois défauts : la période 1688–1914 est trop large et
    Londres-centrée; la période 1945–2026 est trop large et confond État-providence,
    décolonisation, thatchérisme et Brexit; les libellés « Antiquité & invasions »
    et « Renaissance & Réforme » sont eurocentrés et anglais. La césure de 1922
    (partition irlandaise) n'est pas nommée. Les bornes 43, 1066, 1485, 1688,
    1914 et 1945 restent défendables, mais doivent être explicitées.
  proposed_changes:
    - action: "rename"
      era_name: "Antiquité & invasions"
      proposal: "Renommer « Bretagne romaine, Anglo-Saxons et Vikings (43–1066) »."
      rationale: >-
        Le mot « invasions » met au même plan la conquête romaine, les
        installations anglo-saxonnes et les raids vikings, et masque la
        continuité des sociétés bretonnes. Le nouveau libellé décrit les acteurs
        sans les hiérarchiser.
      sources: ["SRC-001", "SRC-002"]
    - action: "rename"
      era_name: "Moyen Âge"
      proposal: "Renommer « Moyen Âge des quatre nations (1066–1485) »."
      rationale: >-
        1066 et 1485 sont des bornes anglaises; les histoires écossaise,
        galloise et irlandaise ont leurs propres césures. Le libellé doit
        expliciter le cadre plurinational sans prétendre à une chronologie unique.
      sources: ["SRC-002", "SRC-004", "SRC-005", "SRC-006"]
    - action: "rename"
      era_name: "Renaissance & Réforme"
      proposal: "Renommer « Réforme, guerres des Trois Royaumes et Révolution (1485–1688) »."
      rationale: >-
        « Renaissance » est peu adapté aux îles Britanniques; la période est
        structurée par la Réforme, les guerres des Trois Royaumes, la
        colonisation de l'Irlande et la Glorieuse Révolution.
      sources: ["SRC-001", "SRC-002", "SRC-005"]
    - action: "split"
      era_name: "Empire & industrie"
      proposal: "Scinder en « Grande-Bretagne et premier empire (1688–1815) » et « Industrialisation et empire victorien (1815–1914) »."
      rationale: >-
        226 ans en une seule ère confondent l'union de 1707, la traite, la perte
        des Treize Colonies, les guerres napoléoniennes, l'industrialisation et
        l'empire victorien. 1815 marque la fin des guerres européennes et le
        début d'un ordre impérial différent; 1832 (Reform Act) est une
        alternative politique.
      sources: ["SRC-003", "SRC-007", "SRC-009"]
    - action: "rename"
      era_name: "Guerres mondiales"
      proposal: "Renommer « Guerres totales et crise impériale (1914–1945) »."
      rationale: >-
        Le libellé actuel masque la révolution irlandaise (1916–1922), la
        partition de l'Irlande, la famine du Bengale (1943) et l'État-providence
        de guerre. « Guerres totales » décrit mieux la mobilisation des sociétés
        et des empires.
      sources: ["SRC-001", "SRC-012", "SRC-016"]
    - action: "split"
      era_name: "Royaume-Uni contemporain"
      proposal: "Scinder en « État-providence, décolonisation et guerre froide (1945–1979) » et « Néolibéralisme, nations et Brexit (1979–2026) »."
      rationale: >-
        81 ans en une seule ère empêchent de distinguer le consensus
        d'après-guerre, la décolonisation, la crise des années 1970, le tournant
        thatchérien, la dévolution et le Brexit. 1979 est la césure politique la
        plus utilisée; 1973 (choc pétrolier, CEE) et 2008 (crise financière)
        restent des alternatives.
      sources: ["SRC-012", "SRC-001", "SRC-013"]
    - action: "add"
      era_name: "Couche Irlande"
      proposal: "Ajouter une couche transversale « Irlande, 1801–1998 »."
      rationale: >-
        L'Irlande traverse les ères (Union de 1801, famine, révolution,
        partition, Troubles, accord de 1998) et ne peut pas être traitée comme
        une simple région périphérique. Une couche thématique rend visibles les
        continuités et les violences.
      sources: ["SRC-005", "SRC-001"]
    - action: "add"
      era_name: "Couche Empire et populations colonisées"
      proposal: "Ajouter une couche transversale « Empire et populations colonisées »."
      rationale: >-
        L'empire n'est pas une ère : il est une dimension de l'histoire
        britannique du XVIIe au XXe siècle. Une couche dédiée permet d'intégrer
        Amritsar, la famine du Bengale, la partition, le Kenya et les
        circulations impériales sans les diluer dans le récit national.
      sources: ["SRC-009", "SRC-015", "SRC-016", "SRC-010"]
    - action: "keep"
      era_name: "Borne 43"
      proposal: "Conserver 43 comme borne de départ de la frise."
      rationale: >-
        La conquête romaine est une césure conventionnelle et documentée;
        l'extension préromaine est traitée comme une omission de périmètre
        (OM-001), pas comme un motif de déplacement de la borne.
      sources: ["SRC-001", "SRC-002"]
    - action: "move_boundary"
      era_name: "Royaume-Uni contemporain"
      proposal: "Tester le déplacement de la borne de 1979 à 1973 ou 2008 avant validation."
      rationale: >-
        1979 est une césure politique (Thatcher); 1973 est une césure
        économique et européenne (choc pétrolier, entrée dans la CEE); 2008 est
        une césure financière. Le choix doit être explicité et discuté, pas
        imposé par la date la plus commode.
      sources: ["SRC-012", "SRC-013"]

events:
  - id: "PROP-001"
    action: "add"
    existing_id: null
    year: 1801
    end_year: null
    title: "Union avec l'Irlande"
    subtitle: "Naissance du Royaume-Uni de Grande-Bretagne et d'Irlande"
    tags: ["politique", "religion"]
    importance: 3
    summary: >-
      Les Actes d'Union de 1800, adoptés par les parlements de Grande-Bretagne
      et d'Irlande, entrent en vigueur le 1er janvier 1801. L'Irlande perd son
      parlement; 100 députés irlandais siègent à Westminster. L'union est
      contestée, notamment par les catholiques et les patriotes irlandais.
    sources: ["SRC-005", "SRC-002", "SRC-003"]
    confidence: "high"
    rationale: >-
      Comble l'absence de 1801, explique la formation du Royaume-Uni et
      l'histoire irlandaise; fournit un acteur (Parlement) et un lieu (Dublin,
      Westminster).
  - id: "PROP-002"
    action: "add"
    existing_id: null
    year: 1833
    end_year: 1838
    title: "Abolition de l'esclavage"
    subtitle: "Loi, compensation et apprentissage"
    tags: ["societe", "politique", "economie"]
    importance: 3
    summary: >-
      Après des décennies de campagnes abolitionnistes, le Parlement vote
      l'abolition de l'esclavage dans les colonies britanniques en 1833. L'acte
      entre en vigueur le 1er août 1834; les personnes asservies passent par une
      période d'apprentissage avant 1838. Les propriétaires reçoivent
      £20 millions, les personnes asservies aucune indemnisation.
    sources: ["SRC-008", "SRC-020"]
    confidence: "high"
    rationale: >-
      Transforme l'événement de 1833 en processus 1833–1838; rend visibles la
      compensation, l'apprentissage et les limites de l'émancipation.
  - id: "PROP-003"
    action: "add"
    existing_id: null
    year: 1819
    end_year: null
    title: "Peterloo"
    subtitle: "La cavalerie charge une réunion réformiste à Manchester"
    tags: ["politique", "societe"]
    importance: 2
    summary: >-
      Le 16 août 1819, une foule estimée à 60 000 personnes se réunit à
      St Peter's Fields, Manchester, pour demander une réforme parlementaire.
      La yeomanry charge; au moins 18 personnes sont tuées et plusieurs
      centaines blessées. L'événement devient un symbole de la répression et de
      la mobilisation ouvrière.
    sources: ["SRC-007", "SRC-001"]
    confidence: "high"
    rationale: >-
      Ancre l'histoire sociale et régionale; Manchester hors capitale; femmes
      victimes et militantes; lien avec le chartisme.
  - id: "PROP-004"
    action: "add"
    existing_id: null
    year: 1838
    end_year: 1848
    title: "Chartisme"
    subtitle: "Le mouvement pour le suffrage universel masculin"
    tags: ["politique", "societe"]
    importance: 3
    summary: >-
      La Charte du peuple de 1838 réclame six réformes, dont le suffrage
      universel masculin, le vote secret et des circonscriptions égales. Les
      pétitions de 1839, 1842 et 1848 sont rejetées; le mouvement décline après
      1848, mais plusieurs de ses demandes sont adoptées au XXe siècle.
    sources: ["SRC-007", "SRC-001"]
    confidence: "high"
    rationale: >-
      Mouvement collectif de masse; histoire des classes populaires; hors
      Londres; complète le récit parlementaire.
  - id: "PROP-005"
    action: "add"
    existing_id: null
    year: 1845
    end_year: 1852
    title: "Grande famine irlandaise"
    subtitle: "Mortalité, émigration et responsabilité impériale"
    tags: ["societe", "economie"]
    importance: 3
    summary: >-
      La maladie de la pomme de terre détruit les récoltes à partir de 1845.
      Environ un million de personnes meurent et plus d'un million émigrent. La
      gestion britannique, les marchés et l'aide publique sont au cœur des
      débats historiographiques.
    sources: ["SRC-011", "SRC-005"]
    confidence: "high"
    rationale: >-
      Événement majeur de l'histoire irlandaise et impériale; migration;
      absence totale de la frise.
  - id: "PROP-006"
    action: "add"
    existing_id: null
    year: 1882
    end_year: 1886
    title: "Agitation crofters"
    subtitle: "La question de la terre dans les Highlands"
    tags: ["societe", "economie", "politique"]
    importance: 2
    summary: >-
      Les crofters des Highlands et des îles se mobilisent contre les loyers et
      les expulsions. La commission Napier (1883) enquête; le Crofters Holdings
      (Scotland) Act de 1886 accorde la sécurité d'occupation et des loyers
      équitables. L'épisode s'inscrit dans la longue histoire des clearances.
    sources: ["SRC-004", "SRC-002"]
    confidence: "high"
    rationale: >-
      Écosse rurale et classes populaires; corrige le récit industriel/urbain;
      hors Londres.
  - id: "PROP-007"
    action: "add"
