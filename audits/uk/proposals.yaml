corrections:
  - existing_id: "uk-410"
    issue: >-
      La date de 410 est traitée comme une fin ponctuelle; le retrait romain est
      un processus et l'installation germanique n'est pas un événement unique.
    proposal: >-
      Reformuler « vers 410, l'autorité romaine cesse de manière durable; les
      sociétés locales se recomposent; l'installation anglo-saxonne s'étale sur
      les Ve–VIe siècles ». Ajouter un TimeSpan 410~ et des acteurs.
    sources: ["SRC-001", "SRC-002"]
    confidence: "high"
  - existing_id: "uk-magna"
    issue: >-
      Présenter Magna Carta comme une « charte de droits » est anachronique; le
      texte de 1215 est un règlement féodal, annulé puis réédité.
    proposal: >-
      Parler de « charte négociée entre Jean sans Terre et les barons »; préciser
      le 15 juin 1215, l'annulation par Innocent III, les rééditions de 1216,
      1217 et 1225; distinguer le texte et sa mémoire.
    sources: ["SRC-001", "SRC-002"]
    confidence: "high"
  - existing_id: "uk-peste"
    issue: >-
      Le sous-titre « Un tiers de la population disparaît » est une estimation
      basse présentée comme certitude; l'origine portuaire est incertaine.
    proposal: >-
      Écrire « mortalité massive, estimations de 30 à 60 % »; préciser
      1348–1349; éviter le port unique.
    sources: ["SRC-001", "SRC-002"]
    confidence: "high"
  - existing_id: "uk-civil"
    issue: >-
      L'expression « guerre civile » au singulier masque les guerres des Trois
      Royaumes (Écosse, Irlande, Angleterre) et la conquête cromwellienne de
      l'Irlande.
    proposal: >-
      Renommer « Guerres des Trois Royaumes (1639–1653) »; distinguer les
      théâtres; ajouter l'exécution de Charles Ier (1649), la république, le
      Protectorat et la restauration de 1660.
    sources: ["SRC-002", "SRC-005", "SRC-001"]
    confidence: "high"
  - existing_id: "uk-glorieuse"
    issue: >-
      « Déclaration des droits de 1689 » est une traduction inexacte; le Bill of
      Rights est une loi; la révolution est aussi une invasion hollandaise et un
      compromis.
    proposal: >-
      Écrire « Bill of Rights (1689) »; préciser la déclaration de février 1689
      et la loi de décembre; mentionner l'armée hollandaise, le soutien
      protestant et les limites du consentement.
    sources: ["SRC-001", "SRC-003"]
    confidence: "high"
  - existing_id: "uk-union"
    issue: >-
      L'événement de 1707 est parfois confondu avec le Royaume-Uni de 1801;
      l'union est présentée comme consensuelle.
    proposal: >-
      Titrer « Actes d'Union (1707) » et préciser « Royaume de Grande-Bretagne »;
      mentionner l'opposition populaire, les émeutes, le vote du Parlement
      écossais et la persistance d'institutions écossaises (Église, droit).
    sources: ["SRC-003", "SRC-004", "SRC-002"]
    confidence: "high"
  - existing_id: "uk-industrie"
    issue: >-
      La période 1760–1840 et le récit technologique anglais sous-estiment les
      continuités, le rôle de l'empire, du charbon, des femmes et des enfants,
      et la géographie régionale.
    proposal: >-
      Reformuler comme processus 1750–1850; préciser Lancashire, West Riding,
      Clyde, Midlands; inclure le travail des enfants, les femmes,
      l'urbanisation, l'esclavage et les marchés impériaux; signaler que
      « révolution industrielle » est une métaphore contestée.
    sources: ["SRC-007", "SRC-009", "SRC-001"]
    confidence: "high"
  - existing_id: "uk-esclavage"
    issue: >-
      Le titre « Abolition » est trop large; l'acte de 1833 prend effet en 1834,
      vise les colonies britanniques avec des exceptions et impose un
      apprentissage.
    proposal: >-
      Titrer « Abolition de l'esclavage (1833–1838) »; préciser l'assentiment
      royal du 28 août 1833, l'entrée en vigueur du 1er août 1834, l'apprentissage
      jusqu'en 1838, les £20 millions aux propriétaires et l'absence
      d'indemnisation des personnes asservies.
    sources: ["SRC-020", "SRC-008"]
    confidence: "high"
  - existing_id: "uk-ww1"
    issue: >-
      Le résumé « s'épuise » et « déclin relatif » sont téléologiques; la
      mobilisation de l'empire et les divisions irlandaises sont absentes.
    proposal: >-
      Décrire la mobilisation, la conscription de 1916, les pertes, le front
      intérieur, les munitions, l'Irlande (1916) et les contributions de
      l'empire; présenter le déclin relatif comme une thèse à discuter, pas comme
      un fait.
    sources: ["SRC-012", "SRC-001"]
    confidence: "high"
  - existing_id: "uk-vote"
    issue: >-
      Le suffrage de 1918 est présenté comme l'égalité; il est limité aux femmes
      de plus de 30 ans avec qualification; le rôle des suffragistes radicales
      est omis.
    proposal: >-
      Préciser le 6 février 1918, 8,5 millions d'électrices, les conditions de
      propriété, l'âge de 30 ans, le droit de se présenter en 1918 et l'égalité
      de 1928; mentionner WSPU, NUWSS et suffragistes radicales.
    sources: ["SRC-014", "SRC-001"]
    confidence: "high"
  - existing_id: "uk-ww2"
    issue: >-
      « Résiste seul » ignore l'empire, le Commonwealth et les Alliés;
      « résistance » est inapproprié pour le Royaume-Uni; le Blitz est daté
      approximativement.
    proposal: >-
      Écrire « Le Royaume-Uni et son empire »; préciser 1940–1941, la bataille
      d'Angleterre, le Blitz (septembre 1940–mai 1941), les V1/V2 (1944–1945),
      les îles Anglo-Normandes occupées, le rapport Beveridge (1942) et la
      famine du Bengale (1943).
    sources: ["SRC-012", "SRC-016", "SRC-001"]
    confidence: "high"
  - existing_id: "uk-nhs"
    issue: >-
      « Financé par l'impôt et accessible à tous » simplifie; des charges sont
      introduites dès 1951; le personnel vient aussi du Commonwealth.
    proposal: >-
      Écrire « gratuit au point d'usage, financé principalement par l'impôt »;
      préciser le 5 juillet 1948, Bevan, les charges de 1951, le rôle des
      personnels migrateurs.
    sources: ["SRC-012", "SRC-001"]
    confidence: "high"
  - existing_id: "uk-thatcher"
    issue: >-
      « Tournant néolibéral » est une étiquette interprétative; la date et les
      politiques sont trop compressées.
    proposal: >-
      Préciser le 4 mai 1979, les privatisations des années 1980, le
      monétarisme, la grève des mineurs, la poll tax, la Section 28, la
      démission de novembre 1990; distinguer le programme et ses effets
      régionaux.
    sources: ["SRC-012", "SRC-001"]
    confidence: "high"
  - existing_id: "uk-good-friday"
    issue: >-
      « Met fin à des décennies de conflit » est téléologique; l'accord n'a pas
      mis fin à toute violence et les institutions ont été suspendues.
    proposal: >-
      Écrire « ouvre un processus de paix »; préciser le 10 avril 1998, les
      référendums du 22 mai 1998, l'attentat d'Omagh du 15 août 1998, les
      suspensions de l'Assemblée (2002–2007) et le partage du pouvoir.
    sources: ["SRC-001", "SRC-005"]
    confidence: "high"
  - existing_id: "uk-brexit"
    issue: >-
      Le Brexit est réduit au référendum; le processus 2016–2020, les divisions
      territoriales et le statut de l'Irlande du Nord sont absents.
    proposal: >-
      Décrire le référendum du 23 juin 2016 (51,9 % Leave, 72,2 % de
      participation), le vote écossais et nord-irlandais Remain, l'article 50
      (2017), l'élection de 2019, le retrait du 31 janvier 2020 et la fin de la
      transition du 31 décembre 2020.
    sources: ["SRC-013", "SRC-001"]
    confidence: "high"

