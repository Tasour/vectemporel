    sources: ["SRC-004", "SRC-003"]
  - id: "PLACE-PROP-008"
    label: "Dublin"
    hierarchy: "national"
    why: >-
      Capitale irlandaise, lieu de l'union de 1801, de l'insurrection de 1916 et
      de la partition.
    sources: ["SRC-005", "SRC-001"]
  - id: "PLACE-PROP-009"
    label: "Londres"
    hierarchy: "national"
    why: >-
      Capitale impériale, port, siège du Parlement et lieu de Grunwick, du
