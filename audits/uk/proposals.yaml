    subtitle: "Communautés, femmes et défaite syndicale"
    tags: ["economie", "societe", "politique"]
    importance: 3
    summary: >-
      La grève nationale des mineurs commence le 12 mars 1984 contre les
      fermetures de puits. Elle dure un an et se termine par la défaite du
      National Union of Mineworkers (NUM) en mars 1985. Les groupes Women Against
      Pit Closures organisent le soutien
      aux familles et donnent une visibilité nouvelle aux femmes des communautés
      minières.
    sources: ["SRC-018", "SRC-012"]
    confidence: "high"
    rationale: >-
      Classes populaires; femmes; désindustrialisation; régions hors Londres.
  - id: "PROP-014"
