    period_ids: ["ERA-5", "ERA-6"]
    why: >-
      Auteur du rapport de 1942, il fixe le cadre intellectuel de
      l'État-providence et du NHS.
    sources: ["SRC-012", "SRC-001"]

places:
  - id: "PLACE-PROP-001"
    label: "Manchester"
    hierarchy: "regional"
    why: >-
      Ville cotonnière et lieu de Peterloo, elle permet de sortir d'un récit
      londonien et d'ancrer l'histoire ouvrière.
    sources: ["SRC-007", "SRC-014"]
  - id: "PLACE-PROP-002"
    label: "Liverpool"
    hierarchy: "regional"
    why: >-
      Port atlantique, ville d'immigration irlandaise et point de départ de
      l'approvisionnement en eau de Tryweryn.
    sources: ["SRC-008", "SRC-011"]
  - id: "PLACE-PROP-003"
    label: "Glasgow"
    hierarchy: "regional"
    why: >-
      Chantiers navals, industrie et empire : un lieu clé pour l'Écosse
      industrielle et impériale.
    sources: ["SRC-004", "SRC-009"]
  - id: "PLACE-PROP-004"
    label: "Belfast"
    hierarchy: "regional"
    why: >-
      Ville industrielle et capitale dévolue, au cœur de la partition et de
      l'accord de 1998.
    sources: ["SRC-005", "SRC-001"]
  - id: "PLACE-PROP-005"
    label: "Cardiff"
    hierarchy: "regional"
    why: >-
      Port charbonnier et capitale galloise, elle relie industrialisation,
      grève des mineurs et dévolution.
    sources: ["SRC-006", "SRC-018"]
  - id: "PLACE-PROP-006"
    label: "Bristol"
    hierarchy: "regional"
    why: >-
      Port négrier et lieu de mémoire de l'esclavage, notamment après le
      déboulonnage de la statue de Colston en 2020.
    sources: ["SRC-008", "SRC-012"]
  - id: "PLACE-PROP-007"
    label: "Édimbourg"
    hierarchy: "national"
    why: >-
      Capitale écossaise, lieu de l'union de 1707, des Lumières et du Parlement
