    end_year: 2020
    title: "Brexit"
    subtitle: "Référendum, retrait et accord de commerce"
    tags: ["politique", "economie"]
    importance: 3
    summary: >-
      Le référendum du 23 juin 2016 donne 51,9 % des voix au Leave, avec une
      participation de 72,2 %. Le Royaume-Uni quitte l'Union européenne le
      31 janvier 2020 et termine sa période de transition le 31 décembre 2020.
      Le processus divise le pays et pose la question de l'Irlande du Nord.
    sources: ["SRC-013", "SRC-001"]
    confidence: "high"
    rationale: >-
      Corrige la réduction du Brexit au seul référendum; processus; divisions
      territoriales; l'Écosse et l'Irlande du Nord votent Remain.
  - id: "PROP-018"
    action: "correct"
    existing_id: "uk-nhs"
    year: 1948
    end_year: 1951
    title: "National Health Service"
    subtitle: "Fondation, financement et premières charges"
    tags: ["societe", "sciences"]
    importance: 3
    summary: >-
      Le NHS ouvre le 5 juillet 1948 sous la direction du ministre de la Santé
      Aneurin Bevan, financé principalement par l'impôt et gratuit au point
      d'usage. Des charges pour les prescriptions, les lunettes et les soins
      dentaires sont introduites à partir de 1951. La profession médicale, les
