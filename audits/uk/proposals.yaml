    end_year: 1978
    title: "Grunwick"
    subtitle: "Les ouvrières sud-asiatiques se mettent en grève"
    tags: ["economie", "societe"]
    importance: 2
    summary: >-
      À Willesden, dans le nord de Londres, des ouvrières majoritairement
      sud-asiatiques quittent l'usine Grunwick pour protester contre les
      conditions de travail et demander la reconnaissance syndicale. La grève
      dure de 1976 à 1978 et se termine par une défaite, mais elle transforme la
      place des femmes migrantes dans le mouvement syndical.
    sources: ["SRC-017", "SRC-012"]
    confidence: "high"
    rationale: >-
      Femmes, migration, travail; intersectionnalité; mémoire.
  - id: "PROP-013"
    action: "add"
    existing_id: null
    year: 1984
    end_year: 1985
