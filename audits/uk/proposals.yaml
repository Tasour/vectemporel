    existing_id: null
    year: 1993
    end_year: 1999
    title: "Stephen Lawrence"
    subtitle: "Meurtre raciste et enquête Macpherson"
    tags: ["societe", "politique"]
    importance: 3
    summary: >-
      Stephen Lawrence, adolescent noir, est assassiné à Londres le 22 avril
      1993. L'enquête policière est critiquée; le rapport Macpherson, publié en
      1999, conclut à un racisme institutionnel et recommande des réformes.
      L'affaire devient un moment clé de l'histoire raciale britannique.
    sources: ["SRC-019", "SRC-012"]
    confidence: "high"
    rationale: >-
      Minorités; justice; mémoire; société multiculturelle.
  - id: "PROP-015"
    action: "add"
    existing_id: null
    year: 1997
    end_year: 1999
    title: "Dévolution"
    subtitle: "Parlement écossais et Assemblée galloise"
    tags: ["politique"]
    importance: 3
    summary: >-
      Les référendums du 11 septembre 1997 en Écosse et du 18 septembre 1997 au
      pays de Galles approuvent la création d'un Parlement écossais et d'une
      Assemblée galloise. Les lois de 1998 organisent la dévolution; les
      institutions entrent en fonction en 1999. L'Irlande du Nord reçoit une
      assemblée dans le cadre de l'accord de 1998.
    sources: ["SRC-004", "SRC-006", "SRC-001"]
    confidence: "high"
    rationale: >-
      Écosse et pays de Galles; institutions; corrige le récit centralisé;
      absent.
  - id: "PROP-016"
    action: "add"
    existing_id: null
    year: 1916
    end_year: 1922
    title: "Révolution irlandaise"
    subtitle: "Insurrection, guerre d'indépendance et partition"
    tags: ["guerre", "politique"]
    importance: 3
    summary: >-
      L'insurrection de Pâques 1916, la guerre d'indépendance (1919–1921) et le
      traité anglo-irlandais de 1921 aboutissent à la création de l'État libre
      d'Irlande en 1922. L'Irlande du Nord reste au Royaume-Uni. La partition et
      la guerre civile qui suit structurent durablement l'histoire irlandaise.
    sources: ["SRC-005", "SRC-001"]
    confidence: "high"
    rationale: >-
      Irlande; partition; violence; absent; complète l'accord de 1998.
  - id: "PROP-017"
