periodizations:
  - id: "POL-1"
    label: "Politique: colonies, république, guerre civile, empire, guerre froide, après-guerre froide"
    type: "political"
    start_edtf: "1565"
    end_edtf: "2026"
    rationale: "Récit principal actuel, mais corrigé: la séquence anglaise 1607-1776 est replacée dans une histoire impériale plus large; la Reconstruction est séparée de la guerre civile; l’après-guerre froide est divisé en 1991-2001 et 2001-2026."
    sources: ["SRC-006", "SRC-008", "SRC-009"]
    selected: true
  - id: "SOC-1"
    label: "Sociale et économique: tabac et servitude, esclavage cotonnier, industrialisation, fordisme, désindustrialisation"
    type: "social_economic"
    start_edtf: "1607"
    end_edtf: "2026"
    rationale: "Périodisation alternative centrée sur les régimes de travail: servitude sous contrat, esclavage racial, prolétarisation, syndicalisme, suburbanisation, finance et incarcération de masse."
    sources: ["SRC-007", "SRC-008", "SRC-016"]
    selected: false
  - id: "CULT-1"
    label: "Culturelle, religieuse et environnementale: réveils, réforme, guerre civile, consommation de masse, environnementalisme, climat"
    type: "cultural_religious_environmental"
    start_edtf: "1607"
    end_edtf: "2026"
    rationale: "Périodisation alternative centrée sur les réveils religieux, les mouvements de réforme, la culture de masse et les seuils environnementaux; elle fait apparaître des continuités que la chronologie politique masque."
    sources: ["SRC-013", "SRC-016", "SRC-018", "SRC-020"]
    selected: false

periods:
  - id: "PERIOD-1"
    label: "Colonies atlantiques et empires"
    start_edtf: "1565"
    end_edtf: "1776"
    boundary_type: "political"
    boundary_rationale: "La séquence doit commencer avant Jamestown: Saint Augustine (1565), Santa Fe (1610), établissements français, et histoire autochtone antérieure. La date de 1776 reste la rupture politique."
    alternatives_considered: ["1607 (Jamestown)", "1620 (Mayflower)", "1492"]
    sources: ["SRC-006"]
  - id: "PERIOD-2"
    label: "Indépendance et république esclavagiste"
    start_edtf: "1776"
    end_edtf: "1861"
    boundary_type: "political"
    boundary_rationale: "1776 ouvre la république; 1861 marque la sécession et la guerre. La période est structurée par l’expansion territoriale et l’esclavage."
    alternatives_considered: ["1787 (Constitution)", "1803 (Louisiane)"]
    sources: ["SRC-007", "SRC-008"]
  - id: "PERIOD-3"
    label: "Guerre civile et Reconstruction"
    start_edtf: "1861"
    end_edtf: "1877"
    boundary_type: "military"
    boundary_rationale: "1861-1877 forme une séquence distincte: guerre, émancipation, amendements, occupation militaire et fin de la Reconstruction. La frise actuelle la fond dans 1861-1900."
    alternatives_considered: ["1865 (fin de la guerre)", "1877 (compromis)"]
    sources: ["SRC-008"]
  - id: "PERIOD-4"
    label: "Gilded Age, Jim Crow et empire"
    start_edtf: "1877"
    end_edtf: "1900"
    boundary_type: "political"
    boundary_rationale: "1877 ouvre une période de ségrégation légale, d’industrialisation et d’expansion impériale; 1900 marque l’entrée dans le XXe siècle et la consolidation du domaine insulaire."
    alternatives_considered: ["1890 (frontière)", "1898 (guerre hispano-américaine)"]
    sources: ["SRC-008", "SRC-009", "SRC-010"]
  - id: "PERIOD-5"
    label: "Puissance mondiale"
    start_edtf: "1900"
    end_edtf: "1945"
    boundary_type: "political"
    boundary_rationale: "1900-1945: puissance industrielle, guerres mondiales, crise de 1929, New Deal et bombe atomique. La borne de 1945 est discutable mais structurante."
    alternatives_considered: ["1917 (entrée en guerre)", "1929 (krach)"]
    sources: ["SRC-009", "SRC-016", "SRC-018"]
  - id: "PERIOD-6"
    label: "Guerre froide et droits civiques"
    start_edtf: "1945"
    end_edtf: "1991"
    boundary_type: "political"
    boundary_rationale: "1945-1991: superpuissance, guerre froide, mouvement des droits civiques, Vietnam, course spatiale. La chute de l’URSS en 1991 est la borne."
    alternatives_considered: ["1964 (Civil Rights Act)", "1973 (fin de la guerre du Vietnam)"]
    sources: ["SRC-008", "SRC-017", "SRC-018"]
  - id: "PERIOD-7"
    label: "Après-guerre froide"
    start_edtf: "1991"
    end_edtf: "2001"
    boundary_type: "political"
    boundary_rationale: "1991-2001: hyperpuissance sans rival, mondialisation, mais aussi continuité des interventions et des inégalités. 2001 ouvre une nouvelle séquence."
    alternatives_considered: ["1989 (chute du mur)", "2008 (crise financière)"]
    sources: ["SRC-009"]
  - id: "PERIOD-8"
    label: "Sécurité, crise et polarisation"
    start_edtf: "2001"
    end_edtf: "2026"
    boundary_type: "political"
    boundary_rationale: "2001-2026: guerre globale contre le terrorisme, surveillance, crise de 2008, Katrina, pandémie, protestations raciales et polarisation. La borne finale est ouverte."
    alternatives_considered: ["2008 (crise)", "2020 (COVID-19)", "2021 (Capitole)"]
    sources: ["SRC-020"]

