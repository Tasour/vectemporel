scope:
  territory_current: "Cinquante États, District de Columbia et territoires non incorporés (Porto Rico, Guam, îles Vierges américaines, Samoa américaines, Mariannes du Nord). Les nations autochtones reconnues sont des entités souveraines distinctes, non de simples subdivisions."
  territories_historical:
    - "Treize colonies (1607-1776)"
    - "Louisiane (achat de 1803)"
    - "Floride (traité de 1819)"
    - "Texas (annexion de 1845)"
    - "Oregon (traité de 1846)"
    - "Cession mexicaine (1848)"
    - "Alaska (achat de 1867)"
    - "Hawaï (annexion de 1898, État en 1959)"
    - "Porto Rico, Guam et Philippines (1898; indépendance des Philippines en 1946)"
    - "Zone du canal de Panama (1903-1999)"
    - "Îles Vierges américaines (1917)"
    - "Samoa américaines (1900)"
    - "Mariannes du Nord (covenant de 1975, commonwealth en 1986)"
  regions_autonomous:
    - "Porto Rico (État libre associé, 1952)"
    - "Guam (territoire non incorporé)"
    - "Samoa américaines (territoire non incorporé)"
    - "Îles Vierges américaines (territoire non incorporé)"
    - "Mariannes du Nord (commonwealth, 1986)"
    - "Nations autochtones reconnues (souveraineté tribale)"
  populations_included:
    - "Citoyens des cinquante États et du District de Columbia"
    - "Citoyens portoricains"
    - "Résidents des territoires non incorporés"
    - "Membres des nations autochtones"
    - "Immigrés, réfugiés et personnes sans statut légal"
    - "Personnes réduites en esclavage (histoire)"
    - "Diasporas issues du territoire"
  populations_excluded:
    - "Personnes sans statut légal, souvent comptées mais sans droits politiques"
    - "Personnes incarcérées, privées de vote dans plusieurs États"
    - "Résidents des territoires non incorporés sans droit de vote fédéral complet"
    - "Diasporas hors du territoire, sauf lorsqu’elles agissent sur l’histoire américaine"
  diasporas:
    - "Diaspora afro-américaine"
    - "Diaspora portoricaine"
    - "Diaspora mexicaine et chicano"
    - "Diasporas asiatiques-américaines"
    - "Diaspora hawaïenne"
    - "Expatriés américains"
  temporal:
    start_edtf: "1607"
    end_edtf: "2026"
    start_rationale: "La frise actuelle commence à Jamestown. Cette borne est une convention anglo-coloniale, pas un commencement humain: Saint Augustine (1565), Santa Fe (1610), les établissements français et l’histoire autochtone antérieure sont exclus. L’audit propose soit une borne à 1565, soit un module pré-1607 explicite."
    end_rationale: "2026 est la date de l’audit. La période 2021-2026 doit rester ouverte, factuelle et distinguer les faits établis des controverses."
  unit_of_analysis: "fiche-événement"
  inclusion_criteria:
    - "Événements qui modifient les institutions, les rapports de force, les territoires ou les conditions de vie sur le territoire actuel et ses dépendances."
    - "Processus longs découpés en fiches-processus, avec bornes et mécanismes."
    - "Acteurs collectifs, institutions et populations sans pouvoir, pas seulement les présidents."
    - "Territoires, colonies et populations non citoyennes inclus."
  exclusion_criteria:
    - "Commémorations sans effet historique propre, sauf comme objets de mémoire."
    - "Faits divers non structurants."
    - "Événements strictement étrangers, sauf lorsqu’ils structurent l’histoire américaine."
  audience: ["grand public", "scolaire", "diasporas", "recherche"]
  evidence_threshold: "deux sources indépendantes par fiche, ou exception documentée"

