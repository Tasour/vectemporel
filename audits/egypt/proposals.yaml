periodization:
  current_verdict: "Les cinq ères actuelles sont contiguës et lisibles, mais elles ne sont pas une périodisation savante : l'ère islamique couvre 1 157 ans et agrège des régimes distincts ; l'ère moderne commence en 1798, borne européenne, alors que 1805 et 1882 sont plus structurantes ; l'ère contemporaine confond Nasser, Sadate, Moubarak et la séquence 2011–2013. La trame politique est cohérente mais elle surdétermine les ruptures de souveraineté au détriment des continuités sociales, religieuses et environnementales."
  proposed_changes:
    - action: "keep"
      era_name: "Égypte pharaonique"
      proposal: "Conserver l'ère, expliciter les conventions chronologiques et présenter l'unification comme un processus (fourchette -3200/-3000)."
      rationale: "La profondeur temporelle et la continuité nilotique justifient une ère longue ; les dates dynastiques doivent rester des conventions."
      sources: ["SRC-001"]
    - action: "keep"
      era_name: "Égypte gréco-romaine"
      proposal: "Conserver l'ère, ajouter des sous-repères -30 (annexion romaine) et 451 (Chalcédoine) et distinguer l'hellénisation de la romanisation."
      rationale: "La période est cohérente mais la césure de 641 est conventionnelle ; 451 est une rupture religieuse majeure pour les coptes."
      sources: ["SRC-001", "SRC-006"]
    - action: "split"
      era_name: "Égypte islamique"
      proposal: "Scinder en Égypte islamique médiévale (641–1517) et Égypte ottomane (1517–1798)."
      rationale: "Les Tulunides, Fatimides, Ayyubides et Mamelouks ne se confondent pas avec la province ottomane ; la conquête de 1517 change les élites, la fiscalité et l'insertion impériale."
      sources: ["SRC-007", "SRC-008"]
    - action: "rename"
      era_name: "Égypte moderne"
      proposal: "Renommer Égypte moderne et coloniale (1798–1952) et expliciter que 1798 est une borne européenne, avec 1805 et 1882 comme alternatives."
      rationale: "Muhammad Ali et l'occupation britannique sont des ruptures plus profondes que l'expédition française pour l'État, l'économie et la société."
      sources: ["SRC-010", "SRC-011", "SRC-012"]
    - action: "add"
      era_name: "Égypte contemporaine"
      proposal: "Ajouter des sous-périodes 1952–1970, 1970–1981, 1981–2011 et 2011–2026."
      rationale: "Nasser, Sadate, Moubarak et la séquence post-2011 ont des régimes politiques, des économies et des insertions internationales distincts."
      sources: ["SRC-015", "SRC-019", "SRC-020"]
    - action: "move_boundary"
      era_name: "Égypte contemporaine"
      proposal: "Tester 2011 ou 2013 comme borne de sous-période, sans remplacer 1952 comme borne de l'ère."
      rationale: "La révolution de 2011 et le coup de 2013 sont des ruptures politiques majeures, mais la continuité des institutions militaires et de l'État doit être conservée."
      sources: ["SRC-019", "SRC-020"]

