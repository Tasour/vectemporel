    importance: 3
    summary: "Du 5 au 10 juin 1967, Israël détruit l'aviation égyptienne et occupe le Sinaï et Gaza. Nasser annonce sa démission, puis se maintient sous la pression populaire. Le canal de Suez reste fermé jusqu'en 1975. La défaite transforme la politique égyptienne et la mémoire régionale."
