    importance: 2
    summary: "Le 3 juillet 2013, l'armée dépose Mohamed Morsi, premier président civil élu. Le 14 août, les forces de sécurité dispersent le sit-in de Rabaa al-Adawiya : Human Rights Watch documente au moins 817 morts, probablement plus de 1 000. L'événement clôt la séquence ouverte en 2011 et devient un lieu de mémoire contesté."
