    summary: "Les 18 et 19 janvier 1977, l'annonce de hausses de prix sur plusieurs produits subventionnés déclenche des émeutes dans la plupart des grandes villes. L'armée est déployée ; les estimations de morts vont de 77 à plusieurs centaines. Le gouvernement annule les mesures. L'épisode révèle le coût social de l'infitah."
