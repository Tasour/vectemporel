review:
  status: "draft"
  unresolved:
    - "Date exacte et qualification de la bataille de Guadalete (juillet 711) : les sources divergent sur le jour."
    - "Historicity de Covadonga : la tradition de 722 n'est pas contemporaine."
    - "Nombre de Juifs expulsés en 1492 : les estimations varient fortement."
    - "Nombre de Morisques expulsés (1609-1614) : les estimations varient selon les régions."
    - "Nombre de victimes de la Grande Rafle de 1749 : les chiffres de 9 000 à 12 000 circulent."
    - "Bilan exact de l'esclavage et de l'abolition à Cuba : nécessite une source spécialisée supplémentaire."
    - "Frontière entre autoritarisme et fascisme pour le franquisme : débat historiographique non tranché."
    - "Bilan mémoriel de la transition : les thèses de l'amnésie et du pacte de silence sont discutées."
    - "Articulation entre mémoire catalane, mémoire basque et mémoire nationale : nécessite un second lecteur."
    - "Sources absentes pour l'histoire des femmes avant 1931 et après 1975, pour les sciences et pour l'environnement médiéval."
