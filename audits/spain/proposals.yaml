periodization:
  current_verdict: "La périodisation actuelle est lisible mais politique et téléologique : 711 efface l'histoire antérieure, 1492 confond trois événements, 1808, 1936 et 1975 sont des bornes politiques, et les 781 ans d'Al-Andalus sont traités comme un bloc."
  proposed_changes:
    - action: "add"
      era_name: "Prologue"
      proposal: "Ajouter une ère -218/711 : Ibérie préromaine, Hispania romaine et royaume wisigoth."
      rationale: "La borne de 711 coupe l'histoire ibérique et fait d'al-Andalus une simple étape de la Reconquista. Un prologue documenté restaure les continuités romaines et wisigothes."
      sources: ["SRC-001", "SRC-002"]
    - action: "split"
      era_name: "Al-Andalus & Reconquista"
      proposal: "Scinder 711-1212 (émirat, califat, taïfas, royaumes chrétiens) et 1212-1492 (grande Reconquista, royaume nasride, Castille et Aragon)."
      rationale: "La période actuelle couvre 781 ans et mêle des systèmes politiques très différents ; la bataille de Las Navas de Tolosa (1212) constitue une charnière militaire et territoriale."
      sources: ["SRC-001", "SRC-003"]
    - action: "rename"
      era_name: "Al-Andalus & Reconquista"
      proposal: "Renommer « Al-Andalus et royaumes chrétiens »."
      rationale: "« Reconquista » est un concept historiographique téléologique ; le renommer ne nie pas les conflits, mais évite d'en faire une origine nationale."
      sources: ["SRC-001", "SRC-004"]
    - action: "split"
      era_name: "Empire espagnol"
      proposal: "Scinder 1492-1700 (Habsbourg) et 1700-1808 (Bourbons, réformes, Lumières)."
      rationale: "L'empire des Habsbourg et la monarchie bourbonienne n'ont ni la même fiscalité, ni la même politique étrangère, ni les mêmes élites."
      sources: ["SRC-008"]
    - action: "split"
      era_name: "Crises & nation"
      proposal: "Scinder 1808-1874 (révolution libérale, guerres carlistes) et 1874-1936 (Restauration, masse politique, République)."
      rationale: "La construction de l'État libéral et la crise de la Restauration sont deux séquences distinctes, avec des acteurs et des conflits propres."
      sources: ["SRC-011"]
    - action: "rename"
      era_name: "Crises & nation"
      proposal: "Renommer « Révolution libérale et nation en crise »."
      rationale: "« Crises & nation » est vague et ne dit pas que la période est d'abord celle de la construction de l'État libéral et de ses contestations."
      sources: ["SRC-011"]
    - action: "split"
      era_name: "Guerre civile & franquisme"
      proposal: "Scinder 1936-1939 (guerre civile) et 1939-1975 (franquisme)."
      rationale: "La guerre et la dictature n'ont ni les mêmes temporalités, ni les mêmes acteurs, ni les mêmes sources ; les fusionner brouille l'analyse de la répression et de la transition."
      sources: ["SRC-013", "SRC-014"]
    - action: "split"
      era_name: "Démocratie"
      proposal: "Scinder 1975-1986 (transition, Constitution, OTAN/CEE) et 1986-2026 (consolidation européenne, crises, 15-M, Catalogne)."
      rationale: "La transition et l'Espagne européenne sont deux séquences distinctes ; la seconde est marquée par la décentralisation, la croissance, puis la crise de 2008."
      sources: ["SRC-015", "SRC-018"]
    - action: "move_boundary"
      era_name: "Démocratie"
      proposal: "Conserver 1975 comme borne de la transition, mais ajouter 1978 comme borne constitutionnelle interne."
      rationale: "1975 est la mort de Franco ; 1978 est l'adoption de la Constitution. Les deux dates n'ont pas la même fonction et ne doivent pas être confondues."
      sources: ["SRC-015", "SRC-011"]
    - action: "keep"
      era_name: "Ensemble"
      proposal: "Conserver les cinq grandes scansions comme récit principal, avec les sous-périodes proposées."
      rationale: "La structure actuelle reste lisible pour le grand public ; les sous-périodes corrigent la téléologie sans imposer une refonte complète."
      sources: ["SRC-011", "SRC-015"]

