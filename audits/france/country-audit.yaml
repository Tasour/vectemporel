schema_version: '1.0'
country:
  id: france
  iso2: FR
  iso3: FRA
  name_current: France
  names_historical:
  - Gaules
  - Francie occidentale
  - Royaume de France
  - République française
  - Empire français
  - État français (1940-1944)
  flag: 🇫🇷
scope:
  territory_current: France métropolitaine et départements et régions d'outre-mer (Guadeloupe, Martinique, Guyane, La Réunion,
    Mayotte), collectivités d'outre-mer ; frontières de 2026.
  territories_historical:
  - Gaules indépendantes et romaines
  - royaumes francs, Francie occidentale, royaume de France
  - 'empire colonial français : Algérie (1830-1962), Indochine, Afrique subsaharienne, Caraïbes, océan Indien, Pacifique'
  - protectorats du Maroc et de la Tunisie, mandats de Syrie et du Liban
  - Territoires d'outre-mer et départements d'outre-mer après 1946
  regions_autonomous:
  - Aucune région autonome au sens constitutionnel ; collectivités d'outre-mer à statuts spécifiques, dont la Nouvelle-Calédonie
    et la Polynésie française.
  populations_included:
  - nationaux
  - résidents étrangers
  - descendants de migrations
  - populations ultramarines
  - diasporas
  - rapatriés et anciens colonisés
  populations_excluded:
  - populations des territoires anciennement colonisés lorsqu'elles ne sont liées à aucun événement français daté ; leur inclusion
    permanente exigerait une autre échelle (empire, monde)
  - diasporas hors de France sans lien explicite avec un événement français
  diasporas:
  - diasporas françaises à l'étranger
  - diasporas issues des migrations algérienne, marocaine, tunisienne, portugaise, italienne, espagnole, subsaharienne, asiatique
    et antillaise
  - diasporas juive et arménienne
  - huguenots
  temporal:
    start_edtf: '-600'
    end_edtf: '2026'
    start_rationale: 'Fondation de Massalia par des Grecs de Phocée : premier repère d''une présence grecque durable en Gaule.
      Ce choix est régional, pas national ; il ne présuppose pas une « France » antique.'
    end_rationale: Date de l'audit (2026-11-13) ; période récente ouverte, non close, à réviser à chaque version.
  unit_of_analysis: fiche-événement
  inclusion_criteria:
  - événements datés qui modifient les institutions, les rapports sociaux, les savoirs, les territoires ou les mémoires
  - acteurs collectifs et institutions
  - processus découpés en repères datés
  - événements coloniaux et transnationaux liés à la France
  exclusion_criteria:
  - anecdotes sans portée structurelle
  - dates sans source
  - commémorations non distinguées de l'événement commémoré
  - frontières modernes rétroprojetées
  audience:
  - grand public
  - scolaire
  - diasporas
  - recherche
  evidence_threshold: deux sources indépendantes par fiche, ou exception documentée
