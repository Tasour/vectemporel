claims:
- id: CLAIM-001
  subject: Trente Glorieuses
  predicate: périodisation
  object: 1946-1975
  text: L'expression « Trente Glorieuses » désigne la période de croissance de 1946 à 1975, et non l'ensemble 1945-1989.
  confidence: certain
  sources:
  - SRC-019
  revisions: []
- id: CLAIM-002
  subject: Rafle du Vél' d'Hiv
  predicate: responsabilité
  object: police française et Vichy
  text: La rafle des 16-17 juillet 1942 a été organisée par la police française sous l'autorité de Vichy, en lien avec l'occupant
    allemand.
  confidence: certain
  sources:
  - SRC-008
  - SRC-009
  revisions: []
- id: CLAIM-003
  subject: 17 octobre 1961
  predicate: répression
  object: manifestation du FLN
  text: La manifestation du FLN du 17 octobre 1961 à Paris a été réprimée par la police parisienne ; le bilan exact reste
    disputé.
  confidence: disputed
  sources:
  - SRC-011
  revisions: []
- id: CLAIM-004
  subject: Indépendance algérienne
  predicate: effet
  object: nationalité et citoyenneté françaises
  text: L'indépendance algérienne de 1962 a transformé la nationalité, la citoyenneté et la définition de la France.
  confidence: certain
  sources:
  - SRC-012
  revisions: []
- id: CLAIM-005
  subject: Loi Neuwirth
  predicate: portée
  object: contraception
  text: La loi du 28 décembre 1967 autorise la contraception mais ne garantit pas un accès universel.
  confidence: probable
  sources:
  - SRC-014
  revisions: []
- id: CLAIM-006
  subject: Loi Veil
  predicate: portée
  object: IVG
  text: La loi du 17 janvier 1975 autorise l'IVG sous conditions et pour une durée limitée ; elle ne constitue pas une dépénalisation
    absolue.
  confidence: certain
  sources:
  - SRC-014
  revisions: []
- id: CLAIM-007
  subject: Exposition coloniale de 1931
  predicate: représentation
  object: empire français
  text: L'Exposition coloniale internationale de 1931 a produit une représentation hiérarchisée et paternaliste de l'empire.
  confidence: certain
  sources:
  - SRC-007
  revisions: []
- id: CLAIM-008
  subject: Loi constitutionnelle de 2024
  predicate: garantie
  object: IVG
  text: La loi constitutionnelle du 8 mars 2024 garantit la liberté de recourir à l'interruption volontaire de grossesse.
  confidence: certain
  sources:
  - SRC-020
  revisions: []
- id: CLAIM-009
  subject: Plan Schuman
  predicate: interprétation
  object: construction européenne
  text: Le plan Schuman de 1950 est une étape de la construction européenne ; son sens est disputé entre fédéralisme et consolidation
    des États-nations.
  confidence: disputed
  sources:
  - SRC-010
  revisions: []
- id: CLAIM-010
  subject: Affaire de Creil
  predicate: effet
  object: débat sur la laïcité
  text: L'affaire des foulards de Creil, en octobre 1989, a ouvert un débat durable sur la laïcité, l'islam et le genre à
    l'école.
  confidence: certain
  sources:
  - SRC-017
  - SRC-015
  revisions: []
- id: CLAIM-011
  subject: Révoltes de 2005
  predicate: causes
  object: banlieues
  text: Les révoltes de 2005 ont des causes multiples (ségrégation, chômage, contrôles policiers, racisme) ; les réduire à
    une seule « crise des banlieues » est réducteur.
  confidence: disputed
  sources:
  - SRC-016
  - SRC-015
  revisions: []
- id: CLAIM-012
  subject: Code noir
  predicate: portée
  object: esclavage colonial
  text: L'édit de mars 1685, dit Code noir, organise juridiquement l'esclavage dans les colonies françaises et en fait un
    instrument de police et de discipline.
  confidence: certain
  sources:
  - SRC-002
  revisions: []
