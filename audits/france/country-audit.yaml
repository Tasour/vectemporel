historiography:
  schools:
  - Annales et histoire de la longue durée (Braudel, Febvre, Bloch)
  - histoire sociale et histoire populaire (Labrousse, Soboul, Noiriel, Zancarini-Fournel)
  - histoire culturelle et des représentations (Chartier, Ariès, Darnton)
  - histoire des femmes et du genre (Perrot, Scott, Thébaud)
  - histoire coloniale et postcoloniale (Ageron, Stora, Shepard, Mbembe)
  - histoire globale et connectée (Subrahmanyam, Bayly)
  - histoire environnementale (Bess, Charvolin, Pearson)
  - histoire de la mémoire (Nora, Rousso)
  national_narratives:
  - 'roman national républicain : Gaule → Clovis → Charlemagne → 1789 → République'
  - récit de la grandeur et de l'exception française
  - récit de la décadence et du déclin
  - récit européen de la construction de la paix
  - récit colonial de la « mission civilisatrice »
  counter_narratives:
  - régionalismes bretons, corses, occitans, alsaciens
  - histoires des colonisés, des immigrés et des outre-mer
  - histoire des femmes et des minorités sexuelles
  - histoire ouvrière et des classes populaires
  - mémoires de Vichy, de la Shoah, de l'Algérie et de l'esclavage
  structuring_debates:
  - 'périodisation : 476, 1492, 1610, 1789, 1815, 1914, 1945, 1989'
  - place de la Révolution et de la Terreur
  - Vichy, la collaboration et la Résistance
  - guerre d'Algérie, torture et mémoire
  - colonialisme, esclavage et lois mémorielles
  - laïcité, islam et liberté d'expression
  - 'Trente Glorieuses : bornes, contenu et fin'
  blind_spots:
  - femmes et genre
  - minorités religieuses et ethniques
  - peuples colonisés
  - classes populaires rurales et urbaines
  - handicap
  - migrations
  - environnement
  - outre-mer
  - diasporas
  - histoire LGBTQ+
  key_syntheses:
  - SRC-001
  - SRC-003
  - SRC-010
  - SRC-012
  - SRC-013
  - SRC-015
  - SRC-019
periodizations:
- id: POL-1
  label: 'Périodisation politique dominante : neuf ères, de Massalia à la Ve République'
  type: political
  start_edtf: '-600'
  end_edtf: '2026'
  rationale: 'Suite de ruptures politiques et militaires : -600, 476, 1492, 1610, 1789, 1815, 1914, 1945, 1989. Elle est lisible
    mais téléologique et eurocentrée : 1492 et 1989 ne sont pas des ruptures françaises, et 1945-1989 mélange reconstruction,
    Trente Glorieuses et crises.'
  sources:
  - SRC-001
  - SRC-019
  selected: true
- id: SOC-1
  label: 'Périodisation sociale et économique : société agraire, industrialisation, société salariale, précarisation'
  type: social_economic
  start_edtf: '-600'
  end_edtf: '2026'
  rationale: 'Bornes candidates : fin de l''Antiquité, seuil démographique et agricole médiéval, révolution industrielle 1830-1880,
    apogée de la société salariale 1945-1975, chômage de masse après 1975. Elle déplace la césure de 1789 vers 1830/1880 et
    conteste 1989.'
  sources:
  - SRC-019
  - SRC-014
  selected: false
- id: CULT-1
  label: 'Périodisation culturelle, religieuse et environnementale : romanisation, christianisation, confessionnalisation,
    sécularisation, écologisation'
  type: cultural_religious_environmental
  start_edtf: '-600'
  end_edtf: '2026'
  rationale: 'Bornes candidates : 496 (baptême de Clovis), 1562-1598 (guerres de Religion), 1685 (révocation et Code noir),
    1905 (séparation), 1960-1970 (essor de l''écologie). Elle fait apparaître des continuités que les césures politiques masquent.'
  sources:
  - SRC-001
  - SRC-013
  - SRC-017
  selected: false
periods:
- id: ERA-1
  label: Antiquité
  start_edtf: '-600'
  end_edtf: '476'
  boundary_type: political
  boundary_rationale: 'Borne de début : fondation de Massalia. Borne de fin : 476, convention européenne (fin de l''Empire
    romain d''Occident), qui ne correspond pas à une rupture gauloise ; 486 (Soissons) serait plus pertinent pour le royaume
    franc.'
  alternatives_considered:
  - 486 (Soissons)
  - -52 (Alésia)
  - 476 (fin de l'Empire d'Occident)
  sources:
  - SRC-001
- id: ERA-2
  label: Moyen Âge
  start_edtf: '476'
  end_edtf: '1492'
  boundary_type: political
  boundary_rationale: 'Borne de début : 476, convention. Borne de fin : 1492, événement ibérique et atlantique, non français
    ; les alternatives françaises sont 1453 (fin de la guerre de Cent Ans), 1494 (guerres d''Italie) ou 1515 (Marignan).'
  alternatives_considered:
  - '1453'
  - '1494'
  - '1515'
  sources:
  - SRC-001
- id: ERA-3
  label: Renaissance
  start_edtf: '1492'
  end_edtf: '1610'
  boundary_type: cultural
  boundary_rationale: 'Borne de début importée de l''histoire européenne ; 1492 ne structure pas l''histoire française. Borne
    de fin : 1610 (assassinat d''Henri IV), qui ouvre une période de régence puis de consolidation monarchique. Alternatives
    : 1515, 1539, 1562.'
  alternatives_considered:
  - 1515 (Marignan)
  - 1539 (Villers-Cotterêts)
  - 1562 (guerres de Religion)
  sources: []
- id: ERA-4
  label: Grand Siècle & Lumières
  start_edtf: '1610'
  end_edtf: '1789'
  boundary_type: political
  boundary_rationale: 'Label discutable : il fusionne l''absolutisme louis-quatorzien et les Lumières, deux moments distincts.
    Alternatives : 1661 (gouvernement personnel de Louis XIV), 1715 (mort de Louis XIV), 1750 (milieu des Lumières).'
  alternatives_considered:
  - '1661'
  - '1715'
  - '1750'
  sources:
  - SRC-002
- id: ERA-5
  label: Révolution & Empire
  start_edtf: '1789'
  end_edtf: '1815'
  boundary_type: political
  boundary_rationale: 'Borne de début : 1789, rupture politique majeure. Borne de fin : 1815 (Waterloo, Restauration), conventionnelle
    ; alternatives 1792 (République), 1799 (Brumaire), 1804 (Empire).'
  alternatives_considered:
  - '1792'
  - '1799'
  - '1804'
  sources:
  - SRC-003
  - SRC-002
- id: ERA-6
  label: XIXe siècle
  start_edtf: '1815'
  end_edtf: '1914'
  boundary_type: political
  boundary_rationale: 'Borne de début : 1815, Restauration. Borne de fin : 1914, entrée en guerre. Le « long XIXe siècle »
    peut commencer en 1789 ; la période couvre industrialisation, colonisation et laïcisation.'
  alternatives_considered:
  - 1789-1914
  - '1830'
  - '1870'
  sources:
  - SRC-004
  - SRC-005
  - SRC-006
- id: ERA-7
  label: Guerres mondiales
  start_edtf: '1914'
  end_edtf: '1945'
  boundary_type: military
  boundary_rationale: 'Label qui réduit l''entre-deux-guerres à une préparation de 1939. Alternatives : scinder 1914-1918,
    1919-1939, 1939-1945 ; ou renommer « Guerres, crises et occupations ».'
  alternatives_considered:
  - 1914-1918 / 1919-1939 / 1939-1945
  sources:
  - SRC-007
  - SRC-008
  - SRC-009
- id: ERA-8
  label: Trente Glorieuses
  start_edtf: '1945'
  end_edtf: '1989'
  boundary_type: economic
  boundary_rationale: 'Label anachronique : Fourastié forge « Trente Glorieuses » pour 1946-1975. La borne 1989 est européenne,
    pas française. Alternatives : 1945-1975 (expansion), 1975-1989 (crises), 1945-1958 (IVe République), 1958-1989 (Ve République).'
  alternatives_considered:
  - 1945-1975 / 1975-1989
  - 1945-1958 / 1958-1989
  sources:
  - SRC-010
  - SRC-011
  - SRC-012
  - SRC-013
  - SRC-014
  - SRC-019
- id: ERA-9
  label: Temps présents
  start_edtf: '1989'
  end_edtf: '2026'
  boundary_type: political
  boundary_rationale: 'Borne de début : 1989 (chute du mur de Berlin), événement européen ; aucun repère français n''est daté
    de 1989 dans la frise, alors que l''affaire de Creil (octobre 1989) est un repère français. Alternatives : 1981 (alternance),
    1992 (Maastricht), 1995 (Chirac), 2002 (euro), 2015 (attentats).'
  alternatives_considered:
  - '1981'
  - '1992'
  - '1995'
  - '2002'
  - '2015'
  sources:
  - SRC-015
  - SRC-016
  - SRC-017
  - SRC-018
  - SRC-020
