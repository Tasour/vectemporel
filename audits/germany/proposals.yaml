periodization:
  current_verdict: >-
    Les six ères actuelles sont cohérentes mais trop larges et partiellement
    téléologiques. 1517–1815 mélange la Réforme, la guerre de Trente Ans et les
    Lumières ; 1815–1914 confond le Vormärz, la révolution de 1848 et l’Empire
    de 1871 ; 1914–1945 place Weimar sous le signe de la guerre ; 1945–1990
    commence avant la fondation des deux États. La borne de 962 est une
    convention rétrospective, non la naissance d’un État allemand.
  proposed_changes:
    - action: "keep"
      era_name: "Saint-Empire"
      proposal: >-
        Conserver la borne 962 comme convention documentée, mais renommer l’ère
        « Reich médiéval (962–1517) » et préciser que l’Empire est composite
        (royaumes de Germanie, d’Italie, de Bourgogne) et que les titulatures
        « saint », « romain » et « de la nation allemande » sont postérieures.
      rationale: >-
        Éviter de projeter un État national allemand sur neuf siècles d’histoire
        impériale et rendre la borne discutable.
      sources: ["SRC-001"]
    - action: "split"
      era_name: "Réforme & guerres"
      proposal: >-
        Scinder à 1648 en « Réforme et guerre de Trente Ans (1517–1648) » et
        « Lumières, absolutisme et réformes (1648–1815) ».
      rationale: >-
        1648 est une rupture politique, religieuse et démographique majeure ;
        1517–1815 est trop long pour être une seule ère.
      sources: ["SRC-002", "SRC-003"]
    - action: "split"
      era_name: "Unification"
      proposal: >-
        Scinder à 1871 en « Vers l’unité (1815–1871) » et « Empire allemand
        (1871–1914) ».
      rationale: >-
        La Confédération germanique, le Vormärz et 1848 ne sont pas l’Empire de
        Bismarck ; 1871 est une borne politique et militaire documentée.
      sources: ["SRC-004", "SRC-005"]
    - action: "split"
      era_name: "Guerres & divisions"
      proposal: >-
        Scinder à 1933 en « Guerre, révolution et Weimar (1914–1933) » et
        « Nazisme et guerre (1933–1945) ».
      rationale: >-
        Weimar n’est pas seulement un entre-deux-guerres : c’est une séquence
        politique et culturelle autonome, suivie d’une dictature distincte.
      sources: ["SRC-006", "SRC-007"]
    - action: "rename"
      era_name: "Deux Allemagnes"
      proposal: >-
        Renommer « Occupation et deux Allemagnes (1945–1990) » pour inclure
        l’occupation alliée et la fondation des deux États en 1949.
      rationale: >-
        La RFA et la RDA ne naissent pas en 1945 ; la période 1945–1949 est
        structurante (dénazification, partitions, expulsions).
      sources: ["SRC-010", "SRC-015"]
    - action: "keep"
      era_name: "Allemagne réunifiée"
      proposal: >-
        Conserver 1990–2026, avec des bornes internes indicatives (2005, 2015,
        2022) sans créer de nouvelles ères.
      rationale: >-
        La période est courte et hétérogène ; des bornes internes suffisent.
      sources: ["SRC-012", "SRC-014"]
    - action: "add"
      era_name: "Fil transversal — migrations"
      proposal: >-
        Ajouter un fil non chronologique : Ruhrpolen, travail forcé, expulsions
        de 1945, Gastarbeiter, réfugiés de 2015 et de 2022.
      rationale: >-
        Les migrations traversent toutes les ères et sont aujourd’hui un angle
        mort majeur de la frise.
      sources: ["SRC-009", "SRC-015"]
    - action: "add"
      era_name: "Fil transversal — environnement"
      proposal: >-
        Ajouter un fil non chronologique : aménagement des rivières, pollution
        industrielle, antinucléarisme, Energiewende.
      rationale: >-
        L’environnement est absent de la frise alors qu’il structure des
        conflits politiques et sociaux depuis le XIXe siècle.
      sources: ["SRC-014"]

events:
  - id: "PROP-001"
    action: "add"
    existing_id: null
    year: 1517
    end_year: 1555
    title: "Les 95 thèses et la Réforme"
    subtitle: "Une controverse théologique devient une rupture européenne"
    tags: ["religion", "societe"]
    importance: 3
    summary: >-
      Le 31 octobre 1517, Luther adresse ses thèses sur les indulgences à
      l’archevêque de Mayence et à l’évêque de Brandebourg ; leur diffusion
      imprimée ouvre la Réforme. L’affichage à la porte de la Schlosskirche
      n’est pas attesté par un témoin oculaire. La paix d’Augsbourg (1555)
      stabilise provisoirement la coexistence confessionnelle dans l’Empire.
    sources: ["SRC-002", "SRC-016"]
    confidence: "high"
    rationale: >-
      Le repère de-luther réduit la Réforme à un acte individuel ; cette fiche
      restitue le processus, la circulation imprimée et l’incertitude sur
      l’affichage.

  - id: "PROP-002"
    action: "add"
    existing_id: null
    year: 1524
    end_year: 1525
    title: "Guerre des Paysans"
    subtitle: "Révolte agraire et répression dans l’Empire"
    tags: ["guerre", "religion", "societe"]
    importance: 2
    summary: >-
      Entre 1524 et 1525, des paysans et des artisans se soulèvent dans
      plusieurs territoires de l’Empire ; Thomas Müntzer joue un rôle à
      Mühlhausen. Les princes écrasent le mouvement et Luther condamne la
      révolte. L’épisode montre que la Réforme est aussi une crise sociale.
    sources: ["SRC-002"]
    confidence: "high"
    rationale: >-
      Comble le vide social de la période 1517–1815 et évite de réduire la
      Réforme à Luther.

  - id: "PROP-003"
    action: "add"
    existing_id: null
    year: 1618
    end_year: 1648
    title: "Guerre de Trente Ans"
    subtitle: "Une guerre européenne dans l’Empire"
    tags: ["guerre", "religion"]
    importance: 3
    summary: >-
      La défenestration de Prague (1618) ouvre un conflit qui implique les
      Habsbourg, les princes allemands, le Danemark, la Suède et la France. Les
      populations de l’Empire subissent pillages, épidémies et famines ; les
      traités de Westphalie (1648) redéfinissent l’ordre impérial et européen.
    sources: ["SRC-003"]
    confidence: "high"
    rationale: >-
      Corrige le cadrage uniquement « allemand » et donne une borne de période
      mieux justifiée que 1815.

  - id: "PROP-004"
    action: "add"
    existing_id: null
    year: 1848
    end_year: 1849
    title: "Assemblée nationale de Francfort"
    subtitle: "Le parlement de la Paulskirche et ses exclus"
    tags: ["politique", "societe"]
    importance: 3
    summary: >-
      Le 18 mai 1848, environ 600 députés entrent à la Paulskirche. Ils
      rédigent une constitution et des droits fondamentaux, mais les femmes
      sont exclues du vote et de la représentation ; Louise Otto-Peters
      intervient publiquement sur la condition des ouvrières. La constitution
      est adoptée en mars 1849 et Frédéric-Guillaume IV refuse la couronne
      impériale.
    sources: ["SRC-004", "SRC-017"]
    confidence: "high"
    rationale: >-
      Le repère de-1848 est juste mais masculin et parlementaire ; cette fiche
      intègre les exclusions de genre et le mouvement ouvrier.

  - id: "PROP-005"
    action: "add"
    existing_id: null
    year: 1863
    end_year: 1891
    title: "Naissance de la social-démocratie allemande"
    subtitle: "De l’ADAV au programme d’Erfurt"
    tags: ["politique", "economie", "societe"]
    importance: 3
    summary: >-
      L’ADAV de Ferdinand Lassalle est fondé à Leipzig en 1863 ; le SDAP de
      Bebel et Liebknecht en 1869 ; les deux courants fusionnent à Gotha en
      1875. La loi antisocialiste (1878–1890) réprime le parti, qui se renforce
      et adopte le programme d’Erfurt en 1891. La social-démocratie devient la
      principale force de la gauche allemande et l’un des plus grands partis
      socialistes d’Europe.
    sources: ["SRC-005"]
    confidence: "high"
    rationale: >-
      La frise ne documente pas le mouvement ouvrier organisé, pourtant central
      dans l’histoire allemande des XIXe et XXe siècles.

  - id: "PROP-006"
    action: "add"
    existing_id: null
    year: 1865
    end_year: null
    title: "Fondation de l’ADF"
    subtitle: "La première organisation nationale du mouvement féministe allemand"
    tags: ["societe"]
    importance: 2
    summary: >-
      En octobre 1865, une conférence réunit des femmes à Leipzig ;
      l’Allgemeiner Deutscher Frauenverein est fondé le 18 octobre. Louise
      Otto-Peters en devient présidente, avec Auguste Schmidt comme
      vice-présidente. Le programme porte sur l’éducation, l’accès aux métiers
      et à l’université, et le droit des femmes au travail.
    sources: ["SRC-017"]
    confidence: "high"
    rationale: >-
      Ajoute une histoire des femmes organisée, au-delà du seul droit de vote
      de 1918.

  - id: "PROP-007"
    action: "add"
    existing_id: null
    year: 1904
    end_year: 1908
    title: "Génocide des Herero et Nama"
    subtitle: "La guerre coloniale du Sud-Ouest africain"
    tags: ["guerre", "societe"]
    importance: 3
    summary: >-
      Dans le Sud-Ouest africain allemand (aujourd’hui Namibie), les troupes du
      général Lothar von Trotha mènent une guerre d’extermination contre les
      Herero et les Nama. Les historiens estiment à environ 65 000 les Herero
      et au moins 10 000 les Nama tués. En 2021, le gouvernement allemand
      qualifie ces événements de génocide « d’aujourd’hui » et annonce son
      intention de demander pardon, sans reconnaissance juridique de
      réparations.
    sources: ["SRC-013", "SRC-020"]
    confidence: "high"
    rationale: >-
      La mémoire coloniale est absente de la frise ; ce repère relie l’histoire
      impériale allemande aux débats contemporains.

  - id: "PROP-008"
    action: "add"
    existing_id: null
    year: 1918
    end_year: 1919
    title: "Droit de vote des femmes"
    subtitle: "Une conquête de la révolution de novembre"
    tags: ["societe", "politique"]
    importance: 3
    summary: >-
      Le Conseil des commissaires du peuple annonce le 12 novembre 1918 le
      droit de vote et d’éligibilité des femmes ; la loi électorale du
      30 novembre 1918 le met en œuvre. Aux élections du 19 janvier 1919,
      82 % des électeurs et électrices votent et 37 femmes entrent à
      l’Assemblée nationale. Le droit est ensuite inscrit dans la Constitution
      de Weimar.
    sources: ["SRC-006"]
    confidence: "high"
    rationale: >-
      Le droit de vote des femmes est un repère majeur, absent de la frise ; il
      ne se confond pas avec la fondation de la République.

  - id: "PROP-009"
    action: "add"
    existing_id: null
    year: 1935
    end_year: null
    title: "Lois de Nuremberg"
    subtitle: "La dégradation juridique des Juifs"
    tags: ["politique", "societe"]
    importance: 3
    summary: >-
      Adoptées le 15 septembre 1935 lors du congrès du parti nazi, la loi sur la
      citoyenneté du Reich et la loi sur la protection du sang allemand
      retirent aux Juifs la citoyenneté pleine et interdisent les mariages et
      relations sexuelles entre Juifs et « Allemands ». Les décrets
      d’application de novembre 1935 précisent les catégories raciales. Ces lois
      juridicisent l’exclusion avant l’extermination.
    sources: ["SRC-007"]
    confidence: "high"
    rationale: >-
      La frise passe de 1933 à la guerre sans montrer la construction juridique
      de la persécution.

  - id: "PROP-010"
    action: "add"
    existing_id: null
    year: 1939
    end_year: 1945
    title: "Travail forcé dans le Reich nazi"
    subtitle: "Douze millions de travailleurs déportés"
    tags: ["economie", "guerre", "societe"]
    importance: 3
    summary: >-
      À partir de 1939, le régime nazi déporte vers le Reich des millions de
      civils, de prisonniers de guerre et de détenus de camps. Les estimations
      retiennent plus de 12 millions de personnes, avec un pic de 7,8 millions
      en août 1944. Les travailleurs polonais et soviétiques sont soumis à une
      ségrégation et à une violence spécifiques ; des entreprises allemandes en
      profitent.
    sources: ["SRC-008"]
    confidence: "high"
    rationale: >-
      Le travail forcé est un angle mort majeur : il relie économie, guerre,
      racisme et mémoire des victimes.

  - id: "PROP-011"
    action: "add"
    existing_id: null
    year: 1941
    end_year: 1945
    title: "La Shoah"
    subtitle: "L’extermination des Juifs d’Europe"
    tags: ["guerre", "societe"]
    importance: 3
    summary: >-
      Après l’invasion de l’URSS en juin 1941, les unités mobiles et les centres
      d’extermination organisent le meurtre de masse ; la conférence de Wannsee
      (20 janvier 1942) coordonne l’administration d’un génocide déjà engagé.
      Environ six millions de Juifs d’Europe sont assassinés. Le protocole
      d’Adolf Eichmann et les archives des camps documentent la planification
      bureaucratique de l’extermination.
    sources: ["SRC-007"]
    confidence: "high"
    rationale: >-
      La frise mentionne la Shoah dans le résumé de de-ww2 mais ne lui donne
      aucune fiche propre ; ce processus restitue la chronologie, l’échelle et
      la bureaucratie du génocide.

  - id: "PROP-012"
    action: "add"
    existing_id: null
    year: 1944
    end_year: null
    title: "Liquidation du camp des familles rom à Auschwitz-Birkenau"
    subtitle: "Le Porajmos et sa mémoire"
    tags: ["guerre", "societe"]
    importance: 3
    summary: >-
      Dans la nuit du 2 au 3 août 1944, la SS assassine environ 4 300 Sinti et
      Roma du « camp des familles » d’Auschwitz-Birkenau. Environ 21 000 des
      23 000 Sinti et Roma déportés à Auschwitz y sont morts. Les estimations
      du génocide européen varient de 250 000 à 500 000 victimes. La date est
      devenue le jour européen de commémoration du Porajmos.
    sources: ["SRC-018"]
    confidence: "high"
    rationale: >-
      Les Sinti et Roma sont absents de la frise, alors que leur génocide est
      documenté et commémoré.

  - id: "PROP-013"
