corrections:
  - existing_id: "de-otto"
    issue: >-
      Le titre « Naissance du Saint-Empire » et le résumé font de 962 la
      fondation d’un Empire allemand.
    proposal: >-
      Reformuler : couronnement impérial d’Otton Ier à Rome le 2 février 962 ;
      l’Empire est composite et les titulatures « saint », « romain » et « de
      la nation allemande » se fixent bien plus tard. Retirer « allemand » de la
      première phrase.
    sources: ["SRC-001"]
    confidence: "high"

  - existing_id: "de-luther"
    issue: >-
      Le résumé présuppose l’affichage public des thèses le 31 octobre 1517.
    proposal: >-
      Écrire que Luther envoie ses thèses aux évêques ; l’affichage à la porte
      de la Schlosskirche est une tradition non attestée par un témoin oculaire.
    sources: ["SRC-002", "SRC-016"]
    confidence: "high"

  - existing_id: "de-30ans"
    issue: >-
      Le sous-titre « L’Allemagne dévastée » nationalise un conflit européen.
    proposal: >-
      Remplacer par « Une guerre européenne dans l’Empire » et préciser les
      traités de Westphalie.
    sources: ["SRC-003"]
    confidence: "high"

  - existing_id: "de-1848"
    issue: >-
      Le résumé présente l’échec comme purement parlementaire et ignore
      l’exclusion des femmes.
    proposal: >-
      Ajouter le refus de la couronne par Frédéric-Guillaume IV, la campagne
      militaire et l’exclusion des femmes ; mentionner Louise Otto-Peters.
    sources: ["SRC-004", "SRC-017"]
    confidence: "high"

  - existing_id: "de-unification"
    issue: >-
      « Bismarck fonde l’Empire » personnalise un processus diplomatique et
      militaire.
    proposal: >-
      Titre « Proclamation de l’Empire allemand » ; préciser le 18 janvier 1871
      à Versailles et le rôle des princes.
    sources: ["SRC-004"]
    confidence: "high"

  - existing_id: "de-weimar"
    issue: >-
      Le résumé dit que la République « naît dans une Allemagne vaincue et
      humiliée » et mélange proclamation et constitution.
    proposal: >-
      Distinguer proclamation (9 novembre 1918) et constitution (11 août 1919) ;
      remplacer « humiliée » par une formulation factuelle sur la défaite et le
      traité de Versailles.
    sources: ["SRC-006"]
    confidence: "high"

  - existing_id: "de-inflation"
    issue: >-
      Le résumé fait de l’occupation de la Ruhr la cause unique de
      l’hyperinflation.
    proposal: >-
      Mentionner les causes fiscales, monétaires et politiques ; l’occupation de
      la Ruhr est un déclencheur, pas la cause unique.
    sources: ["SRC-006"]
    confidence: "high"

  - existing_id: "de-ww2"
    issue: >-
      Le résumé mentionne le génocide des Juifs mais pas les autres victimes,
      dont les Sinti et Roma.
    proposal: >-
      Ajouter les Sinti et Roma, les personnes handicapées et les prisonniers
      soviétiques ; ne pas diluer la Shoah.
    sources: ["SRC-007", "SRC-018"]
    confidence: "high"

  - existing_id: "de-wannsee"
    issue: >-
      Le résumé peut laisser croire que la conférence décide le génocide.
    proposal: >-
      Écrire qu’elle coordonne un génocide déjà engagé ; citer le protocole et
      le rôle d’Eichmann.
    sources: ["SRC-007"]
    confidence: "high"

  - existing_id: "de-rfa"
    issue: >-
      Le résumé confond la fondation de la RFA et celle de la RDA et ignore la
      Sarre.
    proposal: >-
      Donner les dates (23 mai 1949 ; 7 octobre 1949) et mentionner la Sarre
      jusqu’en 1957.
    sources: ["SRC-010"]
    confidence: "high"

  - existing_id: "de-1989"
    issue: >-
      Le résumé dit que le régime « ouvre la frontière » le 9 novembre, ce qui
      suggère une décision planifiée.
    proposal: >-
      Décrire la conférence de presse de Schabowski, l’afflux aux
      postes-frontières et la chute du Mur ; distinguer 9 octobre (Leipzig) et
      9 novembre (Berlin).
    sources: ["SRC-012"]
    confidence: "high"

  - existing_id: "de-1990"
    issue: >-
      Le résumé ne précise pas le mode d’unification.
    proposal: >-
      Ajouter le 3 octobre 1990 et l’article 23 de la Loi fondamentale ; parler
      d’accession des Länder.
    sources: ["SRC-012"]
    confidence: "high"

