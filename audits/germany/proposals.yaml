    title: "Expulsion des Allemands d’Europe centrale et orientale"
    subtitle: "Transferts de population après 1945"
    tags: ["guerre", "societe"]
    importance: 3
    summary: >-
      Après 1945, environ 12 à 14 millions d’Allemands quittent ou sont
      expulsés de Pologne, de Tchécoslovaquie, de Hongrie, de Yougoslavie et
      d’autres régions. Ces transferts s’inscrivent dans un contexte de
      vengeance, de redéfinition des frontières et de décisions interalliées.
      Ils transforment durablement la démographie allemande et la mémoire des
      expulsés.
    sources: ["SRC-015"]
    confidence: "high"
    rationale: >-
      La frise passe de 1945 à la RFA/RDA sans traiter les migrations forcées
      qui façonnent la société d’après-guerre.

  - id: "PROP-014"
    action: "add"
    existing_id: null
    year: 1953
    end_year: null
    title: "Soulèvement du 17 juin"
    subtitle: "La RDA face à ses ouvriers"
    tags: ["politique", "societe"]
    importance: 3
    summary: >-
      Le 17 juin 1953, des ouvriers en grève contre l’augmentation des normes
      manifestent dans plus de 70 villes de RDA ; à Berlin-Est, la foule
      réclame des élections libres. Les troupes soviétiques écrasent le
      mouvement. Le régime reste marqué par cet événement, qui devient un lieu
      de mémoire de l’opposition en RFA.
    sources: ["SRC-010"]
    confidence: "high"
    rationale: >-
      La RDA n’est pas seulement le Mur et la Stasi ; ce repère montre la
      conflictualité sociale du régime.

  - id: "PROP-015"
    action: "add"
    existing_id: null
    year: 1961
    end_year: null
    title: "Accord de recrutement germano-turc"
    subtitle: "Les Gastarbeiter et la fiction du retour"
    tags: ["societe", "economie"]
    importance: 3
    summary: >-
      Le 30 octobre 1961, la RFA et la Turquie signent à Bad Godesberg un
      accord de recrutement de travailleurs. Environ 870 000 Turcs viennent
      jusqu’en 1973, dont beaucoup s’installent malgré le principe de rotation.
      L’accord suit ceux conclus avec l’Italie (1955), l’Espagne et la Grèce
      (1960) ; l’Anwerbestopp de novembre 1973 met fin au recrutement.
    sources: ["SRC-009"]
    confidence: "high"
    rationale: >-
      Les migrations de travail sont absentes de la frise ; ce repère explique
      la diversité de l’Allemagne contemporaine.

  - id: "PROP-016"
    action: "add"
    existing_id: null
    year: 1968
    end_year: null
    title: "Attentat contre Rudi Dutschke"
    subtitle: "La révolte étudiante et l’APO"
    tags: ["societe", "politique"]
    importance: 2
    summary: >-
      Le 11 avril 1968, Rudi Dutschke, figure du SDS et de l’opposition
      extra-parlementaire, est grièvement blessé par un militant d’extrême
      droite à Berlin-Ouest. L’attentat déclenche des manifestations et des
      violences de masse, notamment contre le groupe Springer. Le mouvement
      conteste la guerre du Vietnam, les structures universitaires et la
      continuité des élites nazies.
    sources: ["SRC-011"]
    confidence: "high"
    rationale: >-
      1968 est un moment de politisation de la société ouest-allemande, absent
      de la frise.

  - id: "PROP-017"
    action: "add"
    existing_id: null
    year: 1989
    end_year: 1990
    title: "Révolution pacifique et réunification"
    subtitle: "De Leipzig à l’unité allemande"
    tags: ["politique", "societe"]
    importance: 3
    summary: >-
      Le 9 octobre 1989, environ 70 000 personnes manifestent à Leipzig après
      les prières pour la paix ; le 9 novembre, après la conférence de presse de
      Günter Schabowski, le Mur de Berlin s’ouvre sous la pression des
      manifestants. Après les élections libres du 18 mars 1990,
      les Länder de la RDA rejoignent la RFA le 3 octobre 1990 en vertu de
      l’article 23 de la Loi fondamentale. La réunification est une accession,
      non une fusion de deux États égaux.
    sources: ["SRC-012", "SRC-010"]
    confidence: "high"
    rationale: >-
      La frise sépare chute du Mur et réunification ; ce processus restitue la
      séquence et le rôle des mobilisations de Leipzig.

  - id: "PROP-018"
    action: "add"
    existing_id: null
    year: 2011
    end_year: null
    title: "Sortie accélérée du nucléaire"
    subtitle: "Fukushima et la Energiewende"
    tags: ["sciences", "societe"]
    importance: 2
    summary: >-
      Après l’accident de Fukushima du 11 mars 2011, le gouvernement allemand
      décrète un moratoire et le Bundestag vote en juin 2011 la sortie
      accélérée du nucléaire civil. La décision inverse la prolongation des
      centrales adoptée en 2010 et s’inscrit dans une histoire plus longue de
      l’antinucléarisme ouest-allemand. Elle devient un pilier de la politique
      énergétique de la République de Berlin.
    sources: ["SRC-014"]
    confidence: "high"
    rationale: >-
      L’environnement et l’énergie sont absents de la frise ; ce repère relie
      contestation sociale, science et politique.

