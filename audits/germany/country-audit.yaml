# Vectemporel — dossier pays (méthode v1.0)
# Allemagne — audit de première version, non signé.

schema_version: "1.0"
country:
  id: "germany"
  iso2: "DE"
  iso3: "DEU"
  name_current: "Allemagne"
  names_historical:
    - "Regnum Teutonicum / Regnum Teutonicorum (XIe–XIIe siècle)"
    - "Sacrum Romanum Imperium (attesté au Moyen Âge tardif)"
    - "Heiliges Römisches Reich deutscher Nation (fin du Moyen Âge–1806)"
    - "Deutscher Bund (1815–1866)"
    - "Deutsches Reich (1871–1945)"
    - "Bundesrepublik Deutschland (1949–)"
    - "Deutsche Demokratische Republik (1949–1990)"
  flag: "🇩🇪"

scope:
  territory_current: >-
    République fédérale d’Allemagne, 16 Länder, frontières de 1990. Les
    territoires situés à l’est de l’Oder et de la Neisse, ainsi que la
    Sarre jusqu’en 1957, sont traités comme des configurations historiques
    distinctes.
  territories_historical:
    - "Saint-Empire (962–1806), dit « romain germanique » à partir du Moyen Âge tardif, incluant des territoires italiens et bourguignons"
    - "Confédération germanique (1815–1866)"
    - "Empire allemand (1871–1918)"
    - "Colonies allemandes en Afrique et dans le Pacifique (1884–1918)"
    - "Territoires occupés par le Troisième Reich (1939–1945)"
    - "Zones d’occupation alliées (1945–1949)"
    - "République fédérale d’Allemagne et République démocratique allemande (1949–1990)"
    - "Sarre (1947–1956, rattachée en 1957)"
  regions_autonomous: []
  populations_included:
    - "citoyens allemands"
    - "minorités nationales reconnues : Sorbs, Danois, Frisons, Sinti et Roma"
    - "migrants, Gastarbeiter et descendants"
    - "réfugiés et demandeurs d’asile"
    - "personnes déplacées et expulsées après 1945"
    - "travailleurs forcés et victimes du nazisme"
  populations_excluded:
    - "les populations des territoires occupés ne sont incluses que lorsqu’elles sont en relation directe avec l’Allemagne"
    - "les diasporas allemandes hors d’Europe ne sont pas traitées comme objet principal"
    - "l’histoire autrichienne et suisse n’est pas incluse, sauf lorsque le Saint-Empire les relie"
  diasporas:
    - "Allemands de la Volga"
    - "Allemands des Sudètes"
    - "Aussiedler / Spätaussiedler"
    - "diaspora allemande aux Amériques"
  temporal:
    start_edtf: "962"
    end_edtf: "2026"
    start_rationale: >-
      962 est retenu comme convention historiographique : couronnement impérial
      d’Otton Ier à Rome le 2 février 962. Ce n’est ni la naissance d’un État
      allemand ni la création du titre « Saint-Empire ». Les alternatives
      examinées sont 911/919 (élection d’Henri Ier), 936 (Otton roi), 1254
      (première attestation de Sacrum Romanum Imperium) et 1512 (formule
      « deutscher Nation »).
    end_rationale: >-
      2026 est une borne de mise à jour, non une rupture historique. La période
      1990–2026 est traitée comme une séquence ouverte, avec des bornes
      internes indicatives (2005, 2015, 2022).
  unit_of_analysis: "fiche-événement"
  inclusion_criteria:
    - "événement ou processus documenté par au moins une synthèse savante ou une source institutionnelle vérifiée"
    - "impact structurel, portée collective ou valeur explicative"
    - "lien explicite avec l’espace germanique ou avec des populations en relation avec lui"
  exclusion_criteria:
    - "anecdote sans portée documentée"
    - "fait divers non relié à un processus historique"
    - "événement dont la date ou l’acteur ne peut être vérifié"
  audience: ["grand public", "scolaire", "diasporas", "recherche"]
  evidence_threshold: "deux sources indépendantes par fiche, ou exception documentée"

