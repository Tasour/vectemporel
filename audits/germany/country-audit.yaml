claims:
  - id: "CLAIM-001"
    subject: "962"
    predicate: "est une convention historiographique"
    object: "couronnement impérial d’Otton Ier"
    text: >-
      962 est retenu comme point de départ conventionnel : Otton Ier est couronné
      empereur à Rome le 2 février 962. Cet événement ne crée ni un État
      allemand ni le titre complet de Saint-Empire romain germanique.
    confidence: "probable"
    sources: ["SRC-001"]
    revisions: []
  - id: "CLAIM-002"
    subject: "L’affichage des 95 thèses"
    predicate: "n’est pas attesté par un témoin oculaire"
    object: "31 octobre 1517"
    text: >-
      Le récit de l’affichage des thèses à la porte de la Schlosskirche repose
      sur un témoignage tardif de Melanchthon (1546) ; Luther lui-même parle
      d’un envoi aux évêques. La date reste symbolique.
    confidence: "probable"
    sources: ["SRC-016", "SRC-002"]
    revisions: []
  - id: "CLAIM-003"
    subject: "La guerre de Trente Ans"
    predicate: "est une guerre européenne"
    object: "1618–1648"
    text: >-
      Le conflit implique des puissances extérieures à l’Empire et ne peut être
      réduit à une guerre civile allemande.
    confidence: "certain"
    sources: ["SRC-003"]
    revisions: []
  - id: "CLAIM-004"
    subject: "L’Assemblée nationale de Francfort"
    predicate: "exclut les femmes du vote et de la représentation"
    object: "1848–1849"
    text: >-
      Les femmes ne votent pas et ne siègent pas à la Paulskirche ; Louise
      Otto-Peters intervient publiquement sur la condition des ouvrières.
    confidence: "certain"
    sources: ["SRC-004", "SRC-017"]
    revisions: []
  - id: "CLAIM-005"
    subject: "L’ADAV"
    predicate: "est fondé"
    object: "Leipzig, 1863"
    text: >-
      L’Allgemeiner Deutscher Arbeiterverein est fondé à Leipzig en 1863 autour
      de Ferdinand Lassalle.
    confidence: "certain"
    sources: ["SRC-005"]
    revisions: []
  - id: "CLAIM-006"
    subject: "Le droit de vote des femmes"
    predicate: "est introduit avant la Constitution de Weimar"
    object: "1918"
    text: >-
      Le Conseil des commissaires du peuple annonce le droit de vote des femmes
      le 12 novembre 1918 ; la loi électorale du 30 novembre 1918 l’applique
      avant l’adoption de la Constitution de Weimar en août 1919.
    confidence: "certain"
    sources: ["SRC-006"]
    revisions: []
  - id: "CLAIM-007"
    subject: "La conférence de Wannsee"
    predicate: "coordonne un génocide déjà engagé"
    object: "20 janvier 1942"
    text: >-
      La conférence ne décide pas le génocide ; elle organise la coopération
      administrative pour une extermination déjà en cours.
    confidence: "certain"
    sources: ["SRC-007"]
    revisions: []
  - id: "CLAIM-008"
    subject: "Le travail forcé nazi"
    predicate: "implique plus de douze millions de personnes"
    object: "1939–1945"
    text: >-
      Plus de 12 millions de civils, prisonniers de guerre et détenus sont
      employés de force dans le Reich ; le pic mensuel atteint 7,8 millions en
      août 1944.
    confidence: "probable"
    sources: ["SRC-008"]
    revisions: []
  - id: "CLAIM-009"
    subject: "Les Gastarbeiter"
    predicate: "s’installent durablement malgré le principe de rotation"
    object: "RFA, 1955–1973"
    text: >-
      Les accords de recrutement prévoient un retour, mais une partie des
      travailleurs reste et fait venir sa famille ; l’Anwerbestopp de 1973
      renforce cette installation.
    confidence: "certain"
    sources: ["SRC-009"]
    revisions: []
  - id: "CLAIM-010"
    subject: "La réunification de 1990"
    predicate: "est une accession"
    object: "article 23 de la Loi fondamentale"
    text: >-
      Les Länder de la RDA rejoignent la RFA le 3 octobre 1990 en vertu de
      l’article 23 de la Loi fondamentale ; il ne s’agit pas d’une fusion de
      deux États égaux.
    confidence: "certain"
    sources: ["SRC-012"]
    revisions: []
  - id: "CLAIM-011"
    subject: "Le génocide Herero et Nama"
    predicate: "est reconnu par l’Allemagne"
    object: "2021"
    text: >-
      En mai 2021, le gouvernement allemand qualifie les événements de
      1904–1908 de génocide « d’aujourd’hui », annonce son intention de
      demander pardon et un programme de 1,1 milliard d’euros, sans
      reconnaissance juridique de réparations.
    confidence: "certain"
    sources: ["SRC-020"]
    revisions: []
  - id: "CLAIM-012"
    subject: "La sortie du nucléaire"
    predicate: "est accélérée après Fukushima"
    object: "2011"
    text: >-
      Après l’accident de Fukushima (11 mars 2011), le gouvernement allemand
      décrète un moratoire et le Bundestag vote en juin 2011 la sortie
      accélérée du nucléaire civil, inversant la prolongation de 2010.
    confidence: "certain"
    sources: ["SRC-014"]
    revisions: []

