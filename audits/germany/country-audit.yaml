historiography:
  schools:
    - "histoire politique nationale (Ranke, puis histoire de l’État)"
    - "histoire sociale critique (Wehler, Kocka, Lüdtke)"
    - "histoire culturelle et de la vie quotidienne (Blackbourn, Confino, Lüdtke)"
    - "histoire du genre (Canning, Hagemann, Herzog)"
    - "histoire coloniale et globale (Conrad, Zimmerer, Kundrus)"
    - "histoire environnementale (Blackbourn, Uekötter)"
    - "histoire de la mémoire et de la Shoah (Friedländer, Fulbrook, Frei)"
    - "histoire régionale (Bavière, Saxe, Rhénanie, Prusse)"
  national_narratives:
    - "Reich médiéval → Réforme → unification de 1871 → catastrophe 1914–1945 → rédemption démocratique de 1949/1990"
    - "thèse du Sonderweg et sa critique"
    - "Wirtschaftswunder comme récit de reconstruction"
    - "Vergangenheitsbewältigung et culture de la mémoire"
  counter_narratives:
    - "régionalismes et histoires des Länder"
    - "minorités sorabes, danoises, frisonnes, sinti et roma"
    - "histoire ouvrière et sociale"
    - "histoire des femmes et des sexualités"
    - "mémoire coloniale et postcoloniale"
    - "RDA comme société et dictature, au-delà du seul récit de la Stasi"
    - "migrations et Gastarbeiter"
  structuring_debates:
    - "Sonderweg : exceptionnalité allemande ou trajectoire européenne comparée ?"
    - "continuité ou rupture entre Empire, Weimar et nazisme"
    - "Historikerstreit (1986) et normativisation de la Shoah"
    - "Goldhagen et le rôle des « Allemands ordinaires »"
    - "1945 : effondrement, libération ou « heure zéro » ?"
    - "1990 : accession, annexion ou réunification négociée ?"
    - "génocide colonial Herero/Nama et réparations"
    - "Energiewende et sortie du nucléaire"
  blind_spots:
    - "femmes, genre et sexualités"
    - "classes populaires et travail"
    - "minorités et peuples autochtones"
    - "migrations et diasporas"
    - "environnement et territoire"
    - "sciences, techniques et santé"
    - "histoire régionale"
    - "handicap et victimes non juives du nazisme"
    - "mémoire coloniale"
  key_syntheses:
