periodizations:
  - id: "POL-1"
    label: "Périodisation politique en neuf séquences"
    type: "political"
    start_edtf: "962"
    end_edtf: "2026"
    rationale: >-
      Elle distingue les configurations de souveraineté : Reich médiéval,
      confessionnalisation, Lumières et réformes, vers l’unité, Empire,
      guerre et Weimar, nazisme, occupation et deux Allemagnes, République
      réunifiée. Elle est retenue pour le récit principal, mais ses bornes
      restent discutées.
    sources: ["SRC-001", "SRC-003", "SRC-004", "SRC-005", "SRC-006", "SRC-007", "SRC-010", "SRC-012"]
    selected: true
  - id: "SOC-1"
    label: "Périodisation sociale et économique"
    type: "social_economic"
    start_edtf: "1500"
    end_edtf: "2026"
    rationale: >-
      Phases proposées : économie agraire et proto-industrielle (1500–1800),
      industrialisation et formation du prolétariat (1800–1914), économies de
      guerre et crises (1914–1945), Wirtschaftswunder et Gastarbeiter
      (1945–1973), désindustrialisation et chômage (1973–1990), transformation
      post-socialiste et transition énergétique (1990–2026).
    sources: ["SRC-004", "SRC-005", "SRC-008", "SRC-009", "SRC-010", "SRC-014"]
    selected: false
  - id: "CULT-1"
    label: "Périodisation culturelle, religieuse et environnementale"
    type: "cultural_religious_environmental"
    start_edtf: "962"
    end_edtf: "2026"
    rationale: >-
      Phases proposées : christianisation et culture impériale (962–1517),
      confessionnalisation (1517–1648), Lumières et piétisme (1648–1800),
      sécularisation et sciences (1800–1914), culture de masse et nazisme
      (1914–1945), deux cultures et mémoire (1945–1990), République de Berlin,
      mémoire de la Shoah et Energiewende (1990–2026).
    sources: ["SRC-002", "SRC-003", "SRC-006", "SRC-007", "SRC-013", "SRC-014"]
    selected: false

periods:
  - id: "PERIOD-1"
    label: "Reich médiéval"
    start_edtf: "962"
    end_edtf: "1517"
    boundary_type: "political"
    boundary_rationale: >-
      Le couronnement d’Otton Ier à Rome (2 février 962) est retenu comme
      convention de départ. L’Empire est composite et son titre complet se fixe
      bien après 962. La borne de 1517 marque le début de la Réforme, non la fin
      de l’Empire.
    alternatives_considered: ["911", "919", "936", "1254", "1512"]
    sources: ["SRC-001"]
  - id: "PERIOD-2"
    label: "Réforme et guerre de Trente Ans"
    start_edtf: "1517"
    end_edtf: "1648"
    boundary_type: "religious"
    boundary_rationale: >-
      1517 est une borne symbolique (diffusion des thèses), non un acte
      documenté d’affichage. 1648 clôt la guerre de Trente Ans et redéfinit
      l’ordre impérial.
    alternatives_considered: ["1517", "1521", "1555", "1618", "1648"]
    sources: ["SRC-002", "SRC-016", "SRC-003"]
  - id: "PERIOD-3"
    label: "Lumières, absolutisme et réformes"
    start_edtf: "1648"
    end_edtf: "1815"
    boundary_type: "political"
    boundary_rationale: >-
      1648 ouvre une période de reconstruction et de coexistence
      confessionnelle ; 1815 clôt les guerres napoléoniennes et réorganise
      l’Allemagne en Confédération germanique.
    alternatives_considered: ["1648", "1740", "1789", "1806", "1815"]
    sources: ["SRC-003", "SRC-004"]
  - id: "PERIOD-4"
    label: "Vers l’unité"
    start_edtf: "1815"
    end_edtf: "1871"
    boundary_type: "political"
    boundary_rationale: >-
      1815 ouvre le Vormärz et la Confédération germanique ; 1871 marque la
      proclamation de l’Empire allemand après la guerre franco-prussienne.
    alternatives_considered: ["1815", "1830", "1848", "1866", "1871"]
    sources: ["SRC-004"]
  - id: "PERIOD-5"
    label: "Empire allemand"
    start_edtf: "1871"
    end_edtf: "1914"
    boundary_type: "political"
    boundary_rationale: >-
      1871 installe un Empire fédéral à suffrage masculin restreint ; 1914
      marque l’entrée dans la Première Guerre mondiale et la fin de l’ordre
      impérial.
    alternatives_considered: ["1871", "1890", "1914"]
    sources: ["SRC-004", "SRC-005"]
  - id: "PERIOD-6"
    label: "Guerre, révolution et Weimar"
    start_edtf: "1914"
    end_edtf: "1933"
    boundary_type: "military"
    boundary_rationale: >-
      1914 ouvre la guerre qui provoque la chute de l’Empire ; 1933 marque
      l’arrivée de Hitler au pouvoir et la fin de la République de Weimar.
    alternatives_considered: ["1914", "1918", "1919", "1929", "1933"]
    sources: ["SRC-006"]
  - id: "PERIOD-7"
    label: "Nazisme et guerre"
    start_edtf: "1933"
    end_edtf: "1945"
    boundary_type: "political"
    boundary_rationale: >-
      1933 ouvre la dictature nazie ; 1945 marque la défaite, la fin de la
      guerre en Europe et le début de l’occupation alliée.
    alternatives_considered: ["1933", "1939", "1941", "1945"]
    sources: ["SRC-007"]
  - id: "PERIOD-8"
    label: "Occupation et deux Allemagnes"
    start_edtf: "1945"
    end_edtf: "1990"
    boundary_type: "military"
    boundary_rationale: >-
      1945 ouvre l’occupation et la reconstruction ; 1949 voit la fondation
      de la RFA et de la RDA ; 1990 met fin à la division.
    alternatives_considered: ["1945", "1949", "1961", "1989", "1990"]
    sources: ["SRC-010", "SRC-012", "SRC-015"]
  - id: "PERIOD-9"
    label: "Allemagne réunifiée"
    start_edtf: "1990"
    end_edtf: "2026"
    boundary_type: "political"
    boundary_rationale: >-
      1990 marque l’accession des Länder de la RDA à la RFA ; la période est
      ouverte et segmentée par des bornes internes (2005, 2015, 2022).
    alternatives_considered: ["1990", "2005", "2015", "2022"]
    sources: ["SRC-012", "SRC-014"]

